async function handleWalletRecharge(e) {
  e.preventDefault();
  const amountInput = document.getElementById('rechargeAmount');
  const amount = parseInt(amountInput.value);
  if (!amount || amount < 100 || amount > 50000) {
    toast('Please enter an amount between ₹100 and ₹50,000', 'error');
    return;
  }

  const btn = document.getElementById('rechargeBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...'; }

  const orderRes = await api('/wallet/recharge/create-order', { method: 'POST', body: { amount } });

  if (!orderRes.success) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus"></i> Add Money'; }
    toast(orderRes.message || 'Failed to create recharge order', 'error');
    return;
  }

  closeModal();

  const options = {
    key: orderRes.key_id,
    amount: amount * 100,
    currency: 'INR',
    name: 'VIBES@Outing',
    description: 'Wallet Recharge — ₹' + amount,
    image: 'https://img.icons8.com/3d-fluency/94/compass.png',
    order_id: orderRes.order_id,
    handler: async function (response) {
      const verifyRes = await api('/wallet/recharge/verify', { method: 'POST', body: {
        razorpay_order_id: response.razorpay_order_id,
        razorpay_payment_id: response.razorpay_payment_id,
        razorpay_signature: response.razorpay_signature,
        amount: amount
      }});
      if (verifyRes.success) {
        toast('💰 ₹' + amount + ' added to your wallet!', 'success');
        openModal(`
          <button class="close" onclick="closeModal()">&times;</button>
          <div style="text-align:center;padding:1.5rem">
            <div style="font-size:3rem;margin-bottom:1rem">💰</div>
            <h2 style="color:var(--success)">Wallet Recharged!</h2>
            <p style="color:var(--text-light);margin:.75rem 0">₹${amount} has been added to your Vibes Wallet.</p>
            <div style="background:#F8FAFC;padding:1rem;border-radius:10px;margin:1rem 0">
              <p style="margin:.25rem 0"><strong>Amount Added:</strong> <span style="color:var(--success);font-weight:700">+₹${amount}</span></p>
              <p style="margin:.25rem 0"><strong>New Balance:</strong> <span style="color:var(--primary);font-weight:700">₹${verifyRes.balance}</span></p>
              <p style="margin:.25rem 0;font-size:.8rem;color:var(--text-light)">Ref: ${verifyRes.payment_id || response.razorpay_payment_id}</p>
            </div>
            <button class="btn btn-primary btn-block" onclick="closeModal();navigate('wallet')"><i class="fas fa-wallet"></i> View Wallet</button>
          </div>
        `);
      } else {
        toast(verifyRes.message || 'Payment verification failed', 'error');
      }
    },
    prefill: {
      name: currentUser ? currentUser.name : '',
      email: currentUser ? (currentUser.email || '') : '',
    },
    theme: { color: '#6C3CE1' },
    modal: {
      ondismiss: function () {
        toast('Wallet recharge cancelled', 'error');
      }
    }
  };

  const rzp = new Razorpay(options);
  rzp.open();
}

        <div class="form-group"><label>Select Outing</label>
          <select id="galleryOutingId" required>
            <option value="">-- Select an outing --</option>
            ${list.map(o => `<option value="${o.id}">${escapeHtml(o.title)} — ${escapeHtml(o.location)} (${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})})</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>Gallery Title</label><input type="text" id="galleryTitle" required placeholder="e.g. Goa Beach Vibes 🌊" maxlength="300"></div>
        <div class="form-group"><label>Cover Image URL (optional)</label><input type="text" id="galleryCover" placeholder="https://..."></div>
        <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-plus-circle"></i> Create Gallery</button>
      </form>
    `);
    document.getElementById('createGalleryForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
      const res = await api('/gallery/create', { method: 'POST', body: {
        outing_id: parseInt(document.getElementById('galleryOutingId').value),
        title: document.getElementById('galleryTitle').value.trim(),
        cover_image: document.getElementById('galleryCover').value.trim()
      }});
      if (res.success) { toast('Gallery created! Now add photos.', 'success'); closeModal(); openGalleryManager(res.galleryId); }
      else { toast(res.message || 'Failed to create gallery', 'error'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus-circle"></i> Create Gallery'; }
    };
  });
}

async function openGalleryManager(galleryId) {
  const gallery = await api('/admin/gallery/' + galleryId);
  if (!gallery || !gallery.id) { toast('Gallery not found', 'error'); return; }
  const media = gallery.media || [];
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-images" style="color:var(--primary)"></i> ${escapeHtml(gallery.title)}</h2>
    <p style="color:var(--text-light);font-size:.85rem;margin-bottom:1rem">${escapeHtml(gallery.outing_title)} — ${escapeHtml(gallery.outing_location)} • ${gallery.published ? '✅ Published' : '📝 Draft'}</p>

    <div style="margin-bottom:1.5rem">
      <h4 style="margin-bottom:.75rem">Add Photos</h4>
      <div id="galleryUploadUrls">
        <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center" class="url-row">
          <input type="text" placeholder="Image URL (https://...)" style="flex:1" class="gallery-url-input">
          <input type="text" placeholder="Caption (optional)" style="flex:.7" class="gallery-caption-input">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-sm" style="background:#F1F5F9" onclick="addUrlRow()"><i class="fas fa-plus"></i> Add Row</button>
        <button class="btn btn-sm btn-primary" onclick="uploadGalleryMedia(${galleryId})"><i class="fas fa-upload"></i> Upload</button>
      </div>
    </div>

    <h4 style="margin-bottom:.75rem">Media (${media.length})</h4>
    ${media.length ? `<div class="media-preview-grid">${media.map(m => `
      <div class="media-preview-item">
        <img src="${escapeHtml(m.media_url)}" alt="${escapeHtml(m.caption || '')}" loading="lazy">
        <button class="remove-btn" onclick="deleteGalleryMedia(${m.id}, ${galleryId})" title="Delete"><i class="fas fa-times"></i></button>
      </div>
    `).join('')}</div>` : '<p style="color:var(--text-light);font-size:.85rem">No media yet. Add photo URLs above.</p>'}
  `);
}

function addUrlRow() {
  const container = document.getElementById('galleryUploadUrls');
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center';
  row.className = 'url-row';
  row.innerHTML = '<input type="text" placeholder="Image URL (https://...)" style="flex:1" class="gallery-url-input"><input type="text" placeholder="Caption (optional)" style="flex:.7" class="gallery-caption-input"><button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()" style="padding:4px 8px"><i class="fas fa-times"></i></button>';
  container.appendChild(row);
}

async function uploadGalleryMedia(galleryId) {
  const rows = document.querySelectorAll('.url-row');
  const media = [];
  rows.forEach(row => {
    const url = row.querySelector('.gallery-url-input').value.trim();
    const caption = row.querySelector('.gallery-caption-input').value.trim();
    if (url) media.push({ url, caption, media_type: /\.(mp4|webm|ogg|mov)(\?|$)/i.test(url) ? 'video' : 'image' });
  });
  if (!media.length) { toast('Add at least one image URL', 'error'); return; }
  const res = await api('/gallery/upload', { method: 'POST', body: { gallery_id: galleryId, media } });
  if (res.success) { toast(`${res.uploaded} photo(s) uploaded!`, 'success'); openGalleryManager(galleryId); }
  else toast(res.message || 'Upload failed', 'error');
}

async function deleteGalleryMedia(mediaId, galleryId) {
  if (!confirm('Delete this photo?')) return;
  const res = await api('/gallery/media/' + mediaId, { method: 'DELETE' });
  if (res.success) { toast('Photo deleted', 'success'); openGalleryManager(galleryId); }
  else toast('Delete failed', 'error');
}

async function toggleGalleryPublish(galleryId, published) {
  const action = published ? 'publish' : 'unpublish';
  if (!confirm(`${action.charAt(0).toUpperCase() + action.slice(1)} this gallery? ${published ? 'Users who completed this trip will be notified.' : ''}`)) return;
  const res = await api('/gallery/publish', { method: 'PUT', body: { gallery_id: galleryId, published } });
  if (res.success) { toast(`Gallery ${action}ed!`, 'success'); renderAdminGalleries(); }
  else toast(res.message || 'Failed', 'error');
}

async function deleteGallery(galleryId) {
  if (!confirm('Delete this gallery and all its photos? This cannot be undone.')) return;
  const res = await api('/gallery/' + galleryId, { method: 'DELETE' });
  if (res.success) { toast('Gallery deleted', 'success'); renderAdminGalleries(); }
  else toast(res.message || 'Delete failed', 'error');
}

// ─── USER GALLERY (MY GALLERIES) ───────────────────────────────
async function renderUserGalleries(app) {
  if (!currentUser) { showLogin(); return; }
  const galleries = await api('/user/galleries');
  const list = Array.isArray(galleries) ? galleries : [];
  app.innerHTML = `
    <section class="section">
      <h2 class="section-title">📸 My Trip Galleries</h2>
      <p class="section-subtitle">Relive your best moments from completed outings</p>
      ${list.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem">
        ${list.map(g => {
          const coverImg = g.cover_image || g.outing_image || 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600';
          return `<div class="gallery-card" onclick="openUserGallery(${g.id})">
            <div class="cover" style="background-image:url('${escapeHtml(coverImg)}')">
              <span class="photo-count"><i class="fas fa-image"></i> ${g.media_count || 0}</span>
            </div>
            <div class="info">
              <h4>${escapeHtml(g.outing_title)}</h4>
              <div class="meta">
                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(g.outing_location)}</span>
                <span><i class="fas fa-calendar-alt"></i> ${new Date(g.outing_date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>` : `<div style="text-align:center;padding:4rem 2rem">
        <i class="fas fa-camera-retro" style="font-size:4rem;color:var(--primary);opacity:.3;margin-bottom:1.5rem;display:block"></i>
        <h3 style="color:var(--text);margin-bottom:.75rem">No galleries yet</h3>
        <p style="color:var(--text-light);max-width:400px;margin:0 auto">Your trip memories will appear here after your outing is completed and the gallery is published by the team.</p>
      </div>`}
    </section>
  `;
}

// ─── GALLERY LIGHTBOX STATE ─────────────────────────────────────
let galleryMedia = [];
let galleryLightboxIdx = 0;

async function openUserGallery(galleryId) {
  const gallery = await api('/gallery/' + galleryId);
  if (!gallery || !gallery.id) {
    if (gallery && gallery.message) toast(gallery.message, 'error');
    else toast('Gallery not available', 'error');
    return;
  }
  galleryMedia = gallery.media || [];
  const app = document.getElementById('app');
  const coverImg = gallery.cover_image || 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600';
  app.innerHTML = `
    <section class="section">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap">
        <button class="btn btn-sm" style="background:#F1F5F9" onclick="navigate('galleries')"><i class="fas fa-arrow-left"></i> Back</button>
        <div>
          <h2 class="section-title" style="margin-bottom:0">${escapeHtml(gallery.title)}</h2>
          <p style="color:var(--text-light);font-size:.9rem">${escapeHtml(gallery.outing_title)} — ${escapeHtml(gallery.outing_location)} • ${new Date(gallery.outing_date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</p>
        </div>
      </div>
      <div style="background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:1.5rem 2rem;border-radius:16px;margin-bottom:2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
        <i class="fas fa-heart" style="font-size:1.5rem"></i>
        <div><h3 style="margin:0;font-size:1.1rem">Memories from your trip</h3><p style="margin:0;opacity:.85;font-size:.85rem">${galleryMedia.length} photos</p></div>
      </div>
      ${galleryMedia.length ? `<div class="gallery-grid">${galleryMedia.map((m, idx) => `
        <div class="gallery-item" onclick="openLightbox(${idx})">
          ${m.media_type === 'video' ?
            `<video src="${escapeHtml(m.media_url)}" preload="metadata" muted></video>` :
            `<img src="${escapeHtml(m.media_url)}" alt="${escapeHtml(m.caption || 'Trip photo')}" loading="lazy">`}
          <div class="gallery-overlay">
            <span class="caption">${m.caption ? escapeHtml(m.caption) : ''}</span>
            <span class="actions">
              <button onclick="event.stopPropagation();toggleLike(${m.id}, this)" title="Like">
                <i class="fas fa-heart ${m.liked_by_me ? 'liked' : ''}" style="${m.liked_by_me ? 'color:#EF4444' : ''}"></i>
                <small>${m.like_count || 0}</small>
              </button>
              <button onclick="event.stopPropagation();downloadMedia('${escapeHtml(m.media_url)}')" title="Download"><i class="fas fa-download"></i></button>
            </span>
          </div>
        </div>
      `).join('')}</div>` : '<p style="color:var(--text-light);text-align:center;padding:2rem">No photos in this gallery yet.</p>'}
    </section>
    <div class="gallery-lightbox" id="galleryLightbox">
      <button class="lb-close" onclick="closeLightbox()">&times;</button>
      <button class="lb-nav lb-prev" onclick="lightboxNav(-1)"><i class="fas fa-chevron-left"></i></button>
      <div id="lightboxContent"></div>
      <button class="lb-nav lb-next" onclick="lightboxNav(1)"><i class="fas fa-chevron-right"></i></button>
      <div class="lb-info"><div class="caption" id="lbCaption"></div><div class="counter" id="lbCounter"></div></div>
      <div class="lb-actions">
        <button onclick="toggleLikeLB()" id="lbLikeBtn"><i class="fas fa-heart"></i> Like</button>
        <button onclick="downloadCurrentMedia()"><i class="fas fa-download"></i> Download</button>
      </div>
    </div>
  `;
}

function openLightbox(idx) {
  galleryLightboxIdx = idx;
  document.getElementById('galleryLightbox').classList.add('active');
  renderLightboxContent();
  document.addEventListener('keydown', lightboxKeyHandler);
}

function closeLightbox() {
  document.getElementById('galleryLightbox').classList.remove('active');
  document.removeEventListener('keydown', lightboxKeyHandler);
  // Pause any video
  const video = document.querySelector('#lightboxContent video');
  if (video) video.pause();
}

function lightboxKeyHandler(e) {
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lightboxNav(-1);
  else if (e.key === 'ArrowRight') lightboxNav(1);
}

function lightboxNav(dir) {
  galleryLightboxIdx = (galleryLightboxIdx + dir + galleryMedia.length) % galleryMedia.length;
  renderLightboxContent();
}

function renderLightboxContent() {
  const m = galleryMedia[galleryLightboxIdx];
  if (!m) return;
  const content = document.getElementById('lightboxContent');
  if (m.media_type === 'video') {
    content.innerHTML = `<video src="${escapeHtml(m.media_url)}" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:8px"></video>`;
  } else {
    content.innerHTML = `<img src="${escapeHtml(m.media_url)}" alt="${escapeHtml(m.caption || '')}" style="max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px">`;
  }
  document.getElementById('lbCaption').textContent = m.caption || '';
  document.getElementById('lbCounter').textContent = `${galleryLightboxIdx + 1} / ${galleryMedia.length}`;
  const likeBtn = document.getElementById('lbLikeBtn');
  likeBtn.innerHTML = `<i class="fas fa-heart" style="${m.liked_by_me ? 'color:#EF4444' : ''}"></i> ${m.liked_by_me ? 'Liked' : 'Like'}`;
}

async function toggleLike(mediaId, btnEl) {
  const res = await api('/gallery/media/' + mediaId + '/like', { method: 'POST' });
  if (res.success) {
    const m = galleryMedia.find(x => x.id === mediaId);
    if (m) {
      m.liked_by_me = res.liked ? 1 : 0;
      m.like_count = (m.like_count || 0) + (res.liked ? 1 : -1);
    }
    const icon = btnEl.querySelector('i');
    const count = btnEl.querySelector('small');
    if (res.liked) { icon.classList.add('liked'); icon.style.color = '#EF4444'; }
    else { icon.classList.remove('liked'); icon.style.color = ''; }
    if (count && m) count.textContent = m.like_count;
  }
}

async function toggleLikeLB() {
  const m = galleryMedia[galleryLightboxIdx];
  if (!m) return;
  const res = await api('/gallery/media/' + m.id + '/like', { method: 'POST' });
  if (res.success) {
    m.liked_by_me = res.liked ? 1 : 0;
    m.like_count = (m.like_count || 0) + (res.liked ? 1 : -1);
    renderLightboxContent();
  }
}

function downloadMedia(url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = '';
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function downloadCurrentMedia() {
  const m = galleryMedia[galleryLightboxIdx];
  if (m) downloadMedia(m.media_url);
}

// ─── INIT ───────────────────────────────────────────────────────
renderNav();
initOfferBar();
(async () => {
  if (_pendingPasswordReset) return;
  const migratedPage = await migrateLegacyOutingHashRoute();
  const initialPage = migratedPage || resolvePageFromUrl();
  await navigate(initialPage, true);
})();
</script>
