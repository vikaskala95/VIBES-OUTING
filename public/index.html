<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBES@Outing — GenZ Group Outings | Discover, Join & Explore</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root {
  --primary: #6C3CE1;
  --primary-light: #8B5CF6;
  --primary-dark: #5521C5;
  --secondary: #F97316;
  --accent: #06D6A0;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text: #1E293B;
  --text-light: #64748B;
  --border: #E2E8F0;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 24px rgba(108,60,225,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.nav-logo{font-weight:800;font-size:1.4rem;color:var(--primary);display:flex;align-items:center;gap:.5rem}
.nav-logo i{font-size:1.2rem;background:var(--primary);color:#fff;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.nav-links{display:flex;gap:.5rem;align-items:center}
.nav-links a,.nav-links button{padding:.5rem 1rem;border-radius:10px;font-size:.875rem;font-weight:500;border:none;background:none;color:var(--text-light);transition:.2s}
.nav-links a:hover,.nav-links button:hover{background:var(--primary);color:#fff}
.nav-links .btn-primary{background:var(--primary);color:#fff}
.nav-links .user-badge{background:var(--primary);color:#fff;padding:.4rem .8rem;border-radius:20px;font-size:.8rem;font-weight:600}

/* HERO */
.hero{background:linear-gradient(135deg,#6C3CE1 0%,#8B5CF6 50%,#A78BFA 100%);color:#fff;padding:6rem 2rem 4rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;background:rgba(255,255,255,.06);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-30%;left:-10%;width:400px;height:400px;background:rgba(255,255,255,.04);border-radius:50%}
.hero h1{font-size:3rem;font-weight:800;margin-bottom:1rem;position:relative;z-index:1}
.hero p{font-size:1.2rem;opacity:.9;max-width:600px;margin:0 auto 2rem;position:relative;z-index:1}
.hero-buttons{display:flex;gap:1rem;justify-content:center;position:relative;z-index:1;flex-wrap:wrap}
.btn{padding:.75rem 1.5rem;border-radius:12px;font-weight:600;font-size:.95rem;border:none;transition:.2s;display:inline-flex;align-items:center;gap:.5rem}
.btn-white{background:#fff;color:var(--primary)}
.btn-white:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-outline-white{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4)}
.btn-outline-white:hover{background:rgba(255,255,255,.15)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-secondary{background:var(--secondary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:.4rem .8rem;font-size:.8rem;border-radius:8px}
.btn-block{width:100%}

/* STATS BAR */
.stats-bar{display:flex;justify-content:center;gap:3rem;padding:2rem;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.stat-item{text-align:center}
.stat-item .num{font-size:2rem;font-weight:800;color:var(--primary)}
.stat-item .label{font-size:.85rem;color:var(--text-light)}

/* SECTION */
.section{padding:3rem 2rem;max-width:1200px;margin:0 auto}
.section-title{font-size:1.8rem;font-weight:700;margin-bottom:.5rem}
.section-subtitle{color:var(--text-light);margin-bottom:2rem}

/* FILTERS */
.filters{display:flex;gap:.75rem;margin-bottom:2rem;flex-wrap:wrap}
.filters input,.filters select{padding:.6rem 1rem;border:1px solid var(--border);border-radius:10px;font-size:.9rem;background:#fff}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,60,225,.1)}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card-img{height:200px;background-size:cover;background-position:center;position:relative}
.card-img .badge{position:absolute;top:12px;right:12px;background:var(--primary);color:#fff;padding:.3rem .7rem;border-radius:8px;font-size:.75rem;font-weight:600}
.card-img .spots-left{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;padding:.25rem .6rem;border-radius:6px;font-size:.75rem}
.card-body{padding:1.25rem}
.card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.card-meta{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:.75rem;font-size:.85rem;color:var(--text-light)}
.card-meta span{display:flex;align-items:center;gap:.3rem}
.card-body p{font-size:.9rem;color:var(--text-light);margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.price{font-size:1.2rem;font-weight:800;color:var(--primary)}
.price small{font-size:.75rem;font-weight:400;color:var(--text-light)}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:.3s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:var(--radius);max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem;position:relative}
.modal h2{font-size:1.4rem;font-weight:700;margin-bottom:1.5rem}
.modal .close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.2rem;color:var(--text-light)}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem;color:var(--text)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:.65rem .9rem;border:1px solid var(--border);border-radius:10px;font-size:.9rem}
.form-group textarea{min-height:80px;resize:vertical}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,60,225,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* DASHBOARD */
.dashboard{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:1.5rem 0}
.sidebar a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.5rem;font-size:.9rem;color:var(--text-light);transition:.2s}
.sidebar a:hover,.sidebar a.active{background:rgba(108,60,225,.06);color:var(--primary);border-right:3px solid var(--primary)}
.sidebar a i{width:20px;text-align:center}
.dash-content{padding:2rem}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.dash-stat{background:#fff;padding:1.5rem;border-radius:var(--radius);box-shadow:var(--shadow)}
.dash-stat .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:.75rem}
.dash-stat h4{font-size:.85rem;color:var(--text-light);margin-bottom:.25rem}
.dash-stat .value{font-size:1.8rem;font-weight:800}

/* TABLE */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:.75rem 1rem;text-align:left;border-bottom:1px solid var(--border);font-size:.875rem}
th{font-weight:600;color:var(--text-light);background:#FAFBFC}
.status{padding:.2rem .6rem;border-radius:6px;font-size:.75rem;font-weight:600}
.status-paid,.status-approved,.status-active{background:#D1FAE5;color:#065F46}
.status-pending{background:#FEF3C7;color:#92400E}
.status-rejected,.status-cancelled{background:#FEE2E2;color:#991B1B}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--text);color:#fff;padding:1rem 1.5rem;border-radius:12px;font-size:.9rem;z-index:300;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

/* REVIEWS */
.review-card{background:#F8FAFC;padding:1rem;border-radius:10px;margin-bottom:.75rem}
.review-card .stars{color:#F59E0B;margin-bottom:.25rem}
.review-card .reviewer{font-weight:600;font-size:.85rem}
.review-card .review-text{font-size:.85rem;color:var(--text-light);margin-top:.25rem}
.star-input{display:flex;gap:.25rem;margin-bottom:.5rem}
.star-input i{font-size:1.5rem;color:var(--border);cursor:pointer;transition:.2s}
.star-input i.active,.star-input i:hover{color:#F59E0B}

/* CHAT */
.chat-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;max-width:700px;margin:0 auto}
.chat-header{background:var(--primary);color:#fff;padding:1rem 1.5rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.chat-messages{height:350px;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.chat-msg{max-width:75%;padding:.6rem 1rem;border-radius:12px;font-size:.9rem}
.chat-msg.mine{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:#F1F5F9;color:var(--text);border-bottom-left-radius:4px}
.chat-msg .msg-name{font-size:.7rem;font-weight:600;opacity:.7;margin-bottom:2px}
.chat-msg .msg-time{font-size:.65rem;opacity:.5;margin-top:2px;text-align:right}
.chat-input{display:flex;border-top:1px solid var(--border);padding:.75rem}
.chat-input input{flex:1;border:1px solid var(--border);border-radius:10px;padding:.5rem .75rem;font-size:.9rem;margin-right:.5rem}
.chat-input input:focus{outline:none;border-color:var(--primary)}

/* VERIFICATION BADGE */
.verified-badge{display:inline-flex;align-items:center;gap:.25rem;background:#D1FAE5;color:#065F46;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600}
.unverified-badge{display:inline-flex;align-items:center;gap:.25rem;background:#FEF3C7;color:#92400E;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600}

/* AI RECOMMENDATION */
.rec-reasons{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.rec-reason{background:rgba(108,60,225,.08);color:var(--primary);padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:500}
.ai-badge{background:linear-gradient(135deg,#6C3CE1,#F97316);color:#fff;padding:.2rem .6rem;border-radius:6px;font-size:.7rem;font-weight:700}

/* FOOTER */
.footer{background:var(--text);color:#fff;padding:3rem 2rem;text-align:center}
.footer p{opacity:.6;font-size:.85rem}

/* RESPONSIVE */
@media(max-width:768px){
  .hero h1{font-size:2rem}
  .cards-grid{grid-template-columns:1fr}
  .dashboard{grid-template-columns:1fr}
  .sidebar{display:none}
  .form-row{grid-template-columns:1fr}
  .stats-bar{gap:1.5rem}
  .nav-links .hide-mobile{display:none}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="navbar">
  <a href="#" class="nav-logo" onclick="navigate('home')"><i class="fas fa-compass"></i> VIBES@Outing</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<!-- APP CONTAINER -->
<main id="app"></main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ──────────────────────────────────────────────────────
let currentUser = JSON.parse(localStorage.getItem('furzi_user') || 'null');
let authToken = localStorage.getItem('furzi_token') || null;
let outings = [];
let currentPage = 'home';

// ─── API ────────────────────────────────────────────────────────
const api = async (url, opts = {}) => {
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    const res = await fetch('/api' + url, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (res.status === 401) { logout(); toast('Session expired. Please login again.', 'error'); return { success: false }; }
    return await res.json();
  } catch (err) {
    console.error('API Error:', err);
    toast('Network error. Please check your connection and try again.', 'error');
    return { success: false, message: 'Network error' };
  }
};

// ─── TOAST ──────────────────────────────────────────────────────
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

// ─── MODAL ──────────────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ─── NAV RENDER ─────────────────────────────────────────────────
function renderNav() {
  const n = document.getElementById('navLinks');
  if (currentUser) {
    const isAdmin = currentUser.role === 'admin';
    n.innerHTML = `
      <a href="#" onclick="navigate('outings')">Outings</a>
      <a href="#" onclick="navigate('suggest')" class="hide-mobile">Suggest</a>
      ${isAdmin ? `<a href="#" onclick="navigate('admin')">Admin</a>` : `
        <a href="#" onclick="navigate('recommendations')">🤖 For You</a>
        <a href="#" onclick="navigate('dashboard')">My Dashboard</a>
      `}
      <span class="user-badge"><i class="fas fa-user"></i> ${currentUser.name}</span>
      <button onclick="logout()" class="btn btn-sm btn-danger">Logout</button>
    `;
  } else {
    n.innerHTML = `
      <a href="#" onclick="navigate('outings')">Outings</a>
      <button onclick="showLogin()" class="btn btn-sm btn-primary">Login</button>
      <button onclick="showSignup()" class="btn btn-sm btn-outline-white" style="border-color:var(--primary);color:var(--primary)">Sign Up</button>
    `;
  }
}

// ─── AUTH ────────────────────────────────────────────────────────
function showLogin() {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-sign-in-alt" style="color:var(--primary)"></i> Welcome Back</h2>
    <form onsubmit="handleLogin(event)">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required placeholder="you@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPass" required placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-arrow-right"></i> Login</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:var(--text-light)">No account? <a href="#" onclick="closeModal();showSignup()" style="color:var(--primary);font-weight:600">Sign up</a></p>
    <p style="text-align:center;margin-top:.5rem;font-size:.85rem"><a href="#" onclick="closeModal();showForgotPassword()" style="color:var(--primary);font-weight:600">Forgot password?</a></p>
  `);
}

function showForgotPassword() {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-unlock-alt" style="color:var(--primary)"></i> Forgot Password?</h2>
    <form onsubmit="handleForgotPassword(event)">
      <div class="form-group"><label>Email</label><input type="email" id="forgotEmail" required placeholder="you@email.com"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:var(--text-light)"><a href="#" onclick="closeModal();showLogin()" style="color:var(--primary);font-weight:600">Back to Login</a></p>
  `);
}

async function handleForgotPassword(e) {
  e.preventDefault();
  const email = document.getElementById('forgotEmail').value;
  const data = await api('/auth/forgot-password', { method: 'POST', body: { email } });
  if (data.dev_reset_link) {
    // Dev mode — email not configured, show reset link directly
    openModal(`
      <button class="close" onclick="closeModal()">&times;</button>
      <h2><i class="fas fa-tools" style="color:var(--warning)"></i> Dev Mode</h2>
      <p style="color:var(--text-light);margin-bottom:1rem">Email is not configured. Use this link to reset your password:</p>
      <div style="background:#F8FAFC;padding:1rem;border-radius:10px;word-break:break-all;margin-bottom:1rem">
        <a href="${data.dev_reset_link}" style="color:var(--primary);font-weight:600;font-size:.85rem">${data.dev_reset_link}</a>
      </div>
      <button class="btn btn-primary btn-block" onclick="window.location.href='${data.dev_reset_link}'"><i class="fas fa-key"></i> Reset Password Now</button>
      <p style="text-align:center;margin-top:1rem;font-size:.75rem;color:var(--danger)">⚠ This link is only shown because email is not configured. Configure SMTP in .env for production.</p>
    `);
  } else {
    toast('If your email exists, a reset link was sent. Check your inbox!', 'success');
    closeModal();
  }
}

function showSignup() {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-user-plus" style="color:var(--primary)"></i> Create Account</h2>
    <form onsubmit="handleSignup(event)">
      <div class="form-group"><label>Full Name</label><input type="text" id="signName" required placeholder="John Doe"></div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input type="email" id="signEmail" required placeholder="you@email.com"></div>
        <div class="form-group"><label>Phone</label><input type="tel" id="signPhone" placeholder="9876543210"></div>
      </div>
      <div class="form-group"><label>Password</label><input type="password" id="signPass" required minlength="6" placeholder="Min 6 characters"></div>
      <div class="form-group"><label>Interests</label><input type="text" id="signInterests" placeholder="Trekking, Beaches, Food..."></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-rocket"></i> Sign Up</button>
    </form>
  `);
}

async function handleLogin(e) {
  e.preventDefault();
  const data = await api('/auth/login', { method: 'POST', body: { email: document.getElementById('loginEmail').value, password: document.getElementById('loginPass').value } });
  if (data.success) { currentUser = data.user; authToken = data.token; localStorage.setItem('furzi_user', JSON.stringify(data.user)); localStorage.setItem('furzi_token', data.token); closeModal(); renderNav(); navigate(data.user.role === 'admin' ? 'admin' : 'home'); toast('Welcome back, ' + data.user.name + '!', 'success'); }
  else toast(data.message, 'error');
}

async function handleSignup(e) {
  e.preventDefault();
  const data = await api('/auth/signup', { method: 'POST', body: { name: document.getElementById('signName').value, email: document.getElementById('signEmail').value, phone: document.getElementById('signPhone').value, password: document.getElementById('signPass').value, interests: document.getElementById('signInterests').value } });
  if (data.success) { currentUser = data.user; authToken = data.token; localStorage.setItem('furzi_user', JSON.stringify(data.user)); localStorage.setItem('furzi_token', data.token); closeModal(); renderNav(); navigate('home'); toast('Account created! Welcome!', 'success'); }
  else toast(data.message, 'error');
}

function logout() { currentUser = null; authToken = null; localStorage.removeItem('furzi_user'); localStorage.removeItem('furzi_token'); renderNav(); navigate('home'); toast('Logged out'); }

function showResetPassword(token) {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-key" style="color:var(--primary)"></i> Set New Password</h2>
    <form onsubmit="handleResetPassword(event, '${token}')">
      <div class="form-group"><label>New Password</label><input type="password" id="resetPass" required minlength="6" placeholder="Min 6 characters"></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="resetPassConfirm" required minlength="6" placeholder="Repeat password"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-save"></i> Reset Password</button>
    </form>
  `);
}

async function handleResetPassword(e, token) {
  e.preventDefault();
  const password = document.getElementById('resetPass').value;
  const confirm = document.getElementById('resetPassConfirm').value;
  if (password !== confirm) return toast('Passwords do not match', 'error');
  const res = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
  const data = await res.json();
  if (data.success) { toast('Password updated! Please login.', 'success'); closeModal(); showLogin(); }
  else toast(data.message || 'Reset failed', 'error');
}

// Check for reset-password token in URL on page load
(function() {
  const params = new URLSearchParams(window.location.search);
  if (window.location.pathname === '/reset-password' && params.get('token')) {
    setTimeout(() => showResetPassword(params.get('token')), 500);
  }
})();

// ─── PAGES ──────────────────────────────────────────────────────
async function navigate(page) {
  currentPage = page;
  const app = document.getElementById('app');

  if (page === 'home') await renderHome(app);
  else if (page === 'outings') await renderOutings(app);
  else if (page === 'suggest') renderSuggest(app);
  else if (page === 'dashboard') await renderUserDashboard(app);
  else if (page === 'admin') await renderAdmin(app);
  else if (page === 'recommendations') await renderRecommendations(app);
  else if (page.startsWith('outing-')) await renderOutingDetail(app, parseInt(page.split('-')[1]));
  else if (page.startsWith('chat-')) await renderChat(app, parseInt(page.split('-')[1]));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function renderOutings(app) {
  outings = await api('/outings');

          ${[...new Set(outings.map(o => o.location))].map(l => `<option>${l}</option>`).join('')}
        </select>
        <select id="budgetFilter" onchange="filterOutings()">
          <option value="">All Budgets</option>
          <option value="0-3000">Under ₹3,000</option>
          <option value="3000-6000">₹3,000 – ₹6,000</option>
          <option value="6000-11000">₹6,000 – ₹11,000</option>

  `;

function filterOutings() {
  const search = document.getElementById('searchFilter').value.toLowerCase();
  const loc = document.getElementById('locationFilter').value;
  const budget = document.getElementById('budgetFilter').value;
  let filtered = outings.filter(o => {
    if (search && !o.title.toLowerCase().includes(search) && !o.location.toLowerCase().includes(search)) return false;
    if (loc && o.location !== loc) return false;
    if (budget) { const [min, max] = budget.split('-').map(Number); if (o.cost < min || o.cost > max) return false; }
    return true;
  });
  document.getElementById('outingsGrid').innerHTML = filtered.length ? filtered.map(o => outingCard(o)).join('') : '<p style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:3rem">No outings found. Try different filters!</p>';
}

async function bookOuting(id) {
  if (!currentUser) return showLogin();
  const o = await api('/outings/' + id);
  const spotsLeft = o.max_participants - o.current_participants;
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-ticket-alt" style="color:var(--primary)"></i> Book: ${o.title}</h2>
    <div style="background:#F8FAFC;padding:1rem;border-radius:10px;margin-bottom:1.5rem">
      <div style="display:flex;justify-content:space-between;margin-bottom:.5rem"><span>📍 ${o.location}</span><span>📅 ${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span></div>
      <div style="display:flex;justify-content:space-between"><span>💰 ₹${o.cost}/person</span><span>👥 ${spotsLeft} spots left</span></div>
    </div>
    <form onsubmit="confirmBooking(event, ${o.id}, ${o.cost})">
      <div class="form-group"><label>Number of Participants</label><input type="number" id="bookParticipants" min="1" max="${spotsLeft}" value="1" required onchange="updateTotal(${o.cost})"></div>
      <div class="form-group"><label>Participant Names (comma separated)</label><input type="text" id="bookNames" placeholder="${currentUser.name}" value="${currentUser.name}"></div>
      <div style="background:rgba(108,60,225,.06);padding:1rem;border-radius:10px;margin-bottom:1rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <span style="font-weight:600">Total Trip Cost</span>
          <span style="font-size:1.2rem;font-weight:700;color:var(--text-light);text-decoration:line-through" id="bookTotal">₹${o.cost}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <span style="font-weight:700;color:var(--primary)">🔒 Pay Now (20% Token)</span>
          <span style="font-size:1.5rem;font-weight:800;color:var(--primary)" id="bookToken">₹${Math.ceil(o.cost * 0.20)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:.85rem;color:var(--text-light)">⏰ Remaining (80%) due 24hrs before trip</span>
          <span style="font-size:1rem;font-weight:600;color:var(--secondary)" id="bookRemaining">₹${o.cost - Math.ceil(o.cost * 0.20)}</span>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-lock"></i> Pay ₹<span id="bookTokenBtn">${Math.ceil(o.cost * 0.20)}</span> Token & Confirm</button>
    </form>
  `);
}

function updateTotal(cost) {
  const p = parseInt(document.getElementById('bookParticipants').value) || 1;
  const total = cost * p;
  const token = Math.ceil(total * 0.20);
  const remaining = total - token;
  document.getElementById('bookTotal').textContent = '₹' + total;
  document.getElementById('bookToken').textContent = '₹' + token;
  document.getElementById('bookRemaining').textContent = '₹' + remaining;
  document.getElementById('bookTokenBtn').textContent = token;
}

async function confirmBooking(e, outingId, cost) {
  e.preventDefault();
  const participants = parseInt(document.getElementById('bookParticipants').value);
  const participantNames = document.getElementById('bookNames').value;
  const totalAmount = cost * participants;
  const tokenAmount = Math.ceil(totalAmount * 0.20);

  // Step 1: Create Razorpay order on server (20% token)
  const orderRes = await api('/bookings/create-order', { method: 'POST', body: {
    user_id: currentUser.id, outing_id: outingId, participants, participant_names: participantNames
  }});

  if (!orderRes.success) {
    if (orderRes.message && orderRes.message.includes('API keys')) {
      const fallback = await api('/bookings', { method: 'POST', body: { user_id: currentUser.id, outing_id: outingId, participants, participant_names: participantNames, total_amount: totalAmount } });
      if (fallback.success) { closeModal(); toast('🎉 Token booking confirmed (demo)! Paid ₹' + fallback.token_amount + ' | Remaining ₹' + fallback.remaining_amount, 'success'); navigate(currentPage); }
      else toast(fallback.message, 'error');
      return;
    }
    toast(orderRes.message || 'Error creating order', 'error');
    return;
  }

  closeModal();

  // Step 2: Open Razorpay Checkout popup (20% token only)
  const options = {
    key: orderRes.key_id,
    amount: tokenAmount * 100,
    currency: 'INR',
    name: 'VIBES@Outing',
    description: '20% Token — ' + participants + ' participant(s) | Remaining due 24hrs before trip',
    image: 'https://img.icons8.com/3d-fluency/94/compass.png',
    order_id: orderRes.order_id,
    handler: async function (response) {
      const verifyRes = await api('/bookings/verify-payment', { method: 'POST', body: {
        razorpay_order_id: response.razorpay_order_id,
        razorpay_payment_id: response.razorpay_payment_id,
        razorpay_signature: response.razorpay_signature,
        booking_id: orderRes.booking_id
      }});
      if (verifyRes.success) {
        toast('🎉 Token payment of ₹' + orderRes.amount + ' successful!', 'success');
        setTimeout(() => {
          openModal(`
            <button class="close" onclick="closeModal()">&times;</button>
            <div style="text-align:center;padding:1rem">
              <div style="font-size:3rem;margin-bottom:1rem">🎉</div>
              <h2 style="color:var(--success)">Token Booking Confirmed!</h2>
              <p style="color:var(--text-light);margin:1rem 0">Payment ID: <code>${verifyRes.payment_id}</code></p>
              <div style="background:#F8FAFC;padding:1rem;border-radius:10px;margin:1rem 0;text-align:left">
                <p style="margin:.25rem 0"><strong>🔒 Token Paid:</strong> <span style="color:var(--success);font-weight:700">₹${orderRes.amount}</span></p>
                <p style="margin:.25rem 0"><strong>⏰ Remaining:</strong> <span style="color:var(--secondary);font-weight:700">₹${orderRes.remaining_amount}</span></p>
                <p style="margin:.25rem 0;font-size:.85rem;color:var(--text-light)">💡 Complete remaining payment 24 hours before the trip date</p>
              </div>
              ${verifyRes.whatsapp_link ? `<a href="${verifyRes.whatsapp_link}" target="_blank" class="btn btn-success btn-block" style="background:#25D366;margin-bottom:.75rem"><i class="fab fa-whatsapp"></i> Share on WhatsApp</a>` : ''}
              <button class="btn btn-primary btn-block" onclick="closeModal();navigate('dashboard')"><i class="fas fa-ticket-alt"></i> View My Bookings</button>
            </div>
          `);
        }, 500);
        navigate(currentPage);
      } else {
        toast('Payment verification failed', 'error');
      }
    },
    prefill: {
      name: currentUser.name,
      email: currentUser.email || '',
    },
    theme: { color: '#6C3CE1' },
    modal: {
      ondismiss: function () {
        toast('Payment cancelled', 'error');
        // Mark booking as cancelled
        api('/bookings/verify-payment', { method: 'POST', body: { razorpay_order_id: orderRes.order_id, razorpay_payment_id: '', razorpay_signature: '', booking_id: orderRes.booking_id } });
      }
    }
  };

  const rzp = new Razorpay(options);
  rzp.open();
}

function showReviewForm(outingId) {
  let selectedRating = 0;
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-star" style="color:#F59E0B"></i> Write a Review</h2>
    <div class="form-group">
      <label>Rating</label>
      <div class="star-input" id="starInput">
        ${[1,2,3,4,5].map(i => `<i class="fas fa-star" data-rating="${i}" onclick="selectStar(${i})" onmouseover="hoverStar(${i})" onmouseout="resetStars()"></i>`).join('')}
      </div>
    </div>
    <div class="form-group"><label>Comment (optional)</label><textarea id="reviewComment" placeholder="Share your experience..."></textarea></div>
    <button class="btn btn-primary btn-block" onclick="submitReview(${outingId})"><i class="fas fa-paper-plane"></i> Submit Review</button>
  `);
  window._selectedRating = 0;
}

function selectStar(n) {
  window._selectedRating = n;
  document.querySelectorAll('#starInput i').forEach((s,i) => s.classList.toggle('active', i < n));
}
function hoverStar(n) { document.querySelectorAll('#starInput i').forEach((s,i) => s.classList.toggle('active', i < n)); }
function resetStars() { const n = window._selectedRating; document.querySelectorAll('#starInput i').forEach((s,i) => s.classList.toggle('active', i < n)); }

async function submitReview(outingId) {
  if (!window._selectedRating) return toast('Please select a rating', 'error');
  const data = await api('/reviews', { method: 'POST', body: { user_id: currentUser.id, outing_id: outingId, rating: window._selectedRating, comment: document.getElementById('reviewComment').value } });
  if (data.success) { closeModal(); toast('⭐ Review submitted!', 'success'); navigate('outing-' + outingId); }
  else toast(data.message, 'error');
}

// ─── GROUP CHAT PAGE ────────────────────────────────────────────
let chatInterval = null;

async function renderChat(app, outingId) {
  if (!currentUser) return showLogin();
  const o = await api('/outings/' + outingId);
  const messages = await api('/chat/' + outingId);

  app.innerHTML = `
    <section class="section" style="max-width:700px">
      <div style="margin-bottom:1rem"><a href="#" onclick="navigate('outing-${outingId}')" style="color:var(--primary);font-size:.9rem"><i class="fas fa-arrow-left"></i> Back to ${o.title}</a></div>
      <div class="chat-box">
        <div class="chat-header"><i class="fas fa-comments"></i> ${o.title} — Group Chat</div>
        <div class="chat-messages" id="chatMessages">
          ${messages.length ? messages.map(m => chatBubble(m)).join('') : '<p style="text-align:center;color:var(--text-light);padding:2rem">No messages yet. Say hi! 👋</p>'}
        </div>
        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat(${outingId})">
          <button class="btn btn-primary btn-sm" onclick="sendChat(${outingId})"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </section>
  `;

  const chatDiv = document.getElementById('chatMessages');
  chatDiv.scrollTop = chatDiv.scrollHeight;

  // Auto-refresh chat every 3 seconds
  if (chatInterval) clearInterval(chatInterval);
  chatInterval = setInterval(async () => {
    if (!currentPage.startsWith('chat-')) { clearInterval(chatInterval); return; }
    const newMsgs = await api('/chat/' + outingId);
    const chatEl = document.getElementById('chatMessages');
    if (chatEl && newMsgs.length) {
      chatEl.innerHTML = newMsgs.map(m => chatBubble(m)).join('');
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }, 3000);
}

function chatBubble(m) {
  const isMine = currentUser && m.user_id === currentUser.id;
  const time = new Date(m.created_at).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  return `<div class="chat-msg ${isMine ? 'mine' : 'other'}">
    ${!isMine ? `<div class="msg-name">${m.user_name}</div>` : ''}
    ${m.message}
    <div class="msg-time">${time}</div>
  </div>`;
}

async function sendChat(outingId) {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const data = await api('/chat', { method: 'POST', body: { outing_id: outingId, user_id: currentUser.id, message: msg } });
  if (data.success) {
    const msgs = await api('/chat/' + outingId);
    const chatEl = document.getElementById('chatMessages');
    chatEl.innerHTML = msgs.map(m => chatBubble(m)).join('');
    chatEl.scrollTop = chatEl.scrollHeight;
  } else toast(data.message, 'error');
}
