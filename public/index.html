<style>
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes floatSlow{0%,100%{transform:translateY(0) translateX(0)}25%{transform:translateY(-8px) translateX(4px)}50%{transform:translateY(-14px) translateX(0)}75%{transform:translateY(-6px) translateX(-4px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
@keyframes driftClouds{0%{transform:translateX(-100%)}100%{transform:translateX(100vw)}}
@keyframes driftMist{0%{opacity:.3;transform:translateX(-50%) scaleX(1)}50%{opacity:.6;transform:translateX(0%) scaleX(1.2)}100%{opacity:.3;transform:translateX(50%) scaleX(1)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes rippleEffect{0%{transform:scale(0);opacity:.6}100%{transform:scale(4);opacity:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(139,92,246,.3)}50%{box-shadow:0 0 40px rgba(139,92,246,.6),0 0 80px rgba(139,92,246,.2)}}
@keyframes kenBurns1{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.15) translate(-2%,-1%)}}
@keyframes kenBurns2{0%{transform:scale(1.05) translate(1%,0)}100%{transform:scale(1.18) translate(-1%,-2%)}}
@keyframes kenBurns3{0%{transform:scale(1) translate(-1%,1%)}100%{transform:scale(1.14) translate(2%,-1%)}}
@keyframes kenBurns4{0%{transform:scale(1.02) translate(0,1%)}100%{transform:scale(1.16) translate(-2%,0)}}
@keyframes kenBurns5{0%{transform:scale(1) translate(1%,-1%)}100%{transform:scale(1.13) translate(0,2%)}}
@keyframes slideBlurIn{0%{filter:blur(12px);opacity:0}100%{filter:blur(0);opacity:1}}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes tagFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
:root {
  --primary: #6C3CE1;
  --primary-light: #8B5CF6;
  --primary-dark: #5521C5;
  --secondary: #F97316;
  --accent: #06D6A0;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text: #1E293B;
  --text-light: #64748B;
  --border: #E2E8F0;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 32px rgba(108,60,225,.15);
  --shadow-xl: 0 16px 48px rgba(108,60,225,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}

/* NAV — Glassmorphism */
.nav{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(226,232,240,.6);padding:0 2rem;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;transition:box-shadow .3s}
.nav:hover{box-shadow:0 4px 20px rgba(0,0,0,.06)}
.nav-logo{font-weight:800;font-size:1.4rem;color:var(--primary);display:flex;align-items:center;gap:.75rem;transition:transform .2s}
.nav-logo:hover{transform:scale(1.02)}
.nav-logo i{font-size:1.2rem;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(108,60,225,.25)}
.nav-links{display:flex;gap:.5rem;align-items:center}
.nav-links a,.nav-links button{padding:.5rem 1rem;border-radius:999px;font-size:.875rem;font-weight:500;border:none;background:none;color:var(--text-light);transition:all .3s ease}
.nav-links a:hover,.nav-links button:hover{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(108,60,225,.2)}
.nav-links .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 12px rgba(108,60,225,.2)}
.nav-links .user-badge{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:.45rem 1rem;border-radius:999px;font-size:.8rem;font-weight:600;box-shadow:0 2px 8px rgba(108,60,225,.2)}

/* HERO — Premium Airbnb/Expedia Style Slider */
.hero{position:relative;color:#fff;padding:0;text-align:center;overflow:hidden;height:92vh;min-height:600px;max-height:1000px;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto;border-radius:0 0 28px 28px}

/* Slider container */
.hero-slider{position:absolute;inset:0;z-index:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s cubic-bezier(.4,0,.2,1);will-change:opacity,transform,filter;background-size:cover;background-position:center;filter:blur(0);transform-origin:center center}
.hero-slide.active{opacity:1;z-index:1}
.hero-slide.prev{opacity:0;filter:blur(8px);z-index:0}
.hero-slide.kb-1{animation:kenBurns1 12s ease-in-out forwards}
.hero-slide.kb-2{animation:kenBurns2 12s ease-in-out forwards}
.hero-slide.kb-3{animation:kenBurns3 12s ease-in-out forwards}
.hero-slide.kb-4{animation:kenBurns4 12s ease-in-out forwards}
.hero-slide.kb-5{animation:kenBurns5 12s ease-in-out forwards}

/* Overlays on top of slider */
.hero-overlay{position:absolute;inset:0;z-index:2;pointer-events:none}
.hero-overlay-gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.25) 0%,rgba(76,29,149,.35) 40%,rgba(108,60,225,.45) 70%,rgba(15,23,42,.7) 100%)}
.hero-overlay-brand{position:absolute;inset:0;background:linear-gradient(135deg,rgba(76,29,149,.2) 0%,transparent 50%,rgba(139,92,246,.15) 100%)}
.hero-overlay-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.35) 100%)}

/* Ambient motion layers */
.hero-ambient{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.hero-clouds{position:absolute;top:0;width:200%;height:140px;opacity:.2}
.cloud{position:absolute;background:radial-gradient(ellipse,rgba(255,255,255,.6) 0%,transparent 70%);border-radius:50%;filter:blur(25px)}
.cloud-1{width:500px;height:90px;top:20px;left:5%;animation:driftClouds 50s linear infinite}
.cloud-2{width:350px;height:70px;top:60px;left:35%;animation:driftClouds 65s linear infinite;animation-delay:-25s}
.cloud-3{width:420px;height:80px;top:5px;left:65%;animation:driftClouds 55s linear infinite;animation-delay:-15s}
.hero-mist{position:absolute;bottom:0;left:0;width:100%;height:25%;overflow:hidden}
.mist-layer{position:absolute;bottom:0;width:200%;height:100%;background:linear-gradient(to top,rgba(255,255,255,.1),transparent);filter:blur(35px);animation:driftMist 18s ease-in-out infinite}
.mist-layer:nth-child(2){animation-delay:-7s;opacity:.4;height:50%}

/* Particles */
.hero-particles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;background:rgba(255,255,255,.7);border-radius:50%;animation:sparkle 3s ease-in-out infinite;filter:blur(0.5px)}
.particle.gold{background:rgba(255,200,100,.8)}

/* Hero content — centered */
.hero-content{position:relative;z-index:10;padding:2rem;max-width:860px;will-change:transform;transition:transform .15s ease-out}
.hero h1{font-size:3.8rem;font-weight:800;margin-bottom:.75rem;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1);letter-spacing:-1px;line-height:1.1;text-shadow:0 4px 30px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3)}
.hero .hero-tagline{font-size:1.2rem;opacity:.88;max-width:580px;margin:0 auto 2.5rem;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .15s both;line-height:1.7;text-shadow:0 2px 12px rgba(0,0,0,.3);font-weight:400}

/* Glassmorphism search bar */
.hero-search{display:flex;align-items:center;max-width:560px;margin:0 auto 1.5rem;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:.35rem .4rem .35rem 1.5rem;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .3s both;box-shadow:0 8px 32px rgba(0,0,0,.2),inset 0 1px 1px rgba(255,255,255,.1);transition:all .3s ease}
.hero-search:hover,.hero-search:focus-within{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 40px rgba(139,92,246,.15),inset 0 1px 1px rgba(255,255,255,.15)}
.hero-search input{flex:1;background:none;border:none;color:#fff;font-size:1rem;font-weight:500;outline:none;padding:.6rem 0;letter-spacing:.2px}
.hero-search input::placeholder{color:rgba(255,255,255,.55);font-weight:400}
.hero-search-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:999px;padding:.7rem 1.5rem;font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;transition:all .3s ease;box-shadow:0 4px 16px rgba(108,60,225,.35)}
.hero-search-btn:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(108,60,225,.5)}

/* Popular destination tags */
.hero-tags{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .45s both;margin-bottom:1rem}
.hero-tag{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);color:#fff;padding:.4rem 1rem;border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;gap:.35rem;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.hero-tag:hover{background:rgba(255,255,255,.22);transform:translateY(-2px) scale(1.04);border-color:rgba(255,255,255,.35);box-shadow:0 4px 16px rgba(139,92,246,.25)}
.hero-tag i{font-size:.7rem;opacity:.7}

/* Glass CTA Buttons */
.hero-buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .55s both;margin-top:.5rem}
.btn-glass{padding:.8rem 1.8rem;border-radius:999px;font-weight:700;font-size:.95rem;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;cursor:pointer;transition:all .3s ease-in-out;display:inline-flex;align-items:center;gap:.55rem;position:relative;overflow:hidden;box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 4px 20px rgba(0,0,0,.12);text-shadow:0 1px 4px rgba(0,0,0,.15)}
.btn-glass:hover{background:rgba(255,255,255,.2);transform:translateY(-3px) scale(1.04);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 8px 32px rgba(139,92,246,.35),0 0 40px rgba(139,92,246,.15);border-color:rgba(255,255,255,.35)}
.btn-glass:active .ripple-circle{animation:rippleEffect .6s ease-out}
.btn-glass-primary{background:rgba(255,255,255,.92);color:var(--primary);border:none;box-shadow:0 4px 20px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:none;font-weight:800}
.btn-glass-primary:hover{background:#fff;transform:translateY(-3px) scale(1.04);box-shadow:0 8px 32px rgba(108,60,225,.3),0 0 60px rgba(139,92,246,.12)}
.ripple-circle{position:absolute;width:20px;height:20px;background:rgba(255,255,255,.4);border-radius:50%;pointer-events:none;transform:scale(0);opacity:0}

/* Slider navigation dots */
.hero-dots{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:.6rem;align-items:center}
.hero-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);border:none;cursor:pointer;transition:all .4s ease;padding:0}
.hero-dot.active{background:#fff;width:28px;border-radius:999px;box-shadow:0 0 12px rgba(255,255,255,.5)}
.hero-dot:hover{background:rgba(255,255,255,.65);transform:scale(1.2)}

/* Pause / play toggle */
.hero-playpause{position:absolute;bottom:2rem;right:2rem;z-index:12;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;transition:all .3s ease}
.hero-playpause:hover{background:rgba(255,255,255,.25);transform:scale(1.1)}

/* Slide caption */
.hero-caption{position:absolute;bottom:5rem;left:2.5rem;z-index:11;text-align:left;animation:fadeInUp .6s ease;pointer-events:none}
.hero-caption span{background:rgba(0,0,0,.35);backdrop-filter:blur(8px);padding:.3rem .85rem;border-radius:999px;font-size:.78rem;font-weight:500;letter-spacing:.3px;display:inline-flex;align-items:center;gap:.4rem}

/* Parallax mouse tracking */
.hero[data-parallax]{perspective:1000px}
.btn{padding:.75rem 1.75rem;border-radius:999px;font-weight:600;font-size:.95rem;border:none;transition:all .3s ease;display:inline-flex;align-items:center;gap:.5rem}
.btn-white{background:#fff;color:var(--primary);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.btn-white:hover{transform:translateY(-3px) scale(1.03);box-shadow:var(--shadow-xl)}
.btn-outline-white{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(8px)}
.btn-outline-white:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 16px rgba(108,60,225,.25)}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-lg)}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#FB923C);color:#fff;box-shadow:0 4px 12px rgba(249,115,22,.2)}
.btn-success{background:linear-gradient(135deg,var(--success),#34D399);color:#fff}
.btn-danger{background:linear-gradient(135deg,var(--danger),#F87171);color:#fff}
.btn-sm{padding:.45rem 1rem;font-size:.8rem;border-radius:999px}
.btn-block{width:100%}

/* STATS BAR */
.stats-bar{display:flex;justify-content:center;gap:4rem;padding:2.5rem 2rem;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.stat-item{text-align:center;animation:fadeInUp .6s ease both}
.stat-item:nth-child(1){animation-delay:.1s}.stat-item:nth-child(2){animation-delay:.2s}.stat-item:nth-child(3){animation-delay:.3s}.stat-item:nth-child(4){animation-delay:.4s}
.stat-item .num{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-item .label{font-size:.85rem;color:var(--text-light);margin-top:.25rem}

/* SECTION */
.section{padding:4rem 2rem;max-width:1200px;margin:0 auto}
.section-title{font-size:1.8rem;font-weight:700;margin-bottom:.5rem;letter-spacing:-.3px}
.section-subtitle{color:var(--text-light);margin-bottom:2rem;line-height:1.7}

/* FILTERS */
.filters{display:flex;gap:.75rem;margin-bottom:2rem;flex-wrap:wrap}
.filters input,.filters select{padding:.7rem 1.2rem;border:1.5px solid var(--border);border-radius:999px;font-size:.9rem;background:#fff;transition:all .3s}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(108,60,225,.08)}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.75rem}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:all .35s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-xl)}
.card-img{height:220px;background-size:cover;background-position:center;position:relative}
.card-img::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.card-img .badge{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:.35rem .8rem;border-radius:999px;font-size:.75rem;font-weight:600;z-index:1;box-shadow:0 2px 8px rgba(108,60,225,.25)}
.card-img .spots-left{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;padding:.3rem .7rem;border-radius:999px;font-size:.75rem;z-index:1}
.card-body{padding:1.5rem}
.card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem;letter-spacing:-.2px;transition:color .2s}
.card-body h3:hover{color:var(--primary)}
.card-meta{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:.75rem;font-size:.85rem;color:var(--text-light)}
.card-meta span{display:flex;align-items:center;gap:.3rem}
.card-body p{font-size:.9rem;color:var(--text-light);margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.7}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.price{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.price small{font-size:.75rem;font-weight:400;-webkit-text-fill-color:var(--text-light)}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:all .35s ease}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:2.5rem;position:relative;box-shadow:var(--shadow-xl);animation:fadeInUp .4s ease}
.modal h2{font-size:1.4rem;font-weight:700;margin-bottom:1.5rem;letter-spacing:-.2px}
.modal .close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.4rem;color:var(--text-light);transition:all .2s;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal .close:hover{background:#F1F5F9;color:var(--text);transform:rotate(90deg)}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem;color:var(--text)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:12px;font-size:.9rem;transition:all .3s}
.form-group textarea{min-height:80px;resize:vertical}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(108,60,225,.08)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* DASHBOARD */
.dashboard{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 72px)}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:1.5rem 0}
.sidebar a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.5rem;font-size:.9rem;color:var(--text-light);transition:all .3s;border-right:3px solid transparent}
.sidebar a:hover,.sidebar a.active{background:rgba(108,60,225,.06);color:var(--primary);border-right:3px solid var(--primary)}
.sidebar a i{width:20px;text-align:center}
.dash-content{padding:2.5rem}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.25rem;margin-bottom:2rem}
.dash-stat{background:#fff;padding:1.75rem;border-radius:var(--radius);box-shadow:var(--shadow);transition:all .3s}
.dash-stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.dash-stat .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:.75rem}
.dash-stat h4{font-size:.85rem;color:var(--text-light);margin-bottom:.25rem}
.dash-stat .value{font-size:1.8rem;font-weight:800}

/* TABLE */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:.85rem 1.25rem;text-align:left;border-bottom:1px solid var(--border);font-size:.875rem}
th{font-weight:600;color:var(--text-light);background:#FAFBFC;letter-spacing:.3px;text-transform:uppercase;font-size:.75rem}
.status{padding:.25rem .7rem;border-radius:999px;font-size:.75rem;font-weight:600}
.status-paid,.status-approved,.status-active{background:#D1FAE5;color:#065F46}
.status-pending{background:#FEF3C7;color:#92400E}
.status-rejected,.status-cancelled{background:#FEE2E2;color:#991B1B}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--text);color:#fff;padding:1rem 1.75rem;border-radius:999px;font-size:.9rem;z-index:300;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.175,.885,.32,1.275);box-shadow:var(--shadow-lg)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:linear-gradient(135deg,var(--success),#34D399)}
.toast.error{background:linear-gradient(135deg,var(--danger),#F87171)}

/* REVIEWS */
.review-card{background:#F8FAFC;padding:1rem;border-radius:10px;margin-bottom:.75rem}
.review-card .stars{color:#F59E0B;margin-bottom:.25rem}
.review-card .reviewer{font-weight:600;font-size:.85rem}
.review-card .review-text{font-size:.85rem;color:var(--text-light);margin-top:.25rem}
.star-input{display:flex;gap:.25rem;margin-bottom:.5rem}
.star-input i{font-size:1.5rem;color:var(--border);cursor:pointer;transition:.2s}
.star-input i.active,.star-input i:hover{color:#F59E0B}

/* CHAT */
.chat-box{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;max-width:700px;margin:0 auto}
.chat-header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:1.25rem 1.5rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.chat-messages{height:350px;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.chat-msg{max-width:75%;padding:.6rem 1rem;border-radius:12px;font-size:.9rem}
.chat-msg.mine{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:#F1F5F9;color:var(--text);border-bottom-left-radius:4px}
.chat-msg .msg-name{font-size:.7rem;font-weight:600;opacity:.7;margin-bottom:2px}
.chat-msg .msg-time{font-size:.65rem;opacity:.5;margin-top:2px;text-align:right}
.chat-input{display:flex;border-top:1px solid var(--border);padding:.75rem}
.chat-input input{flex:1;border:1px solid var(--border);border-radius:10px;padding:.5rem .75rem;font-size:.9rem;margin-right:.5rem}
.chat-input input:focus{outline:none;border-color:var(--primary)}

/* VERIFICATION BADGE */
.verified-badge{display:inline-flex;align-items:center;gap:.25rem;background:#D1FAE5;color:#065F46;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600}
.unverified-badge{display:inline-flex;align-items:center;gap:.25rem;background:#FEF3C7;color:#92400E;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600}

/* AI RECOMMENDATION */
.rec-reasons{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.rec-reason{background:rgba(108,60,225,.08);color:var(--primary);padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:500}
.ai-badge{background:linear-gradient(135deg,#6C3CE1,#F97316);color:#fff;padding:.25rem .7rem;border-radius:999px;font-size:.7rem;font-weight:700;box-shadow:0 2px 8px rgba(108,60,225,.2)}

/* CATEGORY CARDS — Horizontal Scroll Section */
.categories-section{padding:3.5rem 2rem;max-width:1280px;margin:0 auto}
.categories-section .section-title{font-size:1.6rem}
.categories-row{display:flex;gap:1.25rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:.5rem 0 1rem}
.categories-row::-webkit-scrollbar{display:none}
.cat-card{flex:0 0 calc((100% - 5 * 1.25rem) / 6);min-width:180px;height:240px;border-radius:20px;position:relative;overflow:hidden;cursor:pointer;scroll-snap-align:start;box-shadow:0 4px 20px rgba(0,0,0,.1);border:1.5px solid rgba(255,255,255,.08);transition:all .35s cubic-bezier(.25,.46,.45,.94)}
.cat-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 12px 40px rgba(108,60,225,.2),0 0 0 2px rgba(139,92,246,.25)}
.cat-card-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s cubic-bezier(.25,.46,.45,.94),filter .4s ease;will-change:transform}
.cat-card:hover .cat-card-bg{transform:scale(1.1);filter:brightness(1.1) contrast(1.05)}
.cat-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.6) 100%);transition:all .35s ease;z-index:1}
.cat-card:hover .cat-card-overlay{background:linear-gradient(180deg,rgba(108,60,225,.05) 0%,rgba(108,60,225,.1) 40%,rgba(15,23,42,.7) 100%)}
.cat-card-glass{position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-radius:20px;z-index:2;pointer-events:none;transition:border-color .3s ease}
.cat-card:hover .cat-card-glass{border-color:rgba(139,92,246,.35)}
.cat-card-content{position:absolute;bottom:0;left:0;right:0;padding:1.25rem;z-index:3;display:flex;flex-direction:column;gap:.25rem}
.cat-card-name{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.cat-card-count{font-size:.72rem;font-weight:500;color:rgba(255,255,255,.7);letter-spacing:.3px}
.cat-card-icon{position:absolute;top:1rem;right:1rem;width:36px;height:36px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;z-index:3;border:1px solid rgba(255,255,255,.15);transition:all .3s ease;opacity:.7}
.cat-card:hover .cat-card-icon{opacity:1;background:rgba(139,92,246,.3);transform:scale(1.1);border-color:rgba(139,92,246,.4)}

/* FOOTER */
.footer{background:linear-gradient(135deg,#1E293B,#0F172A);color:#fff;padding:3.5rem 2rem;text-align:center}
.footer p{opacity:.6;font-size:.85rem;line-height:1.8}

/* RESPONSIVE */
@media(max-width:768px){
  .hero{height:85vh;min-height:550px;border-radius:0 0 20px 20px}
  .hero h1{font-size:2rem;letter-spacing:-.5px}
  .hero .hero-tagline{font-size:1rem;margin-bottom:1.5rem}
  .hero-search{max-width:90%;padding:.3rem .3rem .3rem 1rem}
  .hero-search input{font-size:.9rem}
  .hero-search-btn{padding:.6rem 1rem;font-size:.8rem}
  .hero-tags{gap:.4rem}
  .hero-tag{font-size:.75rem;padding:.3rem .75rem}
  .hero-content{padding:1.5rem}
  .btn-glass{padding:.65rem 1.3rem;font-size:.85rem}
  .hero-caption{display:none}
  .hero-playpause{bottom:1.5rem;right:1.5rem;width:32px;height:32px;font-size:.7rem}
  .hero-dots{bottom:1.5rem}
  .cards-grid{grid-template-columns:1fr}
  .dashboard{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-admin-nav{display:flex !important;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
  .mobile-admin-nav a{padding:.5rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;background:#F1F5F9;color:var(--text);text-decoration:none;white-space:nowrap}
  .mobile-admin-nav a.active{background:var(--primary);color:#fff}
  .form-row{grid-template-columns:1fr}
  .stats-bar{gap:1.5rem}
  .nav-links .hide-mobile{display:none}
  .cat-card{flex:0 0 160px;min-width:160px;height:210px}
  .categories-row{gap:1rem;padding-left:.5rem;padding-right:.5rem}
}
.mobile-admin-nav{display:none}
/* Loading spinner */
.loading-spinner{display:flex;justify-content:center;align-items:center;padding:3rem;color:var(--primary)}
.loading-spinner::after{content:'';width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Focus visible for accessibility */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media(max-width:480px){
  .hero h1{font-size:1.65rem}
  .hero-buttons{flex-direction:column;align-items:center}
  .hero-search{flex-direction:column;border-radius:20px;padding:.8rem}
  .hero-search-btn{width:100%;justify-content:center;margin-top:.3rem}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="navbar" role="navigation" aria-label="Main navigation">
  <a href="#" class="nav-logo" onclick="navigate('home')" aria-label="VIBES@Outing Home"><i class="fas fa-compass"></i><span style="display:flex;flex-direction:column;line-height:1.2">VIBES@Outing<span style="font-size:.65rem;font-weight:400;color:var(--text-light);font-style:italic;letter-spacing:.3px">Less planning, more feeling — enjoy the moment ✨</span></span></a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<!-- APP CONTAINER -->
<main id="app"></main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ──────────────────────────────────────────────────────
// SECURITY: Store user info in sessionStorage (not localStorage) — token is in httpOnly cookie
let currentUser = JSON.parse(sessionStorage.getItem('vibes_user') || 'null');
let authToken = sessionStorage.getItem('vibes_token') || null;
let outings = [];
let currentPage = 'home';

// ─── SECURITY: Client-side HTML escaping (defense-in-depth) ─────
function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeImageUrl(url) {
  if (!url || typeof url !== 'string') return 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600';
  // Only allow http/https URLs
  try { const u = new URL(url); if (u.protocol === 'http:' || u.protocol === 'https:') return url; } catch(e) {}
  return 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600';
}

// ─── BROWSER HISTORY ────────────────────────────────────────────
window.addEventListener('popstate', (e) => {
  if (e.state && e.state.page) { currentPage = e.state.page; navigate(e.state.page, true); }
});

// ─── API ────────────────────────────────────────────────────────
const API_BASE = window.VIBES_API_BASE || (window.location.hostname === 'localhost' ? '' : window.location.origin);
const api = async (url, opts = {}) => {
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    const res = await fetch(API_BASE + '/api' + url, {
      method: opts.method || 'GET',
      headers,
      credentials: 'include',
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (res.status === 401) { logout(); toast('Session expired. Please login again.', 'error'); return { success: false }; }
    return await res.json();
  } catch (err) {
    console.error('API Error:', err);
    toast('Network error. Please check your connection and try again.', 'error');
    return { success: false, message: 'Network error' };
  }
};

// ─── TOAST ──────────────────────────────────────────────────────
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

// ─── MODAL ──────────────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ─── NAV RENDER ─────────────────────────────────────────────────
function renderNav() {
  const n = document.getElementById('navLinks');
  if (currentUser) {
    const isAdmin = currentUser.role === 'admin';
    n.innerHTML = `
      <a href="#" onclick="navigate('outings')">Outings</a>
      <a href="#" onclick="navigate('suggest')" class="hide-mobile">Suggest</a>
      ${isAdmin ? `<a href="#" onclick="navigate('admin')">Admin</a>` : `
        <a href="#" onclick="navigate('recommendations')">🤖 For You</a>
        <a href="#" onclick="navigate('dashboard')">My Dashboard</a>
      `}
      <span class="user-badge"><i class="fas fa-user"></i> ${currentUser.name}</span>
      <button onclick="logout()" class="btn btn-sm btn-danger">Logout</button>
    `;
  } else {
    n.innerHTML = `
      <a href="#" onclick="navigate('outings')">Outings</a>
      <button onclick="showLogin()" class="btn btn-sm btn-primary">Login</button>
      <button onclick="showSignup()" class="btn btn-sm btn-outline-white" style="border-color:var(--primary);color:var(--primary)">Sign Up</button>
    `;
  }
}

// ─── AUTH ────────────────────────────────────────────────────────
function showLogin() {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-sign-in-alt" style="color:var(--primary)"></i> Welcome Back</h2>
    <form onsubmit="handleLogin(event)">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required placeholder="you@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPass" required placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-arrow-right"></i> Login</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:var(--text-light)">No account? <a href="#" onclick="closeModal();showSignup()" style="color:var(--primary);font-weight:600">Sign up</a></p>
    <p style="text-align:center;margin-top:.5rem;font-size:.85rem"><a href="#" onclick="closeModal();showForgotPassword()" style="color:var(--primary);font-weight:600">Forgot password?</a></p>
  `);
}

function showForgotPassword() {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-unlock-alt" style="color:var(--primary)"></i> Forgot Password?</h2>
    <form onsubmit="handleForgotPassword(event)">
      <div class="form-group"><label>Email</label><input type="email" id="forgotEmail" required placeholder="you@email.com"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:var(--text-light)"><a href="#" onclick="closeModal();showLogin()" style="color:var(--primary);font-weight:600">Back to Login</a></p>
  `);
}

async function handleForgotPassword(e) {
  e.preventDefault();
  const emailInput = document.getElementById('forgotEmail');
  const submitBtn = e.target.querySelector('button[type="submit"]');
  const email = emailInput.value;

  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
  }

  try {
    const data = await api('/auth/forgot-password', { method: 'POST', body: { email } });
    if (data.success) {
      toast(data.message || 'If your email is registered, a reset link has been sent. Check your inbox!', 'success');
      closeModal();
    } else {
      toast(data.message || 'Unable to send reset link right now. Please try again.', 'error');
    }
  } catch (err) {
    console.error('Forgot password error:', err);
    toast('Unable to send reset link right now. Please try again.', 'error');
  } finally {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
    }
  }
}

function showSignup() {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-user-plus" style="color:var(--primary)"></i> Create Account</h2>
    <form onsubmit="handleSignup(event)">
      <div class="form-group"><label>Full Name</label><input type="text" id="signName" required placeholder="John Doe"></div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input type="email" id="signEmail" required placeholder="you@email.com"></div>
        <div class="form-group"><label>Phone</label><input type="tel" id="signPhone" placeholder="9876543210"></div>
      </div>
      <div class="form-group"><label>Password</label><input type="password" id="signPass" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).{8,}" placeholder="Min 8 chars, upper+lower+number" title="Must contain uppercase, lowercase, and a number (min 8 chars)"></div>
      <div class="form-group"><label>Interests</label><input type="text" id="signInterests" placeholder="Trekking, Beaches, Food..."></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-rocket"></i> Sign Up</button>
    </form>
  `);
}

async function handleLogin(e) {
  e.preventDefault();
  const data = await api('/auth/login', { method: 'POST', body: { email: document.getElementById('loginEmail').value, password: document.getElementById('loginPass').value } });
  if (data.success) { currentUser = data.user; authToken = data.token; sessionStorage.setItem('vibes_user', JSON.stringify(data.user)); sessionStorage.setItem('vibes_token', data.token); closeModal(); renderNav(); navigate(data.user.role === 'admin' ? 'admin' : 'home'); toast('Welcome back, ' + data.user.name + '!', 'success'); }
  else toast(data.message, 'error');
}

async function handleSignup(e) {
  e.preventDefault();
  const data = await api('/auth/signup', { method: 'POST', body: { name: document.getElementById('signName').value, email: document.getElementById('signEmail').value, phone: document.getElementById('signPhone').value, password: document.getElementById('signPass').value, interests: document.getElementById('signInterests').value } });
  if (data.success) { currentUser = data.user; authToken = data.token; sessionStorage.setItem('vibes_user', JSON.stringify(data.user)); sessionStorage.setItem('vibes_token', data.token); closeModal(); renderNav(); navigate('home'); toast('Account created! Welcome!', 'success'); }
  else toast(data.message, 'error');
}

function logout() { currentUser = null; authToken = null; sessionStorage.removeItem('vibes_user'); sessionStorage.removeItem('vibes_token'); if (chatInterval) { clearInterval(chatInterval); chatInterval = null; } fetch(API_BASE + '/api/auth/logout', { method: 'POST', credentials: 'include' }); renderNav(); navigate('home'); toast('Logged out'); }

function showResetPassword(token) {
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-key" style="color:var(--primary)"></i> Set New Password</h2>
    <form onsubmit="handleResetPassword(event, '${token}')">
      <div class="form-group"><label>New Password</label><input type="password" id="resetPass" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).{8,}" placeholder="Min 8 chars, upper+lower+number" title="Must contain uppercase, lowercase, and a number (min 8 chars)"></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="resetPassConfirm" required minlength="8" placeholder="Repeat password"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-save"></i> Reset Password</button>
    </form>
  `);
}

async function handleResetPassword(e, token) {
  e.preventDefault();
  const password = document.getElementById('resetPass').value;
  const confirm = document.getElementById('resetPassConfirm').value;
  if (password !== confirm) return toast('Passwords do not match', 'error');
  const res = await fetch(API_BASE + '/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ token, password }) });
  const data = await res.json();
  if (data.success) { toast('Password updated! Please login.', 'success'); closeModal(); showLogin(); }
  else toast(data.message || 'Reset failed', 'error');
}

// Check for reset-password token in URL on page load
(function() {
  const params = new URLSearchParams(window.location.search);
  if (window.location.pathname === '/reset-password' && params.get('token')) {
    setTimeout(() => showResetPassword(params.get('token')), 500);
  }
})();

// ─── PAGES ──────────────────────────────────────────────────────
async function navigate(page, skipHistory) {
  currentPage = page;
  const app = document.getElementById('app');
  cleanupHeroSlider();

  // Browser history support
  if (!skipHistory) {
    history.pushState({ page }, '', '#' + page);
  }

  // Show loading spinner
  app.innerHTML = '<div class="loading-spinner"></div>';

  if (page === 'home') await renderHome(app);
  else if (page === 'outings') await renderOutings(app);
  else if (page === 'suggest') renderSuggest(app);
  else if (page === 'dashboard') await renderUserDashboard(app);
  else if (page === 'admin') await renderAdmin(app);
  else if (page === 'recommendations') await renderRecommendations(app);
  else if (page.startsWith('outing-')) await renderOutingDetail(app, parseInt(page.split('-')[1]));
  else if (page.startsWith('chat-')) await renderChat(app, parseInt(page.split('-')[1]));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── HOME PAGE ──────────────────────────────────────────────────
async function renderHome(app) {
  const [outingsData, statsData] = await Promise.all([api('/outings'), api('/public-stats')]);
  outings = outingsData;
  const featured = outings.slice(0, 3);
  const stats = statsData || { outings: outings.length, users: 0, destinations: 0, avgRating: 4.8 };
  app.innerHTML = `
    <section class="hero" id="heroSection" data-parallax>

// ─── OUTING CARD ────────────────────────────────────────────────
function outingCard(o) {
  const spotsLeft = o.max_participants - o.current_participants;
  const dateStr = new Date(o.date).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  const imgUrl = safeImageUrl(o.image_url);
  const title = escapeHtml(o.title);
  const location = escapeHtml(o.location);
  const desc = escapeHtml(o.description || '');
  return `
    <div class="card">
      <div class="card-img" style="background-image:url('${imgUrl}');cursor:pointer" onclick="navigate('outing-${o.id}')">
        <span class="badge">${location}</span>
        <span class="spots-left"><i class="fas fa-users"></i> ${spotsLeft} spots left</span>
      </div>
      <div class="card-body">
        <h3 style="cursor:pointer" onclick="navigate('outing-${o.id}')">${title}</h3>
        <div class="card-meta">
          <span><i class="far fa-calendar"></i> ${dateStr}</span>
          <span><i class="far fa-clock"></i> ${escapeHtml(o.time)}</span>
          <span><i class="fas fa-map-marker-alt"></i> ${location}</span>
        </div>
        <p>${desc}</p>
        ${o.matchReasons ? `<div class="rec-reasons">${o.matchReasons.map(r => `<span class="rec-reason">${escapeHtml(r)}</span>`).join('')}</div>` : ''}
        <div class="card-footer" style="margin-top:.75rem">
          <div class="price">
            <span style="text-decoration:line-through;color:var(--text-light);font-size:.85rem;font-weight:400">₹${o.cost}</span>
            <br>₹${Math.ceil(o.cost * 0.20)} <small>/person token</small>
          </div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-sm" style="background:#F1F5F9;color:var(--text)" onclick="navigate('outing-${o.id}')"><i class="fas fa-info-circle"></i></button>
            <button class="btn btn-primary btn-sm" onclick="bookOuting(${o.id})"><i class="fas fa-bolt"></i> Book</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ─── OUTINGS PAGE ───────────────────────────────────────────────
async function renderOutings(app) {
  outings = await api('/outings');
  app.innerHTML = `
    <section class="section">
      <h2 class="section-title">🗺️ All Outings</h2>
      <p class="section-subtitle">Find your perfect adventure</p>
      <div class="filters">
        <input type="text" id="searchFilter" placeholder="🔍 Search outings..." oninput="filterOutings()">
        <select id="locationFilter" onchange="filterOutings()">
          <option value="">All Locations</option>
          ${[...new Set(outings.map(o => o.location))].map(l => `<option>${l}</option>`).join('')}
        </select>
        <select id="budgetFilter" onchange="filterOutings()">
          <option value="">All Budgets</option>
          <option value="0-3000">Under ₹3,000</option>
          <option value="3000-6000">₹3,000 – ₹6,000</option>
          <option value="6000-11000">₹6,000 – ₹11,000</option>
          <option value="11000-99999">₹11,000+</option>
        </select>
      </div>
      <div class="cards-grid" id="outingsGrid">${outings.map(o => outingCard(o)).join('')}</div>
    </section>
  `;
}

function filterOutings() {
  const search = document.getElementById('searchFilter').value.toLowerCase();
  const loc = document.getElementById('locationFilter').value;
  const budget = document.getElementById('budgetFilter').value;
  let filtered = outings.filter(o => {
    if (search && !o.title.toLowerCase().includes(search) && !o.location.toLowerCase().includes(search)) return false;
    if (loc && o.location !== loc) return false;
    if (budget) { const [min, max] = budget.split('-').map(Number); if (o.cost < min || o.cost > max) return false; }
    return true;
  });
  document.getElementById('outingsGrid').innerHTML = filtered.length ? filtered.map(o => outingCard(o)).join('') : '<p style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:3rem">No outings found. Try different filters!</p>';
}

// ─── BOOKING ────────────────────────────────────────────────────
async function bookOuting(id) {
  if (!currentUser) return showLogin();
  const o = await api('/outings/' + id);
  const spotsLeft = o.max_participants - o.current_participants;
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-ticket-alt" style="color:var(--primary)"></i> Book: ${o.title}</h2>
    <div style="background:#F8FAFC;padding:1rem;border-radius:10px;margin-bottom:1.5rem">
      <div style="display:flex;justify-content:space-between;margin-bottom:.5rem"><span>📍 ${o.location}</span><span>📅 ${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span></div>
      <div style="display:flex;justify-content:space-between"><span>💰 ₹${o.cost}/person</span><span>👥 ${spotsLeft} spots left</span></div>
    </div>
    <form onsubmit="confirmBooking(event, ${o.id}, ${o.cost})">
      <div class="form-group"><label>Number of Participants</label><input type="number" id="bookParticipants" min="1" max="${spotsLeft}" value="1" required onchange="updateTotal(${o.cost})"></div>
      <div class="form-group"><label>Participant Names (comma separated)</label><input type="text" id="bookNames" placeholder="${currentUser.name}" value="${currentUser.name}"></div>
      <div style="background:rgba(108,60,225,.06);padding:1rem;border-radius:10px;margin-bottom:1rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <span style="font-weight:600">Total Trip Cost</span>
          <span style="font-size:1.2rem;font-weight:700;color:var(--text-light);text-decoration:line-through" id="bookTotal">₹${o.cost}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <span style="font-weight:700;color:var(--primary)">🔒 Pay Now (20% Token)</span>
          <span style="font-size:1.5rem;font-weight:800;color:var(--primary)" id="bookToken">₹${Math.ceil(o.cost * 0.20)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:.85rem;color:var(--text-light)">⏰ Remaining (80%) due 24hrs before trip</span>
          <span style="font-size:1rem;font-weight:600;color:var(--secondary)" id="bookRemaining">₹${o.cost - Math.ceil(o.cost * 0.20)}</span>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-lock"></i> Pay ₹<span id="bookTokenBtn">${Math.ceil(o.cost * 0.20)}</span> Token & Confirm</button>
    </form>
  `);
}

function updateTotal(cost) {
  const p = parseInt(document.getElementById('bookParticipants').value) || 1;
  const total = cost * p;
  const token = Math.ceil(total * 0.20);
  const remaining = total - token;
  document.getElementById('bookTotal').textContent = '₹' + total;
  document.getElementById('bookToken').textContent = '₹' + token;
  document.getElementById('bookRemaining').textContent = '₹' + remaining;
  document.getElementById('bookTokenBtn').textContent = token;
}

async function confirmBooking(e, outingId, cost) {
  e.preventDefault();
  const participants = parseInt(document.getElementById('bookParticipants').value);
  const participantNames = document.getElementById('bookNames').value;
  const totalAmount = cost * participants;
  const tokenAmount = Math.ceil(totalAmount * 0.20);

  // Step 1: Create Razorpay order on server (20% token)
  const orderRes = await api('/bookings/create-order', { method: 'POST', body: {
    outing_id: outingId, participants, participant_names: participantNames
  }});

  if (!orderRes.success) {
    if (orderRes.message && orderRes.message.includes('API keys')) {
      const fallback = await api('/bookings', { method: 'POST', body: { outing_id: outingId, participants, participant_names: participantNames, total_amount: totalAmount } });
      if (fallback.success) { closeModal(); toast('🎉 Token booking confirmed (demo)! Paid ₹' + fallback.token_amount + ' | Remaining ₹' + fallback.remaining_amount, 'success'); navigate(currentPage); }
      else toast(fallback.message, 'error');
      return;
    }
    toast(orderRes.message || 'Error creating order', 'error');
    return;
  }

  closeModal();

  // Step 2: Open Razorpay Checkout popup (20% token only)
  const options = {
    key: orderRes.key_id,
    amount: tokenAmount * 100,
    currency: 'INR',
    name: 'VIBES@Outing',
    description: '20% Token — ' + participants + ' participant(s) | Remaining due 24hrs before trip',
    image: 'https://img.icons8.com/3d-fluency/94/compass.png',
    order_id: orderRes.order_id,
    handler: async function (response) {
      const verifyRes = await api('/bookings/verify-payment', { method: 'POST', body: {
        razorpay_order_id: response.razorpay_order_id,
        razorpay_payment_id: response.razorpay_payment_id,
        razorpay_signature: response.razorpay_signature,
        booking_id: orderRes.booking_id
      }});
      if (verifyRes.success) {
        toast('🎉 Token payment of ₹' + orderRes.amount + ' successful!', 'success');
        setTimeout(() => {
          openModal(`
            <button class="close" onclick="closeModal()">&times;</button>
            <div style="text-align:center;padding:1rem">
              <div style="font-size:3rem;margin-bottom:1rem">🎉</div>
              <h2 style="color:var(--success)">Token Booking Confirmed!</h2>
              <p style="color:var(--text-light);margin:1rem 0">Payment ID: <code>${verifyRes.payment_id}</code></p>
              <div style="background:#F8FAFC;padding:1rem;border-radius:10px;margin:1rem 0;text-align:left">
                <p style="margin:.25rem 0"><strong>🔒 Token Paid:</strong> <span style="color:var(--success);font-weight:700">₹${orderRes.amount}</span></p>
                <p style="margin:.25rem 0"><strong>⏰ Remaining:</strong> <span style="color:var(--secondary);font-weight:700">₹${orderRes.remaining_amount}</span></p>
                <p style="margin:.25rem 0;font-size:.85rem;color:var(--text-light)">💡 Complete remaining payment 24 hours before the trip date</p>
              </div>
              ${verifyRes.whatsapp_link ? `<a href="${verifyRes.whatsapp_link}" target="_blank" class="btn btn-success btn-block" style="background:#25D366;margin-bottom:.75rem"><i class="fab fa-whatsapp"></i> Share on WhatsApp</a>` : ''}
              <button class="btn btn-primary btn-block" onclick="closeModal();navigate('dashboard')"><i class="fas fa-ticket-alt"></i> View My Bookings</button>
            </div>
          `);
        }, 500);
        navigate(currentPage);
      } else {
        toast('Payment verification failed', 'error');
      }
    },
    prefill: {
      name: currentUser.name,
      email: currentUser.email || '',
    },
    theme: { color: '#6C3CE1' },
    modal: {
      ondismiss: function () {
        toast('Payment cancelled', 'error');
        // Mark booking as cancelled
        api('/bookings/verify-payment', { method: 'POST', body: { razorpay_order_id: orderRes.order_id, razorpay_payment_id: '', razorpay_signature: '', booking_id: orderRes.booking_id } });
      }
    }
  };

  const rzp = new Razorpay(options);
  rzp.open();
}

// ─── PAY REMAINING (80%) ────────────────────────────────────────
async function payRemaining(bookingId) {
  const orderRes = await api('/bookings/pay-remaining', { method: 'POST', body: { booking_id: bookingId } });
  if (!orderRes.success) {
    // Fallback demo mode
    if (orderRes.message && orderRes.message.includes('Payment gateway')) {
      toast('Demo mode: Remaining payment marked as paid!', 'success');
      navigate('dashboard');
      return;
    }
    toast(orderRes.message || 'Error', 'error');
    return;
  }
  const options = {
    key: orderRes.key_id,
    amount: orderRes.amount * 100,
    currency: 'INR',
    name: 'VIBES@Outing',
    description: 'Remaining 80% Payment',
    image: 'https://img.icons8.com/3d-fluency/94/compass.png',
    order_id: orderRes.order_id,
    handler: async function (response) {
      const verifyRes = await api('/bookings/verify-remaining', { method: 'POST', body: {
        razorpay_order_id: response.razorpay_order_id,
        razorpay_payment_id: response.razorpay_payment_id,
        razorpay_signature: response.razorpay_signature,
        booking_id: bookingId
      }});
      if (verifyRes.success) { toast('🎉 Full payment complete! You\'re all set!', 'success'); navigate('dashboard'); }
      else toast('Payment verification failed', 'error');
    },
    prefill: { name: currentUser.name, email: currentUser.email || '' },
    theme: { color: '#F97316' },
    modal: { ondismiss: function() { toast('Payment cancelled', 'error'); } }
  };
  const rzp = new Razorpay(options);
  rzp.open();
}

let chatInterval = null;

async function renderChat(app, outingId) {
  if (!currentUser) return showLogin();
  const o = await api('/outings/' + outingId);
  const messages = await api('/chat/' + outingId);

  app.innerHTML = `
    <section class="section" style="max-width:700px">
      <div style="margin-bottom:1rem"><a href="#" onclick="navigate('outing-${outingId}')" style="color:var(--primary);font-size:.9rem"><i class="fas fa-arrow-left"></i> Back to ${o.title}</a></div>
      <div class="chat-box">
        <div class="chat-header"><i class="fas fa-comments"></i> ${o.title} — Group Chat</div>
        <div class="chat-messages" id="chatMessages">
          ${messages.length ? messages.map(m => chatBubble(m)).join('') : '<p style="text-align:center;color:var(--text-light);padding:2rem">No messages yet. Say hi! 👋</p>'}
        </div>
        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat(${outingId})">
          <button class="btn btn-primary btn-sm" onclick="sendChat(${outingId})"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </section>
  `;

  const chatDiv = document.getElementById('chatMessages');
  chatDiv.scrollTop = chatDiv.scrollHeight;

  // Auto-refresh chat every 3 seconds (pause when tab hidden)
  if (chatInterval) clearInterval(chatInterval);
  chatInterval = setInterval(async () => {
    if (!currentPage.startsWith('chat-')) { clearInterval(chatInterval); return; }
    if (document.visibilityState === 'hidden') return; // BUG-006: skip when tab not visible
    const newMsgs = await api('/chat/' + outingId);
    const chatEl = document.getElementById('chatMessages');
    if (chatEl && newMsgs.length) {
      chatEl.innerHTML = newMsgs.map(m => chatBubble(m)).join('');
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }, 3000);
}

function chatBubble(m) {
  const isMine = currentUser && m.user_id === currentUser.id;
  const time = new Date(m.created_at).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  return `<div class="chat-msg ${isMine ? 'mine' : 'other'}">
    ${!isMine ? `<div class="msg-name">${escapeHtml(m.user_name)}</div>` : ''}
    ${escapeHtml(m.message)}
    <div class="msg-time">${time}</div>
  </div>`;
}

async function sendChat(outingId) {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const data = await api('/chat', { method: 'POST', body: { outing_id: outingId, message: msg } });
  if (data.success) {
    const msgs = await api('/chat/' + outingId);
    const chatEl = document.getElementById('chatMessages');
    chatEl.innerHTML = msgs.map(m => chatBubble(m)).join('');
    chatEl.scrollTop = chatEl.scrollHeight;
  } else toast(data.message, 'error');
}

// ─── HERO SLIDER + IMMERSIVE EFFECTS ────────────────────────────

let heroSliderInterval = null;
let heroSliderPaused = false;
let heroCurrentSlide = 0;
const HERO_SLIDE_COUNT = 5;
const HERO_SLIDE_DURATION = 5000; // 5 seconds

function startHeroSlider() {
  if (heroSliderInterval) clearInterval(heroSliderInterval);
  heroSliderInterval = setInterval(() => {
    if (!heroSliderPaused) nextSlide();
  }, HERO_SLIDE_DURATION);
}

function nextSlide() {
  goToSlide((heroCurrentSlide + 1) % HERO_SLIDE_COUNT);
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  const caption = document.getElementById('heroCaption');
  if (!slides.length) return;

  // Remove active from current
  slides[heroCurrentSlide]?.classList.remove('active');
  slides[heroCurrentSlide]?.classList.add('prev');
  dots[heroCurrentSlide]?.classList.remove('active');

  // Clean prev class after transition
  const prevIdx = heroCurrentSlide;
  setTimeout(() => slides[prevIdx]?.classList.remove('prev'), 1800);

  heroCurrentSlide = index;

  // Reset Ken Burns by re-triggering animation
  const slide = slides[heroCurrentSlide];
  if (slide) {
    // Remove all kb classes and re-add to restart animation
    const kbClass = 'kb-' + (heroCurrentSlide + 1);
    slide.classList.remove(kbClass);
    void slide.offsetWidth; // force reflow
    slide.classList.add(kbClass);
    slide.classList.add('active');
  }
  dots[heroCurrentSlide]?.classList.add('active');

  // Update caption
  if (caption && slide) {
    const text = slide.getAttribute('data-caption') || '';
    caption.innerHTML = `<span>${text}</span>`;
  }

  // Reset timer
  startHeroSlider();
}

function toggleSlider() {
  heroSliderPaused = !heroSliderPaused;
  const btn = document.getElementById('heroPlayPause');
  if (btn) {
    btn.innerHTML = heroSliderPaused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
    btn.title = heroSliderPaused ? 'Resume slideshow' : 'Pause slideshow';
  }
}

// Generate sparkle particles
function generateParticles() {
  const container = document.getElementById('heroParticles');
  if (!container) return;
  container.innerHTML = '';
  const count = window.innerWidth < 768 ? 18 : 40;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (Math.random() > .7 ? ' gold' : '');
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
    p.style.animationDelay = (Math.random() * 5) + 's';
    p.style.animationDuration = (Math.random() * 3 + 2) + 's';
    container.appendChild(p);
  }
}

// Cursor-based parallax shift
let heroParallaxHandler = null;
function initParallax() {
  const hero = document.getElementById('heroSection');
  if (!hero || window.innerWidth < 768) return;
  heroParallaxHandler = (e) => {
    const rect = hero.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    const content = document.getElementById('heroContent');
    const ambient = hero.querySelector('.hero-ambient');
    if (content) content.style.transform = `translate(${x * 12}px, ${y * 10}px)`;
    if (ambient) ambient.style.transform = `translate(${x * -8}px, ${y * -6}px)`;
  };
  hero.addEventListener('mousemove', heroParallaxHandler);
  hero.addEventListener('mouseleave', () => {
    const content = document.getElementById('heroContent');
    const ambient = hero.querySelector('.hero-ambient');
    [content, ambient].forEach(el => {
      if (el) { el.style.transition = 'transform .6s ease-out'; el.style.transform = 'translate(0,0)'; setTimeout(() => { el.style.transition = 'transform .15s ease-out'; }, 600); }
    });
  });
}

// Ripple effect on glass buttons
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn-glass, .hero-search-btn');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple-circle';
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  ripple.style.animation = 'rippleEffect .6s ease-out forwards';
  btn.style.position = btn.style.position || 'relative';
  btn.style.overflow = 'hidden';
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});

// Preload slider images for smooth transitions
function preloadSliderImages() {
  const slides = document.querySelectorAll('.hero-slide');
  slides.forEach(slide => {
    const bg = slide.style.backgroundImage;
    const url = bg.replace(/url\(['"]?/, '').replace(/['"]?\)/, '');
    if (url) { const img = new Image(); img.src = url; }
  });
}

// Init hero effects after page renders
function initHeroEffects() {
  setTimeout(() => {
    generateParticles();
    initParallax();
    startHeroSlider();
    preloadSliderImages();
  }, 100);
}

// Cleanup slider on navigation away
function cleanupHeroSlider() {
  if (heroSliderInterval) { clearInterval(heroSliderInterval); heroSliderInterval = null; }
  if (heroParallaxHandler) {
    const hero = document.getElementById('heroSection');
    if (hero) hero.removeEventListener('mousemove', heroParallaxHandler);
    heroParallaxHandler = null;
  }
}
