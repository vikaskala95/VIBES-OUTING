  e.preventDefault();
  const password = document.getElementById('resetPass').value;
  const confirmPass = document.getElementById('resetPassConfirm').value;
  if (password !== confirmPass) return toast('Passwords do not match', 'error');
  const btn = document.getElementById('resetSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
  try {
    const res = await fetch((API_BASE || '') + '/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (data.success) {
      // Show success screen
      const app = document.getElementById('app');
      app.innerHTML = `
        <div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem">
          <div class="card" style="max-width:440px;width:100%;padding:2.5rem;text-align:center">
            <div style="margin-bottom:1.5rem">
              <i class="fas fa-check-circle" style="font-size:4rem;color:#27ae60"></i>
            </div>
            <h2 style="color:var(--dark);margin-bottom:.5rem">Password Updated!</h2>
            <p style="color:var(--gray);margin-bottom:1.5rem">Your password has been reset successfully.<br>You can now login with your new password.</p>
            <button class="btn btn-primary btn-block" onclick="window.history.replaceState({}, '', '/');navigate('home');showLogin()">
              <i class="fas fa-sign-in-alt"></i> Go to Login
            </button>
          </div>
        </div>
      `;
      toast('Password updated successfully!', 'success');
    } else {
      toast(data.message || 'Reset failed. The link may have expired.', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save"></i> Update Password';
    }
  } catch (err) {
    console.error('Reset password error:', err);
    toast('Something went wrong. Please try again.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i> Update Password';
  }
}

// Check for reset-password token in URL on page load (supports both path and query param)
let _pendingPasswordReset = false;
(function() {
  const params = new URLSearchParams(window.location.search);
  const isResetPath = window.location.pathname === '/reset-password';
  const isResetAction = params.get('action') === 'reset-password';
  const token = params.get('token');
  if ((isResetPath || isResetAction) && token) {
    _pendingPasswordReset = true;
    // Clean the URL without reloading
    window.history.replaceState({}, '', '/');
    setTimeout(() => showResetPassword(token), 300);
  }
})();

// ─── PAGES ──────────────────────────────────────────────────────
async function navigate(page, skipHistory) {
  // Guard against concurrent navigations that cause state corruption
  if (_navigating && !skipHistory) {
    console.warn('[NAV] Blocked concurrent navigate to:', page);
    return;
  }
  _navigating = true;
  try {
    await _navigateInternal(page, skipHistory);
  } catch (err) {
    console.error('[NAV] Error during navigation:', err);
  } finally {
    _navigating = false;
  }
}

async function _navigateInternal(page, skipHistory) {
  if (page && /^outing-\d+$/.test(page)) {
    const legacyId = parseInt(page.split('-')[1], 10);
    if (legacyId) {
      _navigating = false; // Allow nested navigate in navigateToOuting
      await navigateToOuting(legacyId, skipHistory);
      return;
    }
  }

  currentPage = page;
  const app = document.getElementById('app');
  cleanupHeroSlider();

  // Browser history support
  if (!skipHistory) {
    if (page === 'home') history.pushState({ page }, '', '/');
    else if (page === 'outings') history.pushState({ page }, '', '/outings');
    else if (page && page.startsWith('outing-slug:')) history.pushState({ page }, '', buildOutingPath(page.substring(12)));
    else history.pushState({ page }, '', '#' + page);
  }

  // Show loading spinner
  app.innerHTML = '<div class="loading-spinner"></div>';

  if (page === 'home') await renderHome(app);
  else if (page === 'outings') await renderOutings(app);
  else if (page === 'suggest') renderSuggest(app);
  else if (page === 'dashboard') await renderUserDashboard(app);
  else if (page === 'galleries') await renderUserGalleries(app);
  else if (page.startsWith('gallery-')) await openUserGallery(parseInt(page.split('-')[1]));
  else if (page === 'admin') await renderAdmin(app);
  else if (page === 'recommendations') await renderRecommendations(app);
  else if (page === 'blogs') await renderBlogList(app);
  else if (page.startsWith('blog-')) await renderBlogDetail(app, page.substring(5));
  else if (page.startsWith('outing-slug:')) await renderOutingDetailBySlug(app, page.substring(12));

  // Footer pages
  else if (page === 'about') renderAbout(app);
  else if (page === 'how-it-works') renderHowItWorks(app);
  else if (page === 'careers') renderCareers(app);
  else if (page === 'contact-support') renderContactSupport(app);
  else if (page === 'cancellation-policy') renderCancellationPolicy(app);
  else if (page === 'safety-center') renderSafetyCenter(app);
  else if (page === 'manage-trips') { if(currentUser) await renderUserDashboard(app); else showLogin(); }
  else if (page === 'partners') renderPartners(app);
  else if (page === 'affiliate') renderAffiliate(app);
  else if (page === 'privacy-policy') renderLegalPage(app, 'privacy');
  else if (page === 'terms-of-service') renderLegalPage(app, 'terms');
  else if (page === 'refund-policy') renderLegalPage(app, 'refund');
  else if (page === 'community-guidelines') renderLegalPage(app, 'community');
  else if (page === 'wishlist') await renderWishlist(app);
  else if (page === 'wallet') await renderWallet(app);
  else if (page === 'notifications') await renderNotificationsPage(app);

  if (page === 'home') setDefaultSeo('/');
  else if (page === 'outings') setDefaultSeo('/outings');
  else if (!page.startsWith('outing-slug:')) setDefaultSeo(window.location.pathname || '/');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function renderOutingDetailBySlug(app, slug) {
  const safeSlug = normalizeSlug(slug);
  if (!safeSlug) {
    renderOutingNotFound(app);
    return;
  }

  const outing = await api('/outings/by-slug/' + encodeURIComponent(safeSlug), { showToast: false });
  if (!outing || !outing.id) {
    renderOutingNotFound(app);
    return;
  }

  if (outing.slug && outing.slug !== safeSlug) {
    const correctedPage = 'outing-slug:' + outing.slug;
    currentPage = correctedPage;
    history.replaceState({ page: correctedPage }, '', buildOutingPath(outing.slug));
  }

  await renderOutingDetail(app, outing.id, outing);
}

function renderOutingNotFound(app) {
  clearOutingStructuredData();
  setSeoMeta({
    title: `Outing Not Found | ${SITE_NAME}`,
    description: 'The outing you are trying to access does not exist or is no longer available.',

// ─── OUTING CARD ────────────────────────────────────────────────
function getNextWeekendInfo(tripType) {
  const now = new Date();
  const targetDay = tripType === '2d1n' ? 5 : 6; // Friday=5, Saturday=6
  const cursor = new Date(now);
  cursor.setHours(0, 0, 0, 0);
  while (cursor.getDay() !== targetDay) cursor.setDate(cursor.getDate() + 1);
  const depTime = tripType === '2d1n' ? 22 : 4;
  const dep = new Date(cursor); dep.setHours(depTime, 0, 0, 0);
  const autoClose = tripType === '2d1n' ? 12 : 6;
  const hoursUntil = (dep - now) / (1000 * 60 * 60);
  if (hoursUntil <= autoClose) { cursor.setDate(cursor.getDate() + 7); const dep2 = new Date(cursor); dep2.setHours(depTime, 0, 0, 0); return { date: cursor, hoursUntil: (dep2 - now) / (1000 * 60 * 60) }; }
  return { date: cursor, hoursUntil };
}

function formatCountdown(hours) {
  if (hours <= 0) return '';
  const days = Math.floor(hours / 24);
  const hrs = Math.round(hours % 24);
  if (days > 0) return `${days}D ${hrs}H`;
  return `${hrs}H`;
}

function outingCard(o) {
  const spotsLeft = o.max_participants - o.current_participants;
  const dateStr = new Date(o.date).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  const imgUrl = safeImageUrl(o.image_url);
  const title = escapeHtml(o.title);
  const location = escapeHtml(o.location);
  const desc = escapeHtml(o.description || '');
  const tripType = o.trip_type || 'one_day';
  const tripLabel = tripType === '2d1n' ? '2D/1N' : 'One Day';
  const tripBadgeClass = tripType === '2d1n' ? 'two-day' : 'one-day';
  const departureTime = tripType === '2d1n' ? '10:00 PM (Fri)' : '4:00 AM (Sat)';
  const nextWeekend = getNextWeekendInfo(tripType);
  const countdownText = formatCountdown(nextWeekend.hoursUntil);
  const nextDateStr = nextWeekend.date.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
  const isSoldOut = spotsLeft <= 0;

  // Parse images array
  let images = [];
  try { images = typeof o.images === 'string' ? JSON.parse(o.images) : (o.images || []); } catch(e) {}
  images = images.filter(u => u && u.trim());
  if (!images.length && imgUrl) images = [imgUrl];
  if (!images.length) images = [''];

  const carouselId = 'carousel-' + o.id;
  const hasMultiple = images.length > 1;

  const slidesHtml = images.map(url => {
    if (!url) return `<div class="card-carousel-slide no-img"></div>`;
    const src = safeImageUrl(url);
    const blur = getBlurDataUrl(src);
    const blurDiv = blur ? `<div class="blur-placeholder" style="background-image:url('${blur}')"></div>` : '';
    return `<div class="card-carousel-slide"><img src="${src}" alt="Outing photo" loading="lazy" onload="var b=this.parentElement.querySelector('.blur-placeholder');if(b)b.classList.add('fade-out')">${blurDiv}</div>`;
  }).join('');
  const dotsHtml = hasMultiple ? `<div class="carousel-dots">${images.map((_, i) => `<button class="carousel-dot${i === 0 ? ' active' : ''}" data-idx="${i}" onclick="event.stopPropagation();slideCarousel('${carouselId}',${i})"></button>`).join('')}</div>` : '';

  const isWished = wishlistItems.includes(o.id);
  const outingNavArg = o.slug ? `'${escapeHtml(o.slug)}'` : o.id;
  return `
    <div class="card" style="position:relative">
      <button class="wishlist-heart${isWished ? ' active' : ''}" data-outing-id="${o.id}" onclick="event.stopPropagation();toggleWishlist(${o.id})" title="${isWished ? 'Remove from wishlist' : 'Add to wishlist'}">${isWished ? '<i class="fas fa-heart" style="color:var(--danger)"></i>' : '<i class="far fa-heart"></i>'}</button>
      <div class="card-carousel" id="${carouselId}" data-idx="0" onclick="navigateToOuting(${outingNavArg})" style="cursor:pointer;position:relative">
        <div class="card-carousel-inner">${slidesHtml}</div>
        ${hasMultiple ? `<button class="carousel-btn carousel-prev" onclick="event.stopPropagation();slideCarousel('${carouselId}','prev')"><i class="fas fa-chevron-left"></i></button>
        <button class="carousel-btn carousel-next" onclick="event.stopPropagation();slideCarousel('${carouselId}','next')"><i class="fas fa-chevron-right"></i></button>` : ''}
        ${dotsHtml}
        <span class="trip-type-badge ${tripBadgeClass}" style="position:absolute;top:14px;right:14px;z-index:2">${tripLabel}</span>
      </div>
      <div class="card-body">
        <h3 style="cursor:pointer" onclick="navigateToOuting(${outingNavArg})">${title}</h3>
        <div class="card-meta">
          <span><i class="far fa-calendar"></i> ${dateStr}</span>
          <span><i class="far fa-clock"></i> ${escapeHtml(departureTime)}</span>
          <span><i class="fas fa-map-marker-alt"></i> ${location}</span>
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem">
          <span class="next-weekend-badge"><i class="fas fa-calendar-check"></i> Next: ${nextDateStr}</span>
          ${countdownText ? `<span class="trip-countdown"><i class="fas fa-hourglass-half"></i> Starts in ${countdownText}</span>` : ''}
        </div>
        <p>${desc}</p>
        ${o.matchReasons ? `<div class="rec-reasons">${o.matchReasons.map(r => `<span class="rec-reason">${escapeHtml(r)}</span>`).join('')}</div>` : ''}
        <div class="spots-left-info ${isSoldOut ? 'sold-out' : ''}">
          <i class="fas ${isSoldOut ? 'fa-ban' : 'fa-users'}"></i> ${isSoldOut ? 'Sold Out' : `${spotsLeft} Spots Left`}
        </div>
        <div class="card-footer" style="margin-top:.75rem">
          <div class="price">
            <span style="text-decoration:line-through;color:var(--text-light);font-size:.85rem;font-weight:400">₹${o.cost}</span>
            <br>₹${Math.ceil(o.cost * 0.20)} <small>/person token</small>
          </div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-sm" style="background:#F1F5F9;color:var(--text)" onclick="navigateToOuting(${outingNavArg})"><i class="fas fa-info-circle"></i></button>
            ${isSoldOut
              ? `<button class="btn btn-sm" style="background:#EF4444;color:#fff" disabled><i class="fas fa-ban"></i> Sold Out</button>`
              : `<button class="btn btn-primary btn-sm" onclick="bookOuting(${o.id})"><i class="fas fa-bolt"></i> Book</button>`
            }
          </div>
        </div>
      </div>
    </div>
  `;
}

async function renderOutings(app) {
  const url = selectedVibe ? '/outings?category=' + encodeURIComponent(selectedVibe) : '/outings';
  const data = await api(url, { showToast: false });
  const apiFailed = !Array.isArray(data) && data && data.success === false;
  outings = Array.isArray(data) ? data : [];
  const vibeLabels = { beaches: '🏖️ Beaches', mountains: '⛰️ Mountains', festivals: '🎵 Festivals', road_trips: '🚗 Road Trips', adventure: '🥾 Adventure', nightlife: '🌙 Nightlife' };

  let gridContent = '';
  if (apiFailed) {
    gridContent = `<div style="grid-column:1/-1;text-align:center;padding:3rem">
      <i class="fas fa-exclamation-triangle" style="font-size:2.5rem;color:var(--warning);margin-bottom:1rem"></i>

      <button class="btn btn-primary" onclick="renderOutings(document.getElementById('app'))"><i class="fas fa-redo"></i> Retry</button>

    gridContent = '<p style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:3rem">No outings found. Check back soon!</p>';
  } else {
    gridContent = outings.map(o => outingCard(o)).join('');
  }

  app.innerHTML = `
    <section class="section">
      <h2 class="section-title">🗺️ ${selectedVibe ? vibeLabels[selectedVibe] || 'Outings' : 'All Outings'}</h2>
      <p class="section-subtitle">${selectedVibe ? 'Showing ' + (vibeLabels[selectedVibe] || selectedVibe) + ' experiences' : 'Find your perfect adventure'}</p>
      <div class="vibe-filters">
        <button class="vibe-filter-btn${!selectedVibe ? ' vibe-btn-active' : ''}" data-category="" onclick="selectedVibe=null;renderOutings(document.getElementById('app'))">All</button>
        ${Object.entries(vibeLabels).map(([key, label]) => `<button class="vibe-filter-btn${selectedVibe===key ? ' vibe-btn-active' : ''}" data-category="${key}" onclick="selectVibe('${key}')">${label}</button>`).join('')}
      </div>
      ${!apiFailed ? `<div class="filters">
        <input type="text" id="searchFilter" placeholder="🔍 Search outings..." oninput="filterOutings()">
        <select id="locationFilter" onchange="filterOutings()">
          <option value="">All Locations</option>
          ${[...new Set(outings.map(o => o.location))].map(l => `<option>${l}</option>`).join('')}
        </select>
        <select id="budgetFilter" onchange="filterOutings()">
          <option value="">All Budgets</option>
          <option value="0-3000">Under ₹3,000</option>
          <option value="3000-6000">₹3,000 – ₹6,000</option>
          <option value="6000-11000">₹6,000 – ₹11,000</option>
          <option value="11000-99999">₹11,000+</option>
        </select>
      </div>` : ''}
      <div class="cards-grid" id="outingsGrid" style="transition:opacity .3s ease, transform .3s ease">${gridContent}</div>
    </section>
  `;
  // Apply pending search from hero/destination chips
  if (typeof _pendingSearch !== 'undefined' && _pendingSearch) {
    const sf = document.getElementById('searchFilter');
    if (sf) { sf.value = _pendingSearch; _pendingSearch = null; filterOutings(); }
  }
}

function filterOutings() {
  const search = (document.getElementById('searchFilter')?.value || '').toLowerCase();
  const loc = document.getElementById('locationFilter')?.value || '';
  const budget = document.getElementById('budgetFilter')?.value || '';
  let filtered = outings.filter(o => {
    if (search && !o.title.toLowerCase().includes(search) && !o.location.toLowerCase().includes(search) && !(o.description || '').toLowerCase().includes(search) && !(o.category || '').toLowerCase().includes(search)) return false;
    if (loc && o.location !== loc) return false;
    if (budget) { const [min, max] = budget.split('-').map(Number); if (o.cost < min || o.cost > max) return false; }
    return true;
  });
  document.getElementById('outingsGrid').innerHTML = filtered.length ? filtered.map(o => outingCard(o)).join('') : '<p style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:3rem">No outings found. Try different filters!</p>';
}

function selectWeekendDate(el, dateStr) {
  document.querySelectorAll('.weekend-date-option').forEach(opt => opt.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('selectedWeekendDate').value = dateStr;
  const label = el.querySelector('.date-label');
  document.getElementById('bookSelectedDateText').textContent = label ? label.textContent : dateStr;
  document.getElementById('bookSelectedSummary').style.display = 'block';
  document.getElementById('bookSubmitBtn').disabled = false;
  document.getElementById('bookSubmitBtn').style.opacity = '1';
}

function updateTotal(cost) {
  const p = parseInt(document.getElementById('bookParticipants').value) || 1;
  const total = cost * p;
  const useWallet = !!(document.getElementById('useWalletToggle') && document.getElementById('useWalletToggle').checked);
  const discount = useWallet ? Math.max(0, Math.min(bookingWalletBalance, Math.floor(total * 0.9))) : 0;
  const payable = total - discount;
  const token = Math.ceil(payable * 0.20);
  const remaining = payable - token;
  document.getElementById('bookTotal').textContent = '₹' + total;
  const discRow = document.getElementById('bookDiscountRow');
  if (discRow) {
    discRow.style.display = discount > 0 ? 'flex' : 'none';
    const discEl = document.getElementById('bookDiscount');
    if (discEl) discEl.textContent = '-₹' + discount;
  }
  document.getElementById('bookToken').textContent = '₹' + token;
  document.getElementById('bookRemaining').textContent = '₹' + remaining;
  document.getElementById('bookTokenBtn').textContent = token;
}

async function confirmBooking(e, outingId, cost) {
  e.preventDefault();
  const participants = parseInt(document.getElementById('bookParticipants').value);
  const participantNames = document.getElementById('bookNames').value;
  const totalAmount = cost * participants;
  const useWallet = !!(document.getElementById('useWalletToggle') && document.getElementById('useWalletToggle').checked);
  const selectedDate = document.getElementById('selectedWeekendDate') ? document.getElementById('selectedWeekendDate').value : '';
  const departureTime = document.getElementById('selectedDepartureTime') ? document.getElementById('selectedDepartureTime').value : '';

  if (!selectedDate) { toast('Please select a weekend date', 'error'); return; }
  if (useWallet) trackEvent('reward_redeem_attempt', { placement: 'booking_modal' });

  // Step 1: Create Razorpay order on server (20% token, minus any wallet discount)
  const orderRes = await api('/bookings/create-order', { method: 'POST', body: {
    outing_id: outingId, participants, participant_names: participantNames, selected_date: selectedDate, departure_time: departureTime, use_wallet: useWallet
  }});

  if (!orderRes.success) {
    if (orderRes.message && orderRes.message.includes('API keys')) {
      const fallback = await api('/bookings', { method: 'POST', body: { outing_id: outingId, participants, participant_names: participantNames, total_amount: totalAmount, selected_date: selectedDate, departure_time: departureTime, use_wallet: useWallet } });
      if (fallback.success) {
        closeModal();
        if (fallback.wallet_discount > 0) trackEvent('reward_redeemed', { amount: fallback.wallet_discount });
        if (fallback.reward_credited > 0) trackEvent('reward_credited', { amount: fallback.reward_credited });
        const rewardMsg = fallback.reward_credited > 0 ? ' | 🎁 ₹' + fallback.reward_credited + ' wallet credit earned!' : '';
        toast('🎉 Token booking confirmed (demo)! Paid ₹' + fallback.token_amount + ' | Remaining ₹' + fallback.remaining_amount + rewardMsg, 'success');
        showBookingSuccessModal({ token_amount: fallback.token_amount, remaining_amount: fallback.remaining_amount, wallet_discount: fallback.wallet_discount || 0, reward_credited: fallback.reward_credited || 0, payment_id: fallback.payment_id || 'DEMO', booking_id: fallback.booking_id });
      }
      else toast(fallback.message, 'error');
      return;
    }
    toast(orderRes.message || 'Error creating order', 'error');
    return;
  }

  closeModal();

  // Step 2: Open Razorpay Checkout popup (server-computed token amount)
  const options = {
    key: orderRes.key_id,
    amount: orderRes.amount * 100,
    currency: 'INR',
    name: 'VIBES@Outing',
    description: '20% Token — ' + participants + ' participant(s) | Remaining due 24hrs before trip',
    image: 'https://img.icons8.com/3d-fluency/94/compass.png',
    order_id: orderRes.order_id,
    handler: async function (response) {
      const verifyRes = await api('/bookings/verify-payment', { method: 'POST', body: {
        razorpay_order_id: response.razorpay_order_id,
        razorpay_payment_id: response.razorpay_payment_id,
        razorpay_signature: response.razorpay_signature,
        booking_id: orderRes.booking_id
      }});
      if (verifyRes.success) {
        if (verifyRes.wallet_discount > 0) trackEvent('reward_redeemed', { amount: verifyRes.wallet_discount });
        if (verifyRes.reward_credited > 0) trackEvent('reward_credited', { amount: verifyRes.reward_credited });
        toast('🎉 Token payment of ₹' + orderRes.amount + ' successful!', 'success');
        showBookingSuccessModal({ token_amount: orderRes.amount, remaining_amount: orderRes.remaining_amount, wallet_discount: verifyRes.wallet_discount || 0, reward_credited: verifyRes.reward_credited || 0, payment_id: verifyRes.payment_id || response.razorpay_payment_id, booking_id: orderRes.booking_id, whatsapp_link: verifyRes.whatsapp_link });
      } else {
        toast('Payment verification failed', 'error');
      }
    },
    prefill: {
      name: currentUser.name,
      email: currentUser.email || '',
    },
    theme: { color: '#6C3CE1' },
    modal: {
      ondismiss: function () {
        toast('Payment cancelled', 'error');
        // Mark booking as cancelled
        api('/bookings/verify-payment', { method: 'POST', body: { razorpay_order_id: orderRes.order_id, razorpay_payment_id: '', razorpay_signature: '', booking_id: orderRes.booking_id } });
      }
    }
  };

  const rzp = new Razorpay(options);
  rzp.open();
}

          html += '</div>';
          if (b.expectation) {
            html += '<div style="margin-top:.75rem;padding:.75rem;background:#F8FAFC;border-radius:8px;font-size:.9rem;color:var(--text)">' + escapeHtml(b.expectation.expectations).substring(0, 200) + (b.expectation.expectations.length > 200 ? '...' : '') + '</div>';
            if (tags.length) {
              html += '<div style="margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.4rem">';
              tags.forEach(t => { html += '<span style="background:rgba(108,60,225,.08);color:var(--primary);padding:.2rem .6rem;border-radius:999px;font-size:.7rem;font-weight:500">' + escapeHtml(t.trim()) + '</span>'; });

          }
          html += '</div>';
        });
        html += '</div>';
        return html;
      })()}

  `;
}

async function payRemaining(bookingId) {
  const orderRes = await api('/bookings/pay-remaining', { method: 'POST', body: { booking_id: bookingId } });
  if (!orderRes.success) {
    // Fallback demo mode
    if (orderRes.message && orderRes.message.includes('Payment gateway')) {
      toast('Demo mode: Remaining payment marked as paid!', 'success');
      navigate('dashboard');
      return;
    }
    toast(orderRes.message || 'Error', 'error');
    return;
  }
  const options = {
    key: orderRes.key_id,
    amount: orderRes.amount * 100,
    currency: 'INR',
    name: 'VIBES@Outing',
    description: 'Remaining 80% Payment',
    image: 'https://img.icons8.com/3d-fluency/94/compass.png',
    order_id: orderRes.order_id,
    handler: async function (response) {
      const verifyRes = await api('/bookings/verify-remaining', { method: 'POST', body: {
        razorpay_order_id: response.razorpay_order_id,
        razorpay_payment_id: response.razorpay_payment_id,
        razorpay_signature: response.razorpay_signature,

      }});

}

function toggleExpTag(btn, tag) {
  const input = document.getElementById('expTagsInput');
  let tags = input.value ? input.value.split(',').filter(t=>t.trim()) : [];
  if (tags.includes(tag)) {
    tags = tags.filter(t => t !== tag);
    btn.style.border = '1.5px solid #E2E8F0';
    btn.style.background = '#fff';
    btn.style.color = 'var(--text-light)';
    btn.classList.remove('active');
  } else {
    tags.push(tag);
    btn.style.border = '1.5px solid var(--primary)';
    btn.style.background = 'rgba(108,60,225,.1)';
    btn.style.color = 'var(--primary)';
    btn.classList.add('active');
  }
  input.value = tags.join(',');
}

let _expectationsSubmitting = false;
async function submitExpectations(e, bookingId) {
  e.preventDefault();
  if (_expectationsSubmitting) return;

  const expectations = document.getElementById('expText').value.trim();
  const tags = document.getElementById('expTagsInput').value;

  if (!expectations) { toast('Please write your expectations', 'error'); return; }
  if (expectations.length < 10) { toast('Please write at least 10 characters', 'error'); return; }

  const submitBtn = e.target.querySelector('button[type="submit"]');
  _expectationsSubmitting = true;
  if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...'; }

  try {
    const data = await api('/expectations', { method: 'POST', body: { booking_id: bookingId, expectations, tags } });
    if (data.success) {
      closeModal();
      toast(data.updated ? '✅ Expectations updated!' : '🎉 Expectations submitted! Have a great trip!', 'success');
      navigate('dashboard');
    } else {
      toast(data.message || 'Something went wrong. Please try again.', 'error');
    }
  } catch (err) {
    console.error('Submit expectations error:', err);
    toast('Failed to submit expectations. Please try again.', 'error');
  } finally {
    _expectationsSubmitting = false;
    if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Expectations'; }
  }
}

async function deleteExpectation(expId) {
  if (!confirm('Remove your expectations for this trip?')) return;
  const data = await api('/expectations/' + expId, { method: 'DELETE' });
  if (data.success) {
    toast('Expectations removed', 'success');
    navigate('dashboard');
  } else {
    toast(data.message || 'Failed to remove', 'error');
  }
}

      api('/reviews/eligibility/' + outingId),
      api('/blogs/eligibility/' + outingId)
    ]);
  }

  // Parse images for detail gallery

  detailImages = detailImages.filter(u => u && u.trim());

// ─── DETAILED TRIP PLAN ─────────────────────────────────────────
async function showDetailedPlan(outingId) {
  const section = document.getElementById('detailed-plan-section-' + outingId);
  if (!section) return;
  // Toggle visibility if already loaded
  if (section.dataset.loaded === 'true') {
    section.style.display = section.style.display === 'none' ? 'block' : 'none';
    return;
  }
  section.style.display = 'block';
  section.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-light)"><i class="fas fa-spinner fa-spin" style="font-size:1.5rem"></i><p style="margin-top:.5rem">Loading detailed plan...</p></div>';
  try {
    const data = await api('/outings/' + outingId + '/detailed-plan');
    if (!data.success || !data.plan) {
      section.innerHTML = '<div style="background:#fff;padding:1.5rem;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center;color:var(--text-light)"><i class="fas fa-map" style="font-size:2rem;margin-bottom:.5rem;opacity:.3"></i><p>Detailed plan coming soon for this outing!</p></div>';
      return;
    }
    section.dataset.loaded = 'true';
    section.innerHTML = renderDetailedPlan(data.plan);
  } catch (e) {
    section.innerHTML = '<div style="background:#fff;padding:1rem;border-radius:var(--radius);color:var(--danger)"><i class="fas fa-exclamation-circle"></i> Could not load detailed plan.</div>';
  }
}

        <label style="display:flex;align-items:center;gap:.35rem;cursor:pointer;font-size:.9rem"><input type="radio" name="recommend" value="no"> <i class="fas fa-thumbs-down" style="color:var(--danger)"></i> No</label>

function selectStar(n) {
  window._selectedRating = n;
  document.querySelectorAll('#starInput i').forEach((s,i) => s.classList.toggle('active', i < n));
}
function hoverStar(n) { document.querySelectorAll('#starInput i').forEach((s,i) => s.classList.toggle('active', i < n)); }
function resetStars() { const n = window._selectedRating; document.querySelectorAll('#starInput i').forEach((s,i) => s.classList.toggle('active', i < n)); }

async function submitReview(outingId) {
  if (!window._selectedRating) return toast('Please select a rating', 'error');
  const recommend = document.querySelector('input[name="recommend"]:checked');
  const data = await api('/reviews', { method: 'POST', body: {
    outing_id: outingId,
    rating: window._selectedRating,
    title: document.getElementById('reviewTitle').value,
    comment: document.getElementById('reviewComment').value,
    recommend: recommend ? recommend.value === 'yes' : true
  }});
  if (data.success) { closeModal(); toast('⭐ Review submitted!', 'success'); navigateToOuting(outingId); }
  else toast(data.message, 'error');
}

async function markHelpful(reviewId) {
  const data = await api('/reviews/' + reviewId + '/helpful', { method: 'POST' });
  if (data.success) toast('👍 Marked as helpful!', 'success');
  else toast(data.message || 'Please login to vote', 'error');
}

async function submitBlog(outingId) {
  const title = document.getElementById('blogTitle').value.trim();
  const content = document.getElementById('blogContent').value.trim();
  if (!title) return toast('Blog title is required', 'error');
  if (!content || content.length < 50) return toast('Please write at least 50 characters', 'error');

  const data = await api('/blogs', { method: 'POST', body: {
    outing_id: outingId,
    title,
    content,
    cover_image: document.getElementById('blogCover').value.trim(),
    category: document.getElementById('blogCategory').value,
    tags: document.getElementById('blogTags').value.trim()
  }});
  if (data.success) { closeModal(); toast('✍️ Blog submitted for review!', 'success'); navigateToOuting(outingId); }
  else toast(data.message, 'error');
}

async function renderBlogList(app) {
  const blogs = await api('/blogs');
  const categories = ['All', 'Adventure', 'Family Trip', 'Solo Travel', 'Budget Travel', 'Luxury Experience', 'Food Journey', 'Weekend Getaway', 'Cultural', 'Nature'];
  
  app.innerHTML = `
    <section class="section">
      <h2 class="section-title">✍️ Travel Stories & Blogs</h2>
      <p class="section-subtitle">Real experiences from verified travelers</p>
      <div class="blog-categories-filter" id="blogFilter">
        ${categories.map(c => `<button class="${c === 'All' ? 'active' : ''}" onclick="filterBlogs('${c}')">${c}</button>`).join('')}
      </div>
      <div class="blog-grid" id="blogGrid">
        ${Array.isArray(blogs) && blogs.length ? blogs.map(b => renderBlogCard(b)).join('') : `
          <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-light)">
            <i class="fas fa-pen-fancy" style="font-size:3rem;margin-bottom:1rem;opacity:.3"></i>
            <p>No travel stories yet. Complete a trip to share yours!</p>
          </div>
        `}
      </div>
    </section>

  window._allBlogs = blogs;
}

function renderBlogCard(b) {
  const coverImg = b.cover_image || b.outing_image || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80';
  const excerpt = (b.content || '').replace(/<[^>]*>/g, '').substring(0, 150);
  const tags = (b.tags || '').split(',').filter(t => t.trim());
  return `
    <div class="blog-card" onclick="navigate('blog-${b.slug}')">
      <div class="blog-cover" style="background-image:url('${escapeHtml(coverImg)}')">
        <span class="blog-category">${escapeHtml(b.category || 'Adventure')}</span>
        ${b.featured ? '<span class="blog-featured"><i class="fas fa-star"></i> Featured</span>' : ''}
      </div>
      <div class="blog-body">
        <h3>${escapeHtml(b.title)}</h3>
        ${tags.length ? `<div class="blog-tags">${tags.slice(0, 4).map(t => `<span>#${escapeHtml(t.trim())}</span>`).join('')}</div>` : ''}
        <div class="blog-excerpt">${escapeHtml(excerpt)}...</div>
        <div class="blog-footer">
          <div class="author"><i class="fas fa-user-circle" style="color:var(--primary)"></i> ${escapeHtml(b.author_name)}</div>
          <span>${new Date(b.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</span>
        </div>
      </div>
    </div>
  `;
}

function filterBlogs(category) {
  document.querySelectorAll('.blog-categories-filter button').forEach(btn => btn.classList.toggle('active', btn.textContent === category));
  const filtered = category === 'All' ? window._allBlogs : (window._allBlogs || []).filter(b => b.category === category);
  const grid = document.getElementById('blogGrid');
  if (grid) {
    grid.innerHTML = filtered.length ? filtered.map(b => renderBlogCard(b)).join('') : `
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-light)">
        <p>No stories in this category yet.</p>
      </div>`;
  }
}

async function renderBlogDetail(app, slug) {
  const blog = await api('/blogs/by-slug/' + encodeURIComponent(slug));
  if (!blog || blog.success === false) {
    app.innerHTML = `<section class="section" style="text-align:center;padding:4rem"><h2>Blog Not Found</h2><p style="color:var(--text-light)">This blog may have been removed or is pending approval.</p><button class="btn btn-primary" onclick="navigate('blogs')" style="margin-top:1rem">Browse All Blogs</button></section>`;
    return;
  }
  const coverImg = blog.cover_image || blog.outing_image || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80';
  const tags = (blog.tags || '').split(',').filter(t => t.trim());
  // Simple markdown-like formatting
  const formattedContent = (blog.content || '')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');

  app.innerHTML = `
    <section class="section blog-detail">
      <div style="margin-bottom:1rem"><a href="#" onclick="navigate('blogs')" style="color:var(--primary);font-size:.9rem"><i class="fas fa-arrow-left"></i> Back to Blogs</a></div>
      <div class="blog-hero" style="background-image:url('${escapeHtml(coverImg)}')">
        <div class="overlay">
          <span style="background:rgba(255,255,255,.2);padding:.25rem .75rem;border-radius:999px;font-size:.8rem;backdrop-filter:blur(4px)">${escapeHtml(blog.category || 'Adventure')}</span>
          <h1 style="font-size:1.8rem;margin-top:.5rem;line-height:1.3">${escapeHtml(blog.title)}</h1>
          <div style="display:flex;align-items:center;gap:1rem;margin-top:.75rem;font-size:.85rem;opacity:.9">
            <span><i class="fas fa-user"></i> ${escapeHtml(blog.author_name)}</span>
            <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(blog.outing_location)}</span>
            <span><i class="fas fa-calendar"></i> ${new Date(blog.created_at).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})}</span>
          </div>
        </div>
      </div>
      ${tags.length ? `<div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem">${tags.map(t => `<span style="background:rgba(108,60,225,.08);color:var(--primary);padding:.3rem .75rem;border-radius:999px;font-size:.8rem">#${escapeHtml(t.trim())}</span>`).join('')}</div>` : ''}
      <div class="blog-content">
        <p>${formattedContent}</p>
      </div>
      <div style="margin-top:2rem;padding:1.5rem;background:rgba(108,60,225,.03);border-radius:var(--radius);display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
        <i class="fas fa-route" style="font-size:2rem;color:var(--primary)"></i>
        <div>
          <strong>This story is from: ${escapeHtml(blog.outing_title)}</strong>
          <p style="color:var(--text-light);font-size:.85rem;margin-top:.25rem">${escapeHtml(blog.outing_location)} • ${new Date(blog.outing_date).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'})}</p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="navigateToOuting(${blog.outing_id})" style="margin-left:auto"><i class="fas fa-eye"></i> View Outing</button>
      </div>
    </section>
  `;
}

    <tbody>${apps.map(a => {

      const statusColor = statusColors[a.application_status] || 'var(--text-light)';
      const date = new Date(a.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      return `<tr>
        <td><strong>${esc(a.business_name)}</strong></td>
        <td>${esc(a.contact_name)}</td>
        <td style="font-size:.8rem">${esc(a.email)}</td>
        <td style="font-size:.8rem">${esc(a.phone)}</td>
        <td><span style="background:rgba(108,60,225,.08);color:var(--primary);padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:600">${esc(a.property_type)}</span></td>
        <td>${esc(a.location)}</td>
        <td><span style="background:${statusColor};color:#fff;padding:3px 10px;border-radius:8px;font-size:.75rem;font-weight:600">${a.application_status}</span></td>
        <td style="font-size:.8rem;color:var(--text-light)">${date}</td>

          ${a.application_status === 'Pending' ? `
            <button onclick="updatePartnerAppStatus(${a.id},'Approved')" style="background:none;border:none;color:var(--success);cursor:pointer;padding:4px 6px;font-size:.85rem" title="Approve"><i class="fas fa-check-circle"></i></button>
            <button onclick="updatePartnerAppStatus(${a.id},'Rejected')" style="background:none;border:none;color:var(--danger);cursor:pointer;padding:4px 6px;font-size:.85rem" title="Reject"><i class="fas fa-times-circle"></i></button>
          ` : ''}

        </td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function esc(s) { return typeof s === 'string' ? s.replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'}[c])) : s; }

async function filterPartnerApps() {
  const search = document.getElementById('partnerAppSearch').value.trim();
  const status = document.getElementById('partnerAppStatusFilter').value;
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (status !== 'all') params.set('status', status);
  const apps = await api('/admin/partner-applications?' + params.toString());
  document.getElementById('partnerAppsTableWrap').innerHTML = renderPartnerAppsTable(Array.isArray(apps) ? apps : []);
}

async function viewPartnerApp(id) {
  const app_data = await api('/admin/partner-applications/' + id);
  if (!app_data || app_data.success === false) { toast('Application not found', 'error'); return; }
  const statusColors = { Pending: '#F59E0B', Approved: '#10B981', Rejected: '#EF4444' };
  const statusColor = statusColors[app_data.application_status] || '#64748B';
  const date = new Date(app_data.created_at).toLocaleString('en-IN');
  openModal(`
    <div style="max-width:500px">
      <h2 style="margin-bottom:1rem;display:flex;align-items:center;gap:.5rem"><i class="fas fa-handshake" style="color:var(--secondary)"></i> Partner Application</h2>
      <div style="background:#F8FAFC;padding:16px;border-radius:12px;margin-bottom:1rem">
        <p style="margin:6px 0"><strong>Business Name:</strong> ${esc(app_data.business_name)}</p>
        <p style="margin:6px 0"><strong>Contact Name:</strong> ${esc(app_data.contact_name)}</p>
        <p style="margin:6px 0"><strong>Email:</strong> ${esc(app_data.email)}</p>
        <p style="margin:6px 0"><strong>Phone:</strong> ${esc(app_data.phone)}</p>
        <p style="margin:6px 0"><strong>Property Type:</strong> ${esc(app_data.property_type)}</p>
        <p style="margin:6px 0"><strong>Location:</strong> ${esc(app_data.location)}</p>
        <p style="margin:6px 0"><strong>Description:</strong> ${esc(app_data.description) || '<em style="color:var(--text-light)">Not provided</em>'}</p>
        <p style="margin:6px 0"><strong>Status:</strong> <span style="background:${statusColor};color:#fff;padding:2px 10px;border-radius:8px;font-size:.8rem;font-weight:600">${app_data.application_status}</span></p>
        <p style="margin:6px 0;color:var(--text-light);font-size:.85rem"><strong>Submitted:</strong> ${date}</p>
      </div>
      ${app_data.application_status === 'Pending' ? `
        <div style="display:flex;gap:.5rem">
          <button onclick="updatePartnerAppStatus(${app_data.id},'Approved');closeModal()" class="btn btn-primary" style="flex:1;background:var(--success);border:none;padding:.6rem;border-radius:10px;color:#fff;font-weight:600;cursor:pointer"><i class="fas fa-check"></i> Approve</button>
          <button onclick="updatePartnerAppStatus(${app_data.id},'Rejected');closeModal()" class="btn" style="flex:1;background:var(--danger);border:none;padding:.6rem;border-radius:10px;color:#fff;font-weight:600;cursor:pointer"><i class="fas fa-times"></i> Reject</button>
        </div>
      ` : ''}
    </div>
  `);
}

async function updatePartnerAppStatus(id, status) {
  const data = await api('/admin/partner-applications/' + id + '/status', { method: 'PUT', body: { status } });
  if (data.success) {
    toast('Application ' + status.toLowerCase() + ' successfully!', 'success');
    renderAdminPartnerApps();
  } else {
    toast(data.message || 'Failed to update status', 'error');
  }
}

async function deletePartnerApp(id) {
  if (!confirm('Are you sure you want to delete this application?')) return;
  const data = await api('/admin/partner-applications/' + id, { method: 'DELETE' });
  if (data.success) {
    toast('Application deleted', 'success');
    renderAdminPartnerApps();
  } else {
    toast(data.message || 'Failed to delete', 'error');
  }
}

// ─── ADMIN: DIGITAL PASSES ──────────────────────────────────────
async function renderAdminDigitalPasses() {
  const container = document.getElementById('adminContent');
  container.innerHTML = '<div class="loading-spinner"></div>';
  const passes = await api('/admin/digital-passes');
  const passList = Array.isArray(passes) ? passes : [];
  const verified = passList.filter(p => p.boarding_status === 'verified').length;
  const pending = passList.filter(p => p.boarding_status === 'not_verified').length;
  const revoked = passList.filter(p => p.boarding_status === 'revoked').length;

  container.innerHTML = `
    <h2 style="margin-bottom:1rem"><i class="fas fa-qrcode" style="color:#1a1a2e"></i> Digital Passes (${passList.length})</h2>
    <div class="dash-stats" style="margin-bottom:1.5rem">
      <div class="dash-stat"><div class="icon" style="background:rgba(108,60,225,.1);color:var(--primary)"><i class="fas fa-ticket-alt"></i></div><h4>Total</h4><div class="value">${passList.length}</div></div>
      <div class="dash-stat"><div class="icon" style="background:rgba(16,185,129,.1);color:var(--success)"><i class="fas fa-check-double"></i></div><h4>Boarded</h4><div class="value">${verified}</div></div>
      <div class="dash-stat"><div class="icon" style="background:rgba(245,158,11,.1);color:var(--warning)"><i class="fas fa-clock"></i></div><h4>Pending</h4><div class="value">${pending}</div></div>
      <div class="dash-stat"><div class="icon" style="background:rgba(239,68,68,.1);color:var(--danger)"><i class="fas fa-ban"></i></div><h4>Revoked</h4><div class="value">${revoked}</div></div>
    </div>
    <div style="display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap">
      <input type="text" id="passSearch" placeholder="Search by name, email, or pass ID..." style="flex:1;min-width:200px;padding:.5rem .75rem;border:1px solid #E2E8F0;border-radius:8px" onkeyup="filterAdminPasses()">
      <select id="passStatusFilter" style="padding:.5rem;border:1px solid #E2E8F0;border-radius:8px" onchange="filterAdminPasses()">
        <option value="all">All Status</option>
        <option value="not_verified">Pending</option>
        <option value="verified">Boarded</option>
        <option value="revoked">Revoked</option>
      </select>
    </div>
    <div id="passesTableWrap">${renderAdminPassesTable(passList)}</div>
  `;
}

function renderAdminPassesTable(passes) {
  if (!passes.length) return '<p style="color:var(--text-light)">No digital passes generated yet.</p>';
  return `<div class="table-wrap"><table>
    <thead><tr><th>Pass ID</th><th>User</th><th>Trip</th><th>Date</th><th>Payment</th><th>Boarding</th><th>Actions</th></tr></thead>
    <tbody>${passes.map(p => {
      const statusColor = p.boarding_status === 'verified' ? 'var(--success)' : p.boarding_status === 'revoked' ? 'var(--danger)' : 'var(--warning)';
      const statusLabel = p.boarding_status === 'verified' ? '✅ Boarded' : p.boarding_status === 'revoked' ? '❌ Revoked' : '⏳ Pending';
      const payLabel = p.payment_status === 'paid' ? '<span style="color:var(--success)">Paid</span>' : '<span style="color:var(--danger)">Unpaid</span>';
      return `<tr>
        <td><code style="font-size:.8rem;background:#F1F5F9;padding:2px 6px;border-radius:4px">${escapeHtml(p.pass_id)}</code></td>
        <td><strong>${escapeHtml(p.user_name)}</strong><br><small style="color:var(--text-light)">${escapeHtml(p.user_email)}</small></td>
        <td>${escapeHtml(p.outing_title)}<br><small style="color:var(--text-light)">${escapeHtml(p.outing_location)}</small></td>
        <td style="font-size:.85rem">${new Date(p.outing_date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</td>
        <td>${payLabel}</td>
        <td><span style="color:${statusColor};font-weight:600;font-size:.85rem">${statusLabel}</span></td>
        <td style="white-space:nowrap">
          <button onclick="showDigitalPass('${escapeHtml(p.pass_id)}')" style="background:none;border:none;color:var(--primary);cursor:pointer;padding:4px;font-size:.85rem" title="View"><i class="fas fa-eye"></i></button>
          ${p.boarding_status === 'not_verified' ? `
            <button onclick="adminManualVerify('${escapeHtml(p.pass_id)}')" style="background:none;border:none;color:var(--success);cursor:pointer;padding:4px;font-size:.85rem" title="Manual Verify"><i class="fas fa-check-circle"></i></button>
            <button onclick="adminRevokePass('${escapeHtml(p.pass_id)}')" style="background:none;border:none;color:var(--danger);cursor:pointer;padding:4px;font-size:.85rem" title="Revoke"><i class="fas fa-ban"></i></button>
          ` : ''}
          <button onclick="viewBoardingLogs('${escapeHtml(p.pass_id)}')" style="background:none;border:none;color:#64748B;cursor:pointer;padding:4px;font-size:.85rem" title="Logs"><i class="fas fa-history"></i></button>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

async function filterAdminPasses() {
  const search = document.getElementById('passSearch').value.trim();
  const status = document.getElementById('passStatusFilter').value;
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (status !== 'all') params.set('boarding_status', status);
  const passes = await api('/admin/digital-passes?' + params.toString());
  document.getElementById('passesTableWrap').innerHTML = renderAdminPassesTable(Array.isArray(passes) ? passes : []);
}

async function adminManualVerify(passId) {
  if (!confirm('Manually verify boarding for pass ' + passId + '?')) return;
  const data = await api('/admin/digital-passes/manual-verify', { method: 'POST', body: { pass_id: passId } });
  if (data.success) { toast('Pass verified!', 'success'); renderAdminDigitalPasses(); }
  else toast(data.message || 'Failed', 'error');
}

async function adminRevokePass(passId) {
  if (!confirm('Revoke pass ' + passId + '? This cannot be undone.')) return;
  const data = await api('/admin/digital-passes/revoke', { method: 'POST', body: { pass_id: passId } });
  if (data.success) { toast('Pass revoked', 'success'); renderAdminDigitalPasses(); }
  else toast(data.message || 'Failed', 'error');
}

async function viewBoardingLogs(passId) {
  const logs = await api('/admin/boarding-logs?pass_id=' + passId);
  const logList = Array.isArray(logs) ? logs : [];
  openModal(`
    <button class="close" onclick="closeModal()">&times;</button>
    <h2><i class="fas fa-history" style="color:var(--primary)"></i> Boarding Logs — ${escapeHtml(passId)}</h2>
    ${logList.length ? `<div class="table-wrap" style="margin-top:1rem"><table>
      <thead><tr><th>Time</th><th>Result</th><th>Scanned By</th><th>Device</th></tr></thead>
      <tbody>${logList.map(l => `<tr>
        <td style="font-size:.8rem">${new Date(l.scan_time).toLocaleString('en-IN')}</td>
        <td><span style="color:${l.verification_result==='verified'?'var(--success)':l.verification_result==='duplicate_entry'?'var(--warning)':'var(--danger)'};font-weight:600;font-size:.85rem">${escapeHtml(l.verification_result)}</span></td>
        <td>${escapeHtml(l.scanned_by_name || 'Unknown')}</td>
        <td style="font-size:.8rem">${escapeHtml(l.device_info || '-')}</td>
      </tr>`).join('')}</tbody>
    </table></div>` : '<p style="color:var(--text-light);margin-top:1rem">No boarding logs yet.</p>'}

}

// ─── ADMIN: QR BOARDING SCANNER ─────────────────────────────────
function renderAdminBoardingScanner() {
  const container = document.getElementById('adminContent');
  container.innerHTML = `
    <h2 style="margin-bottom:1rem"><i class="fas fa-camera" style="color:var(--primary)"></i> QR Boarding Scanner</h2>
    <p style="color:var(--text-light);margin-bottom:1.5rem">Scan a traveler's QR code or enter Pass ID to verify boarding.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;max-width:800px">
      <div style="background:#fff;padding:1.5rem;border-radius:16px;box-shadow:var(--shadow)">
        <h3 style="margin-bottom:1rem;font-size:1rem"><i class="fas fa-keyboard"></i> Manual Entry</h3>
        <div class="form-group"><label>Pass ID</label><input type="text" id="scanPassId" placeholder="e.g. VO-2026-TRIP-A1B2C3" style="font-family:monospace;letter-spacing:1px"></div>
        <button class="btn btn-primary btn-block" onclick="manualScanVerify()"><i class="fas fa-search"></i> Verify Pass</button>
      </div>
      <div style="background:#fff;padding:1.5rem;border-radius:16px;box-shadow:var(--shadow)">
        <h3 style="margin-bottom:1rem;font-size:1rem"><i class="fas fa-qrcode"></i> QR Code Input</h3>
        <div class="form-group"><label>Paste QR Data (JSON)</label><textarea id="scanQrData" rows="4" placeholder='{"pass_id":"...","token":"...","type":"vibes_boarding_pass"}' style="font-family:monospace;font-size:.8rem"></textarea></div>
        <button class="btn btn-block" style="background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff" onclick="qrScanVerify()"><i class="fas fa-camera"></i> Verify QR</button>
      </div>
    </div>
    <div id="scanResult" style="margin-top:1.5rem"></div>
    <div style="margin-top:2rem">
      <h3 style="margin-bottom:1rem"><i class="fas fa-history"></i> Recent Boarding Logs</h3>
      <div id="recentBoardingLogs"><div class="loading-spinner"></div></div>
    </div>
  `;
  loadRecentBoardingLogs();
}

async function loadRecentBoardingLogs() {
  const logs = await api('/admin/boarding-logs');
  const logList = Array.isArray(logs) ? logs : [];
  document.getElementById('recentBoardingLogs').innerHTML = logList.length ?
    `<div class="table-wrap"><table>
      <thead><tr><th>Pass ID</th><th>Time</th><th>Result</th><th>Scanned By</th></tr></thead>
      <tbody>${logList.slice(0,20).map(l => `<tr>
        <td><code style="font-size:.8rem">${escapeHtml(l.pass_id)}</code></td>
        <td style="font-size:.8rem">${new Date(l.scan_time).toLocaleString('en-IN')}</td>
        <td><span style="color:${l.verification_result==='verified'?'var(--success)':l.verification_result==='duplicate_entry'?'var(--warning)':'var(--danger)'};font-weight:600">${escapeHtml(l.verification_result)}</span></td>
        <td>${escapeHtml(l.scanned_by_name || 'Unknown')}</td>
      </tr>`).join('')}</tbody>
    </table></div>` : '<p style="color:var(--text-light)">No boarding logs yet.</p>';
}

async function manualScanVerify() {
  const passId = document.getElementById('scanPassId').value.trim();
  if (!passId) { toast('Enter a Pass ID', 'error'); return; }
  // Fetch the pass first to get verification token
  const pass = await api('/digital-passes/' + passId);
  if (!pass || pass.success === false) {
    showScanResult({ success: false, status: 'invalid', message: 'Pass not found', icon: '❌' });
    return;
  }
  const result = await api('/digital-passes/verify-boarding', { method: 'POST', body: { pass_id: passId, verification_token: pass.verification_token, device_info: 'Admin Panel Manual Entry' } });
  showScanResult(result);
  loadRecentBoardingLogs();
}

async function qrScanVerify() {
  const qrData = document.getElementById('scanQrData').value.trim();
  if (!qrData) { toast('Paste QR data', 'error'); return; }
  const result = await api('/digital-passes/scan', { method: 'POST', body: { qr_data: qrData, device_info: 'Admin Panel QR Input' } });
  showScanResult(result);
  loadRecentBoardingLogs();
}

function showScanResult(result) {
  const bgColor = result.success ? 'linear-gradient(135deg,#10B981,#059669)' : result.status === 'duplicate' ? 'linear-gradient(135deg,#F59E0B,#D97706)' : 'linear-gradient(135deg,#EF4444,#DC2626)';
  document.getElementById('scanResult').innerHTML = `
    <div style="background:${bgColor};color:#fff;padding:2rem;border-radius:16px;text-align:center;max-width:500px;animation:fadeIn .3s ease">
      <div style="font-size:3rem;margin-bottom:.5rem">${result.icon || '❓'}</div>
      <h2 style="margin:0 0 .5rem">${escapeHtml(result.message || 'Unknown result')}</h2>
      ${result.user ? `<div style="background:rgba(255,255,255,.15);padding:1rem;border-radius:12px;margin-top:1rem;text-align:left">
        <p style="margin:4px 0"><strong>👤 Name:</strong> ${escapeHtml(result.user.name)}</p>
        ${result.user.email ? `<p style="margin:4px 0"><strong>📧 Email:</strong> ${escapeHtml(result.user.email)}</p>` : ''}
        ${result.user.phone ? `<p style="margin:4px 0"><strong>📱 Phone:</strong> ${escapeHtml(result.user.phone)}</p>` : ''}
      </div>` : ''}
      ${result.trip ? `<div style="background:rgba(255,255,255,.15);padding:1rem;border-radius:12px;margin-top:.75rem;text-align:left">
        <p style="margin:4px 0"><strong>🗓 Trip:</strong> ${escapeHtml(result.trip.title)}</p>
        <p style="margin:4px 0"><strong>📍 Location:</strong> ${escapeHtml(result.trip.location)}</p>
        <p style="margin:4px 0"><strong>📅 Date:</strong> ${escapeHtml(result.trip.date)}</p>
      </div>` : ''}
      ${result.booking ? `<div style="background:rgba(255,255,255,.15);padding:.75rem;border-radius:12px;margin-top:.75rem;text-align:left;font-size:.9rem">
        <p style="margin:4px 0"><strong>👥 Participants:</strong> ${result.booking.participants}</p>
        <p style="margin:4px 0"><strong>💰 Amount:</strong> ₹${result.booking.total_amount}</p>
      </div>` : ''}
      ${result.boarding_time ? `<p style="margin-top:.5rem;font-size:.85rem;opacity:.8">Boarded at: ${new Date(result.boarding_time).toLocaleString('en-IN')}</p>` : ''}
    </div>
  `;
}

async function renderAdminExpectations() {
  const container = document.getElementById('adminContent');
  container.innerHTML = '<div class="loading-spinner"></div>';

  const [expectations, summary] = await Promise.all([
    api('/admin/expectations'),
    api('/admin/expectations/summary')
  ]);

  const expectationsList = Array.isArray(expectations) ? expectations : [];
  const summaryList = Array.isArray(summary) ? summary : [];

  // Extract all tags for analysis
  const tagCounts = {};
  expectationsList.forEach(e => {
    if (e.tags) {
      e.tags.split(',').filter(t=>t.trim()).forEach(tag => {
        tagCounts[tag.trim()] = (tagCounts[tag.trim()] || 0) + 1;
      });
    }
  });
  const sortedTags = Object.entries(tagCounts).sort((a,b) => b[1] - a[1]);

  container.innerHTML = `
    <h2 style="margin-bottom:1.5rem">✨ Customer Trip Expectations</h2>
    <p style="color:var(--text-light);margin-bottom:1.5rem">View what customers are expecting from upcoming trips for better planning and satisfaction.</p>

    <!-- Stats Cards -->
    <div class="dash-stats" style="margin-bottom:2rem">
      <div class="dash-stat"><div class="icon" style="background:rgba(108,60,225,.1);color:var(--primary)"><i class="fas fa-magic"></i></div><h4>Total Submissions</h4><div class="value">${expectationsList.length}</div></div>
      <div class="dash-stat"><div class="icon" style="background:rgba(6,214,160,.1);color:var(--accent)"><i class="fas fa-calendar-alt"></i></div><h4>Outings Covered</h4><div class="value">${summaryList.filter(s => parseInt(s.expectation_count) > 0).length}</div></div>
    </div>

    <!-- Popular Tags -->
    ${sortedTags.length ? `
      <div style="background:#fff;padding:1.25rem;border-radius:12px;box-shadow:var(--shadow);margin-bottom:1.5rem">
        <h4 style="margin-bottom:.75rem;font-size:.95rem"><i class="fas fa-tags" style="color:var(--primary)"></i> Popular Expectations Categories</h4>
        <div style="display:flex;flex-wrap:wrap;gap:.5rem">
          ${sortedTags.map(([tag, count]) => `<span style="background:rgba(108,60,225,.08);color:var(--primary);padding:.35rem .9rem;border-radius:999px;font-size:.8rem;font-weight:500">${escapeHtml(tag)} <strong>(${count})</strong></span>`).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Outing Summary -->
    ${summaryList.length ? `
      <div style="background:#fff;padding:1.25rem;border-radius:12px;box-shadow:var(--shadow);margin-bottom:1.5rem">
        <h4 style="margin-bottom:.75rem;font-size:.95rem"><i class="fas fa-chart-bar" style="color:var(--secondary)"></i> Expectations by Outing</h4>
        <div style="display:grid;gap:.5rem">
          ${summaryList.map(s => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;background:#F8FAFC;border-radius:8px;cursor:pointer" onclick="filterAdminExpectations(${s.outing_id})">
              <div>
                <span style="font-weight:500;font-size:.9rem">${escapeHtml(s.title)}</span>

async function filterAdminExpectations(outingId) {
  const container = document.getElementById('adminContent');

  const expectations = await api('/admin/expectations?outing_id=' + outingId);
  const expectationsList = Array.isArray(expectations) ? expectations : [];

  const tagCounts = {};
  expectationsList.forEach(e => {
    if (e.tags) {
      e.tags.split(',').filter(t=>t.trim()).forEach(tag => {
        tagCounts[tag.trim()] = (tagCounts[tag.trim()] || 0) + 1;
      });
    }
  });
  const sortedTags = Object.entries(tagCounts).sort((a,b) => b[1] - a[1]);
  const outingTitle = expectationsList.length ? expectationsList[0].outing_title : 'Outing';

  container.innerHTML = `
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap">

      <span style="background:rgba(108,60,225,.1);color:var(--primary);padding:.3rem .8rem;border-radius:999px;font-size:.85rem;font-weight:600">${expectationsList.length} submission${expectationsList.length !== 1 ? 's' : ''}</span>
    </div>

    ${sortedTags.length ? `
      <div style="background:linear-gradient(135deg,#EEF2FF,#F0F9FF);padding:1rem 1.25rem;border-radius:12px;margin-bottom:1.5rem;border:1px solid #C7D2FE">
        <h4 style="margin-bottom:.5rem;font-size:.9rem;color:var(--primary)"><i class="fas fa-lightbulb"></i> Key Themes for This Trip</h4>
        <div style="display:flex;flex-wrap:wrap;gap:.5rem">
          ${sortedTags.map(([tag, count]) => `<span style="background:rgba(108,60,225,.12);color:var(--primary);padding:.35rem .9rem;border-radius:999px;font-size:.8rem;font-weight:600">${escapeHtml(tag)} (${count})</span>`).join('')}
        </div>
      </div>

    ${expectationsList.length ? `

        ${expectationsList.map(e => {
          const tags = e.tags ? e.tags.split(',').filter(t=>t.trim()) : [];
          return `
            <div style="background:#fff;padding:1.25rem;border-radius:12px;box-shadow:var(--shadow);border-left:4px solid var(--accent)">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
                <div style="font-weight:600;font-size:.9rem"><i class="fas fa-user-circle" style="color:var(--primary)"></i> ${escapeHtml(e.user_name)}</div>
                <span style="font-size:.75rem;color:var(--text-light)">${new Date(e.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
              </div>
              <div style="padding:.75rem;background:#F8FAFC;border-radius:8px;font-size:.9rem;line-height:1.6;white-space:pre-wrap">${escapeHtml(e.expectations)}</div>
              ${tags.length ? `<div style="margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.4rem">${tags.map(t => `<span style="background:rgba(6,214,160,.1);color:var(--accent);padding:.2rem .6rem;border-radius:999px;font-size:.7rem;font-weight:500">${escapeHtml(t.trim())}</span>`).join('')}</div>` : ''}

// ─── HERO SLIDER + IMMERSIVE EFFECTS ────────────────────────────

let heroSliderInterval = null;
let heroSliderPaused = false;
let heroCurrentSlide = 0;
const HERO_SLIDE_COUNT = 5;
const HERO_SLIDE_DURATION = 5000; // 5 seconds

function startHeroSlider() {
  if (heroSliderInterval) clearInterval(heroSliderInterval);
  heroSliderInterval = setInterval(() => {
    if (!heroSliderPaused) nextSlide();
  }, HERO_SLIDE_DURATION);
}

function nextSlide() {
  goToSlide((heroCurrentSlide + 1) % HERO_SLIDE_COUNT);
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  const caption = document.getElementById('heroCaption');
  if (!slides.length) return;

  // Remove active from current
  slides[heroCurrentSlide]?.classList.remove('active');
  slides[heroCurrentSlide]?.classList.add('prev');
  dots[heroCurrentSlide]?.classList.remove('active');

  // Clean prev class after transition
  const prevIdx = heroCurrentSlide;
  setTimeout(() => slides[prevIdx]?.classList.remove('prev'), 1800);

  heroCurrentSlide = index;

  // Reset Ken Burns by re-triggering animation
  const slide = slides[heroCurrentSlide];
  if (slide) {
    // Remove all kb classes and re-add to restart animation
    const kbClass = 'kb-' + (heroCurrentSlide + 1);
    slide.classList.remove(kbClass);
    void slide.offsetWidth; // force reflow
    slide.classList.add(kbClass);
    slide.classList.add('active');
  }
  dots[heroCurrentSlide]?.classList.add('active');

  // Update caption
  if (caption && slide) {
    const text = slide.getAttribute('data-caption') || '';
    caption.innerHTML = `<span>${text}</span>`;
  }

  // Reset timer
  startHeroSlider();
}

function toggleSlider() {
  heroSliderPaused = !heroSliderPaused;
  const btn = document.getElementById('heroPlayPause');
  if (btn) {
    btn.innerHTML = heroSliderPaused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
    btn.title = heroSliderPaused ? 'Resume slideshow' : 'Pause slideshow';
  }
}

async function selectVibe(category) {
  // If same vibe clicked again, deselect (show all)
  if (selectedVibe === category) {
    selectedVibe = null;
  } else {
    selectedVibe = category;
  }
  // Update active state on vibe cards
  document.querySelectorAll('.cat-card').forEach(card => {
    const cardCategory = card.getAttribute('data-category');
    if (cardCategory === selectedVibe) {
      card.classList.add('cat-card-active');
    } else {
      card.classList.remove('cat-card-active');
    }
  });
  // Navigate to outings page with the selected vibe
  if (currentPage !== 'outings') {
    navigate('outings');
    // Wait for page render, then apply vibe filter
    setTimeout(() => applyVibeFilter(), 350);
  } else {
    applyVibeFilter();
  }
}

async function applyVibeFilter() {
  const grid = document.getElementById('outingsGrid');
  if (!grid) return;
  // Fade out transition
  grid.style.opacity = '0';
  grid.style.transform = 'translateY(10px)';
  let apiFailed = false;
  let errorMsg = '';
  try {
    const url = selectedVibe ? '/outings?category=' + encodeURIComponent(selectedVibe) : '/outings';
    const data = await api(url, { showToast: false });
    if (!Array.isArray(data) && data && data.success === false) {
      apiFailed = true;
      errorMsg = data.message || 'Failed to load outings.';
    }
    outings = Array.isArray(data) ? data : [];
  } catch (e) {
    console.error('Failed to filter outings:', e);
    apiFailed = true;
    errorMsg = 'Failed to load outings. Please try again.';
  }
  // Update the vibe filter buttons on outings page
  document.querySelectorAll('.vibe-filter-btn').forEach(btn => {
    if (btn.getAttribute('data-category') === selectedVibe) {
      btn.classList.add('vibe-btn-active');
    } else {
      btn.classList.remove('vibe-btn-active');
    }
  });
  // Reset other filters
  const sf = document.getElementById('searchFilter');
  const lf = document.getElementById('locationFilter');
  const bf = document.getElementById('budgetFilter');
  if (sf) sf.value = '';
  if (lf) lf.value = '';
  if (bf) bf.value = '';
  // Update location dropdown options
  if (lf) {
    lf.innerHTML = '<option value="">All Locations</option>' + [...new Set(outings.map(o => o.location))].map(l => `<option>${l}</option>`).join('');
  }
  // Re-render grid with transition
  setTimeout(() => {
    if (apiFailed) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem">
        <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--warning);margin-bottom:1rem"></i>
        <p style="color:var(--text-light);margin-bottom:1rem">${errorMsg}</p>
        <button class="btn btn-primary btn-sm" onclick="applyVibeFilter()"><i class="fas fa-redo"></i> Retry</button>
      </div>`;
    } else {
      grid.innerHTML = outings.length ? outings.map(o => outingCard(o)).join('') : '<p style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:3rem">No outings found for this vibe. Try a different one!</p>';
    }
    grid.style.opacity = '1';
    grid.style.transform = 'translateY(0)';
  }, 200);
}

// Generate sparkle particles
function generateParticles() {
  const container = document.getElementById('heroParticles');
  if (!container) return;
  container.innerHTML = '';
  const count = window.innerWidth < 768 ? 18 : 40;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (Math.random() > .7 ? ' gold' : '');
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
    p.style.animationDelay = (Math.random() * 5) + 's';
    p.style.animationDuration = (Math.random() * 3 + 2) + 's';
    container.appendChild(p);
  }
}

// Cursor-based parallax shift
let heroParallaxHandler = null;
function initParallax() {
  const hero = document.getElementById('heroSection');
  if (!hero || window.innerWidth < 768) return;
  heroParallaxHandler = (e) => {
    const rect = hero.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    const content = document.getElementById('heroContent');
    const ambient = hero.querySelector('.hero-ambient');
    if (content) content.style.transform = `translate(${x * 12}px, ${y * 10}px)`;
    if (ambient) ambient.style.transform = `translate(${x * -8}px, ${y * -6}px)`;
  };
  hero.addEventListener('mousemove', heroParallaxHandler);
  hero.addEventListener('mouseleave', () => {
    const content = document.getElementById('heroContent');
    const ambient = hero.querySelector('.hero-ambient');
    [content, ambient].forEach(el => {
      if (el) { el.style.transition = 'transform .6s ease-out'; el.style.transform = 'translate(0,0)'; setTimeout(() => { el.style.transition = 'transform .15s ease-out'; }, 600); }
    });
  });
}

// Ripple effect on glass buttons
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn-glass, .hero-search-btn');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple-circle';
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  ripple.style.animation = 'rippleEffect .6s ease-out forwards';
  btn.style.position = btn.style.position || 'relative';
  btn.style.overflow = 'hidden';
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});

// Preload slider images for smooth transitions
function preloadSliderImages() {
  const slides = document.querySelectorAll('.hero-slide');
  slides.forEach(slide => {
    const bg = slide.style.backgroundImage;
    const url = bg.replace(/url\(['"]?/, '').replace(/['"]?\)/, '');
    if (url) { const img = new Image(); img.src = url; }
  });
}

// Init hero effects after page renders
function initHeroEffects() {
  setTimeout(() => {
    generateParticles();
    initParallax();
    startHeroSlider();
    preloadSliderImages();
  }, 100);
}

// Cleanup slider on navigation away
function cleanupHeroSlider() {
  if (heroSliderInterval) { clearInterval(heroSliderInterval); heroSliderInterval = null; }
  if (heroParallaxHandler) {
    const hero = document.getElementById('heroSection');
    if (hero) hero.removeEventListener('mousemove', heroParallaxHandler);
    heroParallaxHandler = null;
  }
}

      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-paper-plane"></i> Submit Ticket</button>
    </form>
  `);
  document.getElementById('supportTicketForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
    try {
      const res = await api('/support-tickets', { method: 'POST', body: {
        category,
        subject: document.getElementById('ticketSubject').value.trim(),
        priority: document.getElementById('ticketPriority').value,
        message: document.getElementById('ticketMessage').value.trim()
      }});
      if (res.success) {
        toast('Ticket #' + res.ticketId + ' submitted! We will respond within 24 hours.', 'success');
        closeModal();
      } else {
        toast(res.message || 'Failed to submit ticket', 'error');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Ticket';
      }
    } catch (err) {
      toast('Error submitting ticket. Please try again.', 'error');
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Ticket';

// ─── SUBMIT PARTNER APPLICATION ─────────────────────────────────
let partnerSubmitting = false;
async function submitPartnerApplication(e) {
  e.preventDefault();
  if (partnerSubmitting) return;

  const btn = document.getElementById('partnerSubmitBtn');
  const form = document.getElementById('partnerApplicationForm');
  const businessName = document.getElementById('partnerBizName').value.trim();
  const contactName = document.getElementById('partnerContactName').value.trim();
  const email = document.getElementById('partnerEmail').value.trim();
  const phone = document.getElementById('partnerPhone').value.trim().replace(/\D/g, '');
  const propertyType = document.getElementById('partnerPropertyType').value;
  const location = document.getElementById('partnerLocation').value.trim();
  const description = document.getElementById('partnerDescription').value.trim();

  if (!businessName || !contactName || !email || !phone || !propertyType || !location) {
    toast('Please fill all required fields.', 'error');
    return;
  }
  if (!/^[0-9]{10,15}$/.test(phone)) {
    toast('Please enter a valid 10-15 digit phone number.', 'error');
    return;
  }

  partnerSubmitting = true;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

  const data = await api('/partners/apply', {
    method: 'POST',
    body: { businessName, contactName, email, phone, propertyType, location, description }
  });

  partnerSubmitting = false;
  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Application';

  if (data.success) {
    toast('Partner application submitted successfully! We will contact you within 48 hours.', 'success');
    form.reset();
  } else {
    toast(data.message || 'Something went wrong. Please try again.', 'error');
  }
}

// ─── WISHLIST ───────────────────────────────────────────────────
let wishlistItems = JSON.parse(sessionStorage.getItem('vibes_wishlist') || '[]');

function toggleWishlist(outingId) {
  if (!currentUser) { showLogin(); return; }
  const idx = wishlistItems.indexOf(outingId);
  if (idx > -1) { wishlistItems.splice(idx, 1); toast('Removed from wishlist'); }
  else { wishlistItems.push(outingId); toast('Added to wishlist! ❤️', 'success'); }
  sessionStorage.setItem('vibes_wishlist', JSON.stringify(wishlistItems));
  // Update heart icons on current page
  document.querySelectorAll('.wishlist-heart').forEach(btn => {
    const id = parseInt(btn.dataset.outingId);
    btn.classList.toggle('active', wishlistItems.includes(id));
    btn.innerHTML = wishlistItems.includes(id) ? '<i class="fas fa-heart" style="color:var(--danger)"></i>' : '<i class="far fa-heart"></i>';
  });
}

// ─── NOTIFICATIONS ──────────────────────────────────────────────
let notifications = [];
let notifPanelOpen = false;

async function fetchNotifications() {
  if (!currentUser || !authToken) return;
  // Background poll: a 401 here must not log the user out or redirect them.
  const data = await api('/notifications/' + currentUser.id, { showToast: false, background: true });
  if (data && data.sessionExpired) return;
  notifications = Array.isArray(data) ? data : [];
  updateNotifBadge();
}

function updateNotifBadge() {
  const badge = document.getElementById('notifBadge');
  if (!badge) return;
  const unread = notifications.filter(n => !n.read).length;
  badge.textContent = unread;
  badge.style.display = unread > 0 ? 'flex' : 'none';
}

function toggleNotifPanel() {
  const panel = document.getElementById('notifPanel');
  if (!panel) return;
  notifPanelOpen = !notifPanelOpen;
  panel.classList.toggle('show', notifPanelOpen);
  if (notifPanelOpen) renderNotifPanel();
}

function renderNotifPanel() {
  const panel = document.getElementById('notifPanel');
  if (!panel) return;
  const list = notifications.length ? notifications.slice(0, 8).map(n => `
    <div class="notif-item ${n.read ? '' : 'unread'}" onclick="markNotifRead(${n.id})">
      <div class="notif-icon" style="background:${n.type==='booking'?'rgba(108,60,225,.1)':n.type==='payment'?'rgba(16,185,129,.1)':'rgba(249,115,22,.1)'};color:${n.type==='booking'?'var(--primary)':n.type==='payment'?'var(--success)':'var(--secondary)'}">
        <i class="fas fa-${n.type==='booking'?'ticket-alt':n.type==='payment'?'rupee-sign':'bell'}"></i>
      </div>
      <div class="notif-body">
        <h5>${escapeHtml(n.title)}</h5>
        <p>${escapeHtml(n.message)}</p>
        <span class="notif-time">${timeAgo(n.created_at)}</span>
      </div>
    </div>
  `).join('') : '<div style="padding:2rem;text-align:center;color:var(--text-light)"><i class="fas fa-bell-slash" style="font-size:1.5rem;margin-bottom:.5rem;display:block"></i>No notifications yet</div>';

  panel.querySelector('.notif-list').innerHTML = list;
}

async function markNotifRead(id) {
  await api('/notifications/' + id + '/read', { method: 'PUT' });
  const n = notifications.find(n => n.id === id);
  if (n) n.read = true;
  updateNotifBadge();
  renderNotifPanel();
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

  if (!currentUser) { showLogin(); return; }
  await fetchNotifications();
  app.innerHTML = `
