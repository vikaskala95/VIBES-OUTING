<style>
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes floatSlow{0%,100%{transform:translateY(0) translateX(0)}25%{transform:translateY(-8px) translateX(4px)}50%{transform:translateY(-14px) translateX(0)}75%{transform:translateY(-6px) translateX(-4px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
@keyframes driftClouds{0%{transform:translateX(-100%)}100%{transform:translateX(100vw)}}
@keyframes driftMist{0%{opacity:.3;transform:translateX(-50%) scaleX(1)}50%{opacity:.6;transform:translateX(0%) scaleX(1.2)}100%{opacity:.3;transform:translateX(50%) scaleX(1)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
@keyframes rippleEffect{0%{transform:scale(0);opacity:.6}100%{transform:scale(4);opacity:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(139,92,246,.3)}50%{box-shadow:0 0 40px rgba(139,92,246,.6),0 0 80px rgba(139,92,246,.2)}}
@keyframes kenBurns1{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.15) translate(-2%,-1%)}}
@keyframes kenBurns2{0%{transform:scale(1.05) translate(1%,0)}100%{transform:scale(1.18) translate(-1%,-2%)}}
@keyframes kenBurns3{0%{transform:scale(1) translate(-1%,1%)}100%{transform:scale(1.14) translate(2%,-1%)}}
@keyframes kenBurns4{0%{transform:scale(1.02) translate(0,1%)}100%{transform:scale(1.16) translate(-2%,0)}}
@keyframes kenBurns5{0%{transform:scale(1) translate(1%,-1%)}100%{transform:scale(1.13) translate(0,2%)}}
@keyframes slideBlurIn{0%{filter:blur(12px);opacity:0}100%{filter:blur(0);opacity:1}}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes tagFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
:root {
  --primary: #6C3CE1;
  --primary-light: #8B5CF6;
  --primary-dark: #5521C5;
  --secondary: #F97316;
  --accent: #06D6A0;
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text: #1E293B;
  --text-light: #64748B;
  --border: #E2E8F0;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 32px rgba(108,60,225,.15);
  --shadow-xl: 0 16px 48px rgba(108,60,225,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;width:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;width:100%;min-height:100vh;min-height:100dvh}
img,video,svg{max-width:100%;height:auto;display:block}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
#app{width:100%;max-width:100vw;overflow-x:hidden}

/* NAV — Glassmorphism */
.nav{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(226,232,240,.6);padding:0 2rem;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;transition:box-shadow .3s}
.nav:hover{box-shadow:0 4px 20px rgba(0,0,0,.06)}
.nav-logo{font-weight:800;font-size:1.4rem;color:var(--primary);display:flex;align-items:center;gap:.75rem;transition:transform .2s}
.nav-logo:hover{transform:scale(1.02)}
.nav-logo i{font-size:1.2rem;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(108,60,225,.25)}
.nav-links{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;max-width:70%}
.nav-links a,.nav-links button{padding:.5rem 1rem;border-radius:999px;font-size:.875rem;font-weight:500;border:none;background:none;color:var(--text-light);transition:all .3s ease}
.nav-links a:hover,.nav-links button:hover{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(108,60,225,.2)}
.nav-links .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 12px rgba(108,60,225,.2)}
.nav-links .user-badge{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:.45rem 1rem;border-radius:999px;font-size:.8rem;font-weight:600;box-shadow:0 2px 8px rgba(108,60,225,.2)}

/* ─── VIBES OFFER: Sticky announcement bar ───────────────────── */
.offer-bar{position:sticky;top:0;z-index:120;background:linear-gradient(90deg,#6C3CE1 0%,#8B5CF6 40%,#F97316 100%);color:#fff;display:flex;align-items:center;justify-content:center;gap:.85rem;padding:.55rem 2.75rem .55rem 1rem;font-size:.9rem;font-weight:600;text-align:center;box-shadow:0 2px 10px rgba(108,60,225,.25);background-size:200% 100%;animation:offerShimmer 6s linear infinite}
@keyframes offerShimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.offer-bar .offer-gift{font-size:1.15rem;animation:offerWiggle 2.5s ease-in-out infinite;display:inline-block}
@keyframes offerWiggle{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-12deg) scale(1.15)}20%{transform:rotate(12deg) scale(1.15)}30%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}50%{transform:rotate(0)}}
.offer-bar .offer-text{line-height:1.3}
.offer-bar .offer-text strong{font-weight:800}
.offer-bar .offer-cta{background:#fff;color:var(--primary);padding:.3rem .85rem;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;border:none;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.offer-bar .offer-cta:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.offer-bar .offer-close{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;width:24px;height:24px;border-radius:50%;font-size:.9rem;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s}
.offer-bar .offer-close:hover{background:rgba(255,255,255,.35)}
@media(max-width:640px){.offer-bar{font-size:.78rem;gap:.5rem;padding:.5rem 2.25rem .5rem .65rem;flex-wrap:wrap}.offer-bar .offer-cta{font-size:.72rem;padding:.28rem .7rem}}

/* ─── VIBES OFFER: Hero promo pill ───────────────────────────── */
.hero-offer-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);color:#fff;padding:.45rem 1rem;border-radius:999px;font-size:.85rem;font-weight:700;margin-bottom:1.1rem;box-shadow:0 4px 18px rgba(0,0,0,.18);animation:fadeInDown .8s ease}
.hero-offer-pill .pill-amt{background:#fff;color:var(--primary);padding:.1rem .5rem;border-radius:999px;font-weight:800}

/* ─── VIBES OFFER: Welcome bonus section ─────────────────────── */
.welcome-bonus{max-width:1100px;margin:3rem auto;padding:0 1.25rem}
.welcome-bonus-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#5521C5 0%,#6C3CE1 45%,#8B5CF6 100%);color:#fff;border-radius:24px;padding:2.5rem 2rem;display:flex;align-items:center;gap:2rem;flex-wrap:wrap;box-shadow:0 18px 48px rgba(108,60,225,.32)}
.welcome-bonus-card::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(249,115,22,.45),transparent 70%);border-radius:50%}
.welcome-bonus-icon{font-size:3.4rem;flex-shrink:0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));animation:float 3.5s ease-in-out infinite}
.welcome-bonus-body{flex:1;min-width:260px;position:relative;z-index:1}
.welcome-bonus-body h2{font-size:1.7rem;font-weight:800;margin-bottom:.6rem}
.welcome-bonus-body p{font-size:1rem;opacity:.92;max-width:560px;line-height:1.6}
.welcome-bonus-amt{display:inline-flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:1.1rem 1.4rem;position:relative;z-index:1}
.welcome-bonus-amt .amt{font-size:2.4rem;font-weight:900;line-height:1}
.welcome-bonus-amt .amt-label{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-top:.25rem}
.welcome-bonus-cta{margin-top:1.1rem;display:inline-flex;align-items:center;gap:.5rem;background:#fff;color:var(--primary);padding:.7rem 1.5rem;border-radius:999px;font-weight:800;border:none;font-size:.95rem;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:transform .2s}
.welcome-bonus-cta:hover{transform:translateY(-2px) scale(1.03)}
@media(max-width:640px){.welcome-bonus-card{padding:1.75rem 1.25rem;text-align:center;justify-content:center}.welcome-bonus-body h2{font-size:1.35rem}}

/* ─── VIBES OFFER: Trust badge + booking wallet toggle ───────── */
.reward-trust-badge{display:flex;align-items:center;gap:.5rem;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(6,214,160,.12));border:1px solid rgba(16,185,129,.35);color:#047857;padding:.6rem .9rem;border-radius:12px;font-size:.85rem;font-weight:600;margin-bottom:1rem}
.reward-trust-badge i{color:var(--success)}
.wallet-toggle-box{display:flex;align-items:center;justify-content:space-between;gap:.75rem;background:rgba(108,60,225,.06);border:1px dashed rgba(108,60,225,.35);padding:.75rem 1rem;border-radius:12px;margin-bottom:1rem}
.wallet-toggle-box .wt-info{font-size:.85rem}
.wallet-toggle-box .wt-info b{color:var(--primary)}
.wallet-switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.wallet-switch input{opacity:0;width:0;height:0}
.wallet-switch .slider{position:absolute;cursor:pointer;inset:0;background:#CBD5E1;transition:.3s;border-radius:999px}
.wallet-switch .slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.wallet-switch input:checked+.slider{background:linear-gradient(135deg,var(--primary),var(--primary-light))}
.wallet-switch input:checked+.slider:before{transform:translateX(20px)}
.auth-offer-banner{display:flex;align-items:center;gap:.6rem;background:linear-gradient(135deg,rgba(108,60,225,.08),rgba(249,115,22,.08));border:1px solid rgba(108,60,225,.25);border-radius:12px;padding:.7rem .85rem;margin-bottom:1.1rem;font-size:.82rem;font-weight:600;color:var(--primary)}
.auth-offer-banner .ao-gift{font-size:1.3rem;flex-shrink:0}

/* HERO — Premium Airbnb/Expedia Style Slider */
.hero{position:relative;color:#fff;padding:0;text-align:center;overflow:hidden;height:92vh;min-height:600px;max-height:1000px;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto;border-radius:0 0 28px 28px}

/* Slider container */
.hero-slider{position:absolute;inset:0;z-index:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s cubic-bezier(.4,0,.2,1);will-change:opacity,transform,filter;background-size:cover;background-position:center;filter:blur(0);transform-origin:center center}
.hero-slide.active{opacity:1;z-index:1}
.hero-slide.prev{opacity:0;filter:blur(8px);z-index:0}
.hero-slide.kb-1{animation:kenBurns1 12s ease-in-out forwards}
.hero-slide.kb-2{animation:kenBurns2 12s ease-in-out forwards}
.hero-slide.kb-3{animation:kenBurns3 12s ease-in-out forwards}
.hero-slide.kb-4{animation:kenBurns4 12s ease-in-out forwards}
.hero-slide.kb-5{animation:kenBurns5 12s ease-in-out forwards}

/* Overlays on top of slider */
.hero-overlay{position:absolute;inset:0;z-index:2;pointer-events:none}
.hero-overlay-gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.25) 0%,rgba(76,29,149,.35) 40%,rgba(108,60,225,.45) 70%,rgba(15,23,42,.7) 100%)}
.hero-overlay-brand{position:absolute;inset:0;background:linear-gradient(135deg,rgba(76,29,149,.2) 0%,transparent 50%,rgba(139,92,246,.15) 100%)}
.hero-overlay-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.35) 100%)}

/* Ambient motion layers */
.hero-ambient{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.hero-clouds{position:absolute;top:0;width:200%;height:140px;opacity:.2}
.cloud{position:absolute;background:radial-gradient(ellipse,rgba(255,255,255,.6) 0%,transparent 70%);border-radius:50%;filter:blur(25px)}
.cloud-1{width:500px;height:90px;top:20px;left:5%;animation:driftClouds 50s linear infinite}
.cloud-2{width:350px;height:70px;top:60px;left:35%;animation:driftClouds 65s linear infinite;animation-delay:-25s}
.cloud-3{width:420px;height:80px;top:5px;left:65%;animation:driftClouds 55s linear infinite;animation-delay:-15s}
.hero-mist{position:absolute;bottom:0;left:0;width:100%;height:25%;overflow:hidden}
.mist-layer{position:absolute;bottom:0;width:200%;height:100%;background:linear-gradient(to top,rgba(255,255,255,.1),transparent);filter:blur(35px);animation:driftMist 18s ease-in-out infinite}
.mist-layer:nth-child(2){animation-delay:-7s;opacity:.4;height:50%}

/* Particles */
.hero-particles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;background:rgba(255,255,255,.7);border-radius:50%;animation:sparkle 3s ease-in-out infinite;filter:blur(0.5px)}
.particle.gold{background:rgba(255,200,100,.8)}

/* Hero content — centered */
.hero-content{position:relative;z-index:10;padding:2rem;max-width:860px;will-change:transform;transition:transform .15s ease-out}
.hero h1{font-size:3.8rem;font-weight:800;margin-bottom:.75rem;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1);letter-spacing:-1px;line-height:1.1;text-shadow:0 4px 30px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3)}
.hero .hero-tagline{font-size:1.2rem;opacity:.88;max-width:580px;margin:0 auto 2.5rem;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .15s both;line-height:1.7;text-shadow:0 2px 12px rgba(0,0,0,.3);font-weight:400}

/* Glassmorphism search bar */
.hero-search{display:flex;align-items:center;max-width:560px;margin:0 auto 1.5rem;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:.35rem .4rem .35rem 1.5rem;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .3s both;box-shadow:0 8px 32px rgba(0,0,0,.2),inset 0 1px 1px rgba(255,255,255,.1);transition:all .3s ease}
.hero-search:hover,.hero-search:focus-within{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 40px rgba(139,92,246,.15),inset 0 1px 1px rgba(255,255,255,.15)}
.hero-search input{flex:1;background:none;border:none;color:#fff;font-size:1rem;font-weight:500;outline:none;padding:.6rem 0;letter-spacing:.2px}
.hero-search input::placeholder{color:rgba(255,255,255,.55);font-weight:400}
.hero-search-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:999px;padding:.7rem 1.5rem;font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;transition:all .3s ease;box-shadow:0 4px 16px rgba(108,60,225,.35)}
.hero-search-btn:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(108,60,225,.5)}

/* Popular destination tags */
.hero-tags{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .45s both;margin-bottom:1rem}
.hero-tag{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);color:#fff;padding:.4rem 1rem;border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;gap:.35rem;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.hero-tag:hover{background:rgba(255,255,255,.22);transform:translateY(-2px) scale(1.04);border-color:rgba(255,255,255,.35);box-shadow:0 4px 16px rgba(139,92,246,.25)}
.hero-tag i{font-size:.7rem;opacity:.7}

/* Glass CTA Buttons */
.hero-buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) .55s both;margin-top:.5rem}
.btn-glass{padding:.8rem 1.8rem;border-radius:999px;font-weight:700;font-size:.95rem;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;cursor:pointer;transition:all .3s ease-in-out;display:inline-flex;align-items:center;gap:.55rem;position:relative;overflow:hidden;box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 4px 20px rgba(0,0,0,.12);text-shadow:0 1px 4px rgba(0,0,0,.15)}
.btn-glass:hover{background:rgba(255,255,255,.2);transform:translateY(-3px) scale(1.04);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 8px 32px rgba(139,92,246,.35),0 0 40px rgba(139,92,246,.15);border-color:rgba(255,255,255,.35)}
.btn-glass:active .ripple-circle{animation:rippleEffect .6s ease-out}
.btn-glass-primary{background:rgba(255,255,255,.92);color:var(--primary);border:none;box-shadow:0 4px 20px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:none;font-weight:800}
.btn-glass-primary:hover{background:#fff;transform:translateY(-3px) scale(1.04);box-shadow:0 8px 32px rgba(108,60,225,.3),0 0 60px rgba(139,92,246,.12)}
.ripple-circle{position:absolute;width:20px;height:20px;background:rgba(255,255,255,.4);border-radius:50%;pointer-events:none;transform:scale(0);opacity:0}

/* Slider navigation dots */
.hero-dots{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:.6rem;align-items:center}
.hero-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);border:none;cursor:pointer;transition:all .4s ease;padding:0}
.hero-dot.active{background:#fff;width:28px;border-radius:999px;box-shadow:0 0 12px rgba(255,255,255,.5)}
.hero-dot:hover{background:rgba(255,255,255,.65);transform:scale(1.2)}

/* Pause / play toggle */
.hero-playpause{position:absolute;bottom:2rem;right:2rem;z-index:12;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;transition:all .3s ease}
.hero-playpause:hover{background:rgba(255,255,255,.25);transform:scale(1.1)}

/* Slide caption */
.hero-caption{position:absolute;bottom:5rem;left:2.5rem;z-index:11;text-align:left;animation:fadeInUp .6s ease;pointer-events:none}
.hero-caption span{background:rgba(0,0,0,.35);backdrop-filter:blur(8px);padding:.3rem .85rem;border-radius:999px;font-size:.78rem;font-weight:500;letter-spacing:.3px;display:inline-flex;align-items:center;gap:.4rem}

/* Parallax mouse tracking */
.hero[data-parallax]{perspective:1000px}
.btn{padding:.75rem 1.75rem;border-radius:999px;font-weight:600;font-size:.95rem;border:none;transition:all .3s ease;display:inline-flex;align-items:center;gap:.5rem}
.btn-white{background:#fff;color:var(--primary);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.btn-white:hover{transform:translateY(-3px) scale(1.03);box-shadow:var(--shadow-xl)}
.btn-outline-white{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(8px)}
.btn-outline-white:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 16px rgba(108,60,225,.25)}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-lg)}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#FB923C);color:#fff;box-shadow:0 4px 12px rgba(249,115,22,.2)}
.btn-success{background:linear-gradient(135deg,var(--success),#34D399);color:#fff}
.btn-danger{background:linear-gradient(135deg,var(--danger),#F87171);color:#fff}
.btn-sm{padding:.45rem 1rem;font-size:.8rem;border-radius:999px}
.btn-block{width:100%}

/* STATS BAR */
.stats-bar{display:flex;justify-content:center;gap:4rem;padding:2.5rem 2rem;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;width:100%}
.stat-item{text-align:center;animation:fadeInUp .6s ease both}
.stat-item:nth-child(1){animation-delay:.1s}.stat-item:nth-child(2){animation-delay:.2s}.stat-item:nth-child(3){animation-delay:.3s}.stat-item:nth-child(4){animation-delay:.4s}
.stat-item .num{font-size:2.2rem;font-weight:800;color:var(--primary);background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent}
.stat-item .label{font-size:.85rem;color:var(--text-light);margin-top:.25rem}

/* SECTION */
.section{padding:4rem 2rem;max-width:1200px;margin:0 auto;width:100%;overflow-x:hidden}
.section-title{font-size:1.8rem;font-weight:700;margin-bottom:.5rem;letter-spacing:-.3px}
.section-subtitle{color:var(--text-light);margin-bottom:2rem;line-height:1.7}

/* FILTERS */
.filters{display:flex;gap:.75rem;margin-bottom:2rem;flex-wrap:wrap;width:100%}
.filters input,.filters select{padding:.7rem 1.2rem;border:1.5px solid var(--border);border-radius:999px;font-size:.9rem;background:#fff;transition:all .3s;min-width:0;flex:1 1 180px;max-width:100%}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(108,60,225,.08)}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.75rem}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:all .35s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-xl)}
.card-img{height:220px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.card-img::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.35))}

/* Card Image Carousel */
.card-carousel{position:relative;height:240px;overflow:hidden;background-color:#e8e0f0;border-radius:var(--radius) var(--radius) 0 0}
.card-carousel-inner{display:flex;width:100%;height:100%;transition:transform .4s ease}
.card-carousel-slide{min-width:100%;width:100%;height:100%;flex-shrink:0;position:relative;overflow:hidden}
.card-carousel-slide img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transition:transform .5s ease;position:relative;z-index:2}
.card-carousel-slide .blur-placeholder{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(10px);transform:scale(1.1);transition:opacity .4s ease;z-index:1}
.card-carousel-slide .blur-placeholder.fade-out{opacity:0;pointer-events:none}
.card:hover .card-carousel-slide img{transform:scale(1.05)}
.card-carousel-slide.no-img{background:linear-gradient(135deg,#e8e0f0 0%,#d4c5e9 50%,#c9b8e8 100%);display:flex;align-items:center;justify-content:center}
.card-carousel-slide.no-img::after{content:'\\f03e';font-family:'Font Awesome 5 Free';font-weight:900;font-size:3rem;color:rgba(108,60,225,.25)}
.card-carousel .carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);backdrop-filter:blur(4px);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;z-index:3;opacity:0;transition:opacity .3s}
.card-carousel:hover .carousel-btn{opacity:1}
.card-carousel .carousel-btn:hover{background:rgba(0,0,0,.6)}
.card-carousel .carousel-prev{left:8px}
.card-carousel .carousel-next{right:8px}
.card-carousel .carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:3}
.card-carousel .carousel-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;cursor:pointer;transition:all .2s}
.card-carousel .carousel-dot.active{background:#fff;width:14px;border-radius:999px}
.card-carousel::after{content:none}
.card-img .badge{position:absolute;top:14px;left:14px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:6px 14px;border-radius:999px;font-size:.75rem;font-weight:600;z-index:2;box-shadow:0 2px 10px rgba(108,60,225,.3);white-space:nowrap;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis;line-height:1.2;letter-spacing:.2px}
.card-img .spots-left{position:absolute;bottom:14px;left:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:6px 12px;border-radius:999px;font-size:.72rem;font-weight:500;z-index:2;white-space:nowrap;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.spots-left-info{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--primary);background:rgba(108,60,225,.08);margin:8px 0 4px;letter-spacing:.2px}
.spots-left-info.sold-out{color:#EF4444;background:rgba(239,68,68,.08)}
.card-body{padding:1.5rem}
.card-body h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem;letter-spacing:-.2px;transition:color .2s}
.card-body h3:hover{color:var(--primary)}
.card-meta{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:.75rem;font-size:.85rem;color:var(--text-light)}
.card-meta span{display:flex;align-items:center;gap:.3rem}
.card-body p{font-size:.9rem;color:var(--text-light);margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.7}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.price{font-size:1.2rem;font-weight:800;color:var(--primary);background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent}
.price small{font-size:.75rem;font-weight:400;-webkit-text-fill-color:var(--text-light)}

/* TRIP TYPE BADGES */
.trip-type-badge{position:absolute;top:14px;right:14px;padding:6px 12px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.4px;z-index:2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;line-height:1.2;box-shadow:0 2px 10px rgba(0,0,0,.2);text-transform:uppercase}
.trip-type-badge.one-day{background:rgba(16,185,129,.88);color:#fff}
.trip-type-badge.two-day{background:rgba(139,92,246,.88);color:#fff}
.next-weekend-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff;padding:3px 8px;border-radius:6px;font-size:.7rem;font-weight:600;animation:tagFloat 2s ease-in-out infinite}
.trip-countdown{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--secondary);font-weight:600;margin-top:4px}
.trip-countdown i{font-size:.65rem}

/* WEEKEND DATE SELECTOR */
.weekend-date-selector{display:flex;flex-direction:column;gap:.5rem;max-height:200px;overflow-y:auto;padding:4px 0}
.weekend-date-option{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s ease;background:#fff}
.weekend-date-option:hover{border-color:var(--primary-light);background:rgba(108,60,225,.03)}
.weekend-date-option.selected{border-color:var(--primary);background:rgba(108,60,225,.06);box-shadow:0 0 0 3px rgba(108,60,225,.1)}
.weekend-date-option.next-weekend{border-color:var(--secondary);position:relative}
.weekend-date-option .date-label{font-weight:600;font-size:.9rem;color:var(--text)}
.weekend-date-option .date-sub{font-size:.75rem;color:var(--text-light);margin-top:2px}
.weekend-date-option .date-countdown{font-size:.75rem;color:var(--secondary);font-weight:600}
.weekend-date-option .next-badge{background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff;padding:2px 6px;border-radius:4px;font-size:.6rem;font-weight:700;text-transform:uppercase}
.booking-trip-info{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:.8rem;font-weight:600;margin-bottom:1rem}
.booking-trip-info.one-day{background:rgba(16,185,129,.08);color:#10B981}
.booking-trip-info.two-day{background:rgba(139,92,246,.08);color:#8B5CF6}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:all .35s ease}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:2.5rem;position:relative;box-shadow:var(--shadow-xl);animation:fadeInUp .4s ease}
.modal h2{font-size:1.4rem;font-weight:700;margin-bottom:1.5rem;letter-spacing:-.2px}
.modal .close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.4rem;color:var(--text-light);transition:all .2s;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal .close:hover{background:#F1F5F9;color:var(--text);transform:rotate(90deg)}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem;color:var(--text)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:12px;font-size:.9rem;transition:all .3s}
.form-group textarea{min-height:80px;resize:vertical}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(108,60,225,.08)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* DASHBOARD */
.dashboard{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 72px);max-width:100vw;overflow:hidden}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:1.5rem 0;overflow-y:auto}
.sidebar a{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.5rem;font-size:.9rem;color:var(--text-light);transition:all .3s;border-right:3px solid transparent}
.sidebar a:hover,.sidebar a.active{background:rgba(108,60,225,.06);color:var(--primary);border-right:3px solid var(--primary)}
.sidebar a i{width:20px;text-align:center}
.dash-content{padding:2.5rem;overflow-x:auto;min-width:0}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.25rem;margin-bottom:2rem}
.dash-stat{background:#fff;padding:1.75rem;border-radius:var(--radius);box-shadow:var(--shadow);transition:all .3s}
.dash-stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.dash-stat .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:.75rem}
.dash-stat h4{font-size:.85rem;color:var(--text-light);margin-bottom:.25rem}
.dash-stat .value{font-size:1.8rem;font-weight:800}

/* TABLE */
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:.85rem 1.25rem;text-align:left;border-bottom:1px solid var(--border);font-size:.875rem}
th{font-weight:600;color:var(--text-light);background:#FAFBFC;letter-spacing:.3px;text-transform:uppercase;font-size:.75rem}
.status{padding:.25rem .7rem;border-radius:999px;font-size:.75rem;font-weight:600}
.status-paid,.status-approved,.status-active{background:#D1FAE5;color:#065F46}
.status-pending{background:#FEF3C7;color:#92400E}
.status-rejected,.status-cancelled{background:#FEE2E2;color:#991B1B}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--text);color:#fff;padding:1rem 1.75rem;border-radius:999px;font-size:.9rem;z-index:300;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.175,.885,.32,1.275);box-shadow:var(--shadow-lg)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:linear-gradient(135deg,var(--success),#34D399)}
.toast.error{background:linear-gradient(135deg,var(--danger),#F87171)}

/* DETAILED TRIP PLAN — Professional styling */
.detailed-plan{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg)}
.dp-header{background:linear-gradient(135deg,#6C3CE1,#8B5CF6,#A855F7);color:#fff;padding:2rem 1.5rem;text-align:center;position:relative}
.dp-header h2{font-size:1.5rem;margin-bottom:.25rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.dp-header p{opacity:.85;font-size:.9rem}
.dp-section{background:#fff;padding:1.5rem;border-bottom:1px solid var(--border)}
.dp-section:last-child{border-bottom:none;border-radius:0 0 var(--radius) var(--radius)}
.dp-section-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;color:var(--primary)}
.dp-section-title i{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(108,60,225,.08);border-radius:8px;font-size:.8rem}
.dp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.dp-item{background:#F8FAFC;padding:.75rem 1rem;border-radius:10px;border:1px solid #F1F5F9}
.dp-label{display:block;font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.2rem}
.dp-value{font-size:.9rem;font-weight:500;color:var(--text)}
.dp-highlight{color:var(--primary);font-weight:700;font-size:1rem}
.dp-subsection{margin-top:1rem;padding-top:.75rem;border-top:1px solid #F1F5F9}
.dp-subsection h4{font-size:.9rem;font-weight:600;margin-bottom:.5rem;color:var(--text)}
.dp-table{width:100%;border-collapse:collapse;font-size:.85rem;border-radius:10px;overflow:hidden}
.dp-table thead{background:linear-gradient(135deg,rgba(108,60,225,.06),rgba(139,92,246,.04))}
.dp-table th{padding:.6rem .75rem;text-align:left;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.3px;color:var(--text-light)}
.dp-table td{padding:.6rem .75rem;border-top:1px solid #F1F5F9;color:var(--text)}
.dp-table tbody tr:hover{background:rgba(108,60,225,.02)}
.dp-list{padding-left:1.25rem;font-size:.88rem;color:var(--text-light);line-height:1.9}
.dp-list li{margin-bottom:.15rem}
.dp-tags{display:flex;flex-wrap:wrap;gap:.5rem}
.dp-tag{background:rgba(108,60,225,.06);color:var(--primary);padding:.35rem .75rem;border-radius:999px;font-size:.8rem;font-weight:500;display:flex;align-items:center;gap:.35rem}
.dp-tag-activity{background:rgba(6,214,160,.08);color:#059669}
.dp-timeline-block{margin-bottom:1rem;padding-left:1rem;border-left:3px solid var(--primary-light)}
.dp-timeline-header{font-weight:700;font-size:.95rem;color:var(--primary);margin-bottom:.35rem;padding:.25rem .5rem;background:rgba(108,60,225,.04);border-radius:6px;display:inline-block}
.dp-timeline-list{padding-left:1.25rem;font-size:.85rem;color:var(--text-light);line-height:1.9}
.dp-safety{background:rgba(239,68,68,.015)}
.dp-packing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.5rem}
.dp-packing-item{display:flex;align-items:center;gap:.5rem;font-size:.85rem;padding:.4rem .5rem;border-radius:8px;transition:background .2s}
.dp-packing-item:hover{background:rgba(108,60,225,.03)}
@media(max-width:600px){
  .dp-grid{grid-template-columns:1fr}
  .dp-packing-grid{grid-template-columns:1fr}
  .dp-header h2{font-size:1.2rem}
  .dp-table{font-size:.78rem}
  .dp-table th,.dp-table td{padding:.4rem .5rem}
}

/* REVIEWS — Enhanced */
.review-card{background:#F8FAFC;padding:1.25rem;border-radius:12px;margin-bottom:1rem;border:1px solid var(--border);transition:box-shadow .3s}
.review-card:hover{box-shadow:var(--shadow)}
.review-card .stars{color:#F59E0B;margin-bottom:.25rem;font-size:.9rem}
.review-card .reviewer{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.review-card .review-text{font-size:.88rem;color:var(--text-light);margin-top:.5rem;line-height:1.7}
.review-card .review-title{font-weight:600;font-size:.95rem;margin-bottom:.25rem}
.review-card .verified-badge{background:linear-gradient(135deg,#10B981,#059669);color:#fff;padding:.15rem .5rem;border-radius:999px;font-size:.7rem;font-weight:600}
.review-card .review-meta{display:flex;align-items:center;gap:.75rem;margin-top:.5rem;font-size:.8rem;color:var(--text-light)}
.review-card .review-actions{display:flex;gap:.5rem;margin-top:.5rem}
.review-card .admin-reply{background:rgba(108,60,225,.05);border-left:3px solid var(--primary);padding:.75rem 1rem;margin-top:.75rem;border-radius:0 8px 8px 0;font-size:.85rem}
.review-card .admin-reply strong{color:var(--primary)}
.star-input{display:flex;gap:.25rem;margin-bottom:.5rem}
.star-input i{font-size:1.5rem;color:var(--border);cursor:pointer;transition:.2s}
.star-input i.active,.star-input i:hover{color:#F59E0B}
.rating-breakdown{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.rating-bar{display:flex;align-items:center;gap:.5rem;font-size:.8rem}
.rating-bar .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.rating-bar .bar-fill{height:100%;background:linear-gradient(90deg,#F59E0B,#FBBF24);border-radius:4px;transition:width .5s ease}
.recommend-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;font-weight:600}
.recommend-badge.yes{background:rgba(16,185,129,.1);color:var(--success)}
.recommend-badge.no{background:rgba(239,68,68,.1);color:var(--danger)}

/* BLOG CARDS & PAGES */
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem}
.blog-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s;cursor:pointer}
.blog-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.blog-card .blog-cover{height:200px;background-size:cover;background-position:center;position:relative}
.blog-card .blog-cover .blog-category{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;padding:.25rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;backdrop-filter:blur(4px)}
.blog-card .blog-cover .blog-featured{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff;padding:.25rem .75rem;border-radius:999px;font-size:.7rem;font-weight:700}
.blog-card .blog-body{padding:1.25rem}
.blog-card .blog-body h3{font-size:1.1rem;margin-bottom:.5rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blog-card .blog-body .blog-excerpt{color:var(--text-light);font-size:.85rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.75rem}
.blog-card .blog-body .blog-footer{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-light)}
.blog-card .blog-body .blog-footer .author{display:flex;align-items:center;gap:.4rem;font-weight:500}
.blog-card .blog-body .blog-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem}
.blog-card .blog-body .blog-tags span{background:rgba(108,60,225,.08);color:var(--primary);padding:.15rem .5rem;border-radius:999px;font-size:.7rem;font-weight:500}
.blog-detail{max-width:800px;margin:0 auto}
.blog-detail .blog-hero{height:350px;border-radius:var(--radius);background-size:cover;background-position:center;margin-bottom:2rem;position:relative}
.blog-detail .blog-hero .overlay{position:absolute;bottom:0;left:0;right:0;padding:2rem;background:linear-gradient(transparent,rgba(0,0,0,.7));border-radius:0 0 var(--radius) var(--radius);color:#fff}
.blog-detail .blog-content{background:#fff;padding:2rem;border-radius:var(--radius);box-shadow:var(--shadow);line-height:1.9;font-size:.95rem}
.blog-detail .blog-content h2,.blog-detail .blog-content h3{margin:1.5rem 0 .75rem}
.blog-detail .blog-content p{margin-bottom:1rem}
.blog-detail .blog-content img{max-width:100%;border-radius:8px;margin:1rem 0}
.blog-status{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600}
.blog-status.approved{background:rgba(16,185,129,.1);color:var(--success)}
.blog-status.pending{background:rgba(245,158,11,.1);color:var(--warning)}
.blog-status.rejected{background:rgba(239,68,68,.1);color:var(--danger)}
.blog-editor textarea{min-height:300px;font-size:.95rem;line-height:1.8}
.blog-categories-filter{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.blog-categories-filter button{padding:.4rem 1rem;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:.8rem;font-weight:500;transition:all .2s}
.blog-categories-filter button:hover,.blog-categories-filter button.active{background:var(--primary);color:#fff;border-color:var(--primary)}


/* VERIFICATION BADGE */
.verified-badge{display:inline-flex;align-items:center;gap:.25rem;background:#D1FAE5;color:#065F46;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600}
.unverified-badge{display:inline-flex;align-items:center;gap:.25rem;background:#FEF3C7;color:#92400E;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:600}

/* AI RECOMMENDATION */
.rec-reasons{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.rec-reason{background:rgba(108,60,225,.08);color:var(--primary);padding:.15rem .5rem;border-radius:6px;font-size:.7rem;font-weight:500}
.ai-badge{background:linear-gradient(135deg,#6C3CE1,#F97316);color:#fff;padding:.25rem .7rem;border-radius:999px;font-size:.7rem;font-weight:700;box-shadow:0 2px 8px rgba(108,60,225,.2)}

/* CATEGORY CARDS — Horizontal Scroll Section */
.categories-section{padding:3.5rem 2rem;max-width:1280px;margin:0 auto}
.categories-section .section-title{font-size:1.6rem}
.categories-row{display:flex;gap:1.25rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:.5rem 0 1rem}
.categories-row::-webkit-scrollbar{display:none}
.cat-card{flex:0 0 calc((100% - 5 * 1.25rem) / 6);min-width:180px;height:240px;border-radius:20px;position:relative;overflow:hidden;cursor:pointer;scroll-snap-align:start;box-shadow:0 4px 20px rgba(0,0,0,.1);border:1.5px solid rgba(255,255,255,.08);transition:all .35s cubic-bezier(.25,.46,.45,.94)}
.cat-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 12px 40px rgba(108,60,225,.2),0 0 0 2px rgba(139,92,246,.25)}
.cat-card-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s cubic-bezier(.25,.46,.45,.94),filter .4s ease;will-change:transform}
.cat-card:hover .cat-card-bg{transform:scale(1.1);filter:brightness(1.1) contrast(1.05)}
.cat-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.6) 100%);transition:all .35s ease;z-index:1}
.cat-card:hover .cat-card-overlay{background:linear-gradient(180deg,rgba(108,60,225,.05) 0%,rgba(108,60,225,.1) 40%,rgba(15,23,42,.7) 100%)}
.cat-card-glass{position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-radius:20px;z-index:2;pointer-events:none;transition:border-color .3s ease}
.cat-card:hover .cat-card-glass{border-color:rgba(139,92,246,.35)}
.cat-card-content{position:absolute;bottom:0;left:0;right:0;padding:1.25rem;z-index:3;display:flex;flex-direction:column;gap:.25rem}
.cat-card-name{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.cat-card-count{font-size:.72rem;font-weight:500;color:rgba(255,255,255,.7);letter-spacing:.3px}
.cat-card-icon{position:absolute;top:1rem;right:1rem;width:36px;height:36px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;z-index:3;border:1px solid rgba(255,255,255,.15);transition:all .3s ease;opacity:.7}
.cat-card:hover .cat-card-icon{opacity:1;background:rgba(139,92,246,.3);transform:scale(1.1);border-color:rgba(139,92,246,.4)}

/* ACTIVE VIBE CARD STATE */
.cat-card-active{transform:translateY(-6px) scale(1.03);box-shadow:0 0 0 3px rgba(139,92,246,.5),0 12px 40px rgba(108,60,225,.3);border-color:rgba(139,92,246,.5)}
.cat-card-active .cat-card-overlay{background:linear-gradient(180deg,rgba(108,60,225,.1) 0%,rgba(108,60,225,.15) 40%,rgba(15,23,42,.75) 100%)}
.cat-card-active .cat-card-glass{border-color:rgba(139,92,246,.5);box-shadow:inset 0 0 30px rgba(139,92,246,.1)}
.cat-card-active .cat-card-icon{opacity:1;background:rgba(139,92,246,.5);transform:scale(1.15);border-color:rgba(139,92,246,.6)}
.cat-card-active .cat-card-name{text-shadow:0 2px 12px rgba(139,92,246,.5)}
.cat-card-active::after{content:'✓';position:absolute;top:10px;left:10px;width:24px;height:24px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;z-index:4;box-shadow:0 2px 8px rgba(108,60,225,.4);animation:fadeInUp .3s ease}

/* VIBE FILTER BUTTONS (Outings page) */
.vibe-filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;padding:.25rem 0}
.vibe-filter-btn{padding:.45rem 1rem;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--text-light);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .3s ease;white-space:nowrap}
.vibe-filter-btn:hover{border-color:var(--primary-light);color:var(--primary);background:rgba(108,60,225,.04);transform:translateY(-1px)}
.vibe-btn-active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(108,60,225,.25)}
.vibe-btn-active:hover{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;transform:translateY(-1px)}

/* FOOTER */
.footer{background:linear-gradient(135deg,#1E293B,#0F172A);color:#fff;padding:0;text-align:left}
.footer-main{max-width:1200px;margin:0 auto;padding:3.5rem 2rem 2rem;display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:2.5rem}
.footer-brand{display:flex;flex-direction:column;gap:.75rem}
.footer-brand .logo{font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:.6rem;color:#fff}
.footer-brand .logo i{background:linear-gradient(135deg,var(--primary),var(--primary-light));width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.footer-brand .tagline{font-size:.85rem;color:rgba(255,255,255,.5);line-height:1.6}
.footer-socials{display:flex;gap:.6rem;margin-top:.5rem}
.footer-socials a{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:.9rem;transition:all .3s}
.footer-socials a:hover{background:var(--primary);color:#fff;transform:translateY(-2px)}
.footer-col h4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);margin-bottom:1rem}
.footer-col a{display:block;font-size:.88rem;color:rgba(255,255,255,.65);padding:.3rem 0;transition:all .2s}
.footer-col a:hover{color:#fff;padding-left:.3rem}
.footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;max-width:1200px;margin:0 auto}
.footer-bottom p{font-size:.8rem;color:rgba(255,255,255,.4)}
.footer-bottom-links{display:flex;gap:1.5rem}
.footer-bottom-links a{font-size:.78rem;color:rgba(255,255,255,.4);transition:color .2s}
.footer-bottom-links a:hover{color:#fff}

/* CONTENT PAGES (About, Careers, Legal, etc.) */
.content-page{max-width:900px;margin:0 auto;padding:3rem 2rem}
.content-page .page-hero{text-align:center;margin-bottom:3rem}
.content-page .page-hero h1{font-size:2.2rem;font-weight:800;margin-bottom:.5rem;letter-spacing:-.5px}
.content-page .page-hero p{color:var(--text-light);font-size:1.05rem;max-width:600px;margin:0 auto}
.content-page .page-hero .hero-icon{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1.25rem}
.content-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem;margin-bottom:1.5rem}
.content-card h2{font-size:1.2rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.content-card h3{font-size:1rem;font-weight:600;margin:1rem 0 .5rem;color:var(--text)}
.content-card p,.content-card li{font-size:.9rem;color:var(--text-light);line-height:1.8}
.content-card ul{padding-left:1.25rem;margin:.5rem 0}
.content-card ul li{margin-bottom:.35rem}

/* TEAM GRID */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.25rem;margin-top:1rem}
.team-member{text-align:center;padding:1.5rem 1rem;border-radius:var(--radius);background:#F8FAFC;transition:all .3s}
.team-member:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.team-member .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;margin:0 auto .75rem}
.team-member h4{font-size:.9rem;font-weight:700}
.team-member p{font-size:.78rem;color:var(--text-light)}

/* STATS COUNTER GRID */
.counter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.25rem;margin:1.5rem 0}
.counter-item{text-align:center;padding:1.25rem;border-radius:12px;background:linear-gradient(135deg,rgba(108,60,225,.04),rgba(108,60,225,.08))}
.counter-item .num{font-size:1.8rem;font-weight:800;color:var(--primary)}
.counter-item .label{font-size:.78rem;color:var(--text-light);margin-top:.25rem}

/* JOB CARDS */
.job-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:1.5rem;transition:all .3s;cursor:pointer}
.job-card:hover{border-color:var(--primary);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.job-card h3{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.job-card .job-meta{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem}
.job-card .job-meta span{font-size:.78rem;background:#F1F5F9;padding:.2rem .6rem;border-radius:999px;color:var(--text-light)}
.job-card p{font-size:.85rem;color:var(--text-light);line-height:1.7}

/* SUPPORT FORM */
.support-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.support-category{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;transition:all .3s}
.support-category:hover{border-color:var(--primary);background:rgba(108,60,225,.03);transform:translateY(-3px)}
.support-category i{font-size:1.5rem;color:var(--primary);margin-bottom:.5rem}
.support-category h4{font-size:.9rem;font-weight:600}
.support-category p{font-size:.78rem;color:var(--text-light)}

/* LEGAL SIDEBAR NAV */
.legal-layout{display:grid;grid-template-columns:220px 1fr;gap:2rem;max-width:1100px;margin:0 auto;padding:3rem 2rem}
.legal-sidebar{position:sticky;top:90px;height:fit-content}
.legal-sidebar a{display:block;padding:.5rem .75rem;border-radius:8px;font-size:.85rem;color:var(--text-light);margin-bottom:.25rem;transition:all .2s;border-left:3px solid transparent}
.legal-sidebar a:hover,.legal-sidebar a.active{background:rgba(108,60,225,.06);color:var(--primary);border-left-color:var(--primary)}

/* WISHLIST */
.wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.wishlist-card{position:relative}
.wishlist-heart{position:absolute;top:12px;left:12px;z-index:5;background:rgba(255,255,255,.9);width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.wishlist-heart:hover{transform:scale(1.15)}
.wishlist-heart.active{color:var(--danger);background:#fff}

/* NOTIFICATION PANEL */
.notif-panel{position:absolute;top:100%;right:0;width:360px;max-height:480px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-xl);overflow:hidden;z-index:200;display:none}
.notif-panel.show{display:block}
.notif-panel .notif-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.notif-panel .notif-header h4{font-size:.9rem;font-weight:700}
.notif-list{overflow-y:auto;max-height:400px}
.notif-item{padding:.85rem 1.25rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s;display:flex;gap:.75rem;align-items:flex-start}
.notif-item:hover{background:#F8FAFC}
.notif-item.unread{background:rgba(108,60,225,.03);border-left:3px solid var(--primary)}
.notif-item .notif-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.notif-item .notif-body h5{font-size:.85rem;font-weight:600;margin-bottom:.15rem}
.notif-item .notif-body p{font-size:.78rem;color:var(--text-light)}
.notif-item .notif-body .notif-time{font-size:.7rem;color:var(--text-light);margin-top:.2rem}

/* WALLET */
.wallet-card{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:20px;padding:2rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
.wallet-card::before{content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%}
.wallet-card::after{content:'';position:absolute;bottom:-30%;left:-10%;width:150px;height:150px;background:rgba(255,255,255,.05);border-radius:50%}
.wallet-card h4{font-size:.85rem;opacity:.7;margin-bottom:.25rem}
.wallet-card .balance{font-size:2.5rem;font-weight:800;position:relative;z-index:1}
.wallet-card .wallet-actions{display:flex;gap:.75rem;margin-top:1rem;position:relative;z-index:1}
.wallet-card .wallet-actions button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.2);padding:.5rem 1rem;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .3s;backdrop-filter:blur(8px)}
.wallet-card .wallet-actions button:hover{background:rgba(255,255,255,.35);transform:translateY(-1px)}
.txn-list{margin-top:1rem}
.txn-item{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--border)}
.txn-item:last-child{border-bottom:none}
.txn-item .txn-info{display:flex;align-items:center;gap:.75rem}
.txn-item .txn-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.txn-item .txn-info h5{font-size:.88rem;font-weight:600}
.txn-item .txn-info p{font-size:.75rem;color:var(--text-light)}
.txn-item .txn-amount{font-weight:700;font-size:.95rem}
.txn-item .txn-amount.credit{color:var(--success)}
.txn-item .txn-amount.debit{color:var(--danger)}

/* PARTNER PAGE */
.partner-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem;margin:1.5rem 0}
.partner-step{text-align:center;padding:1.5rem;border-radius:var(--radius);background:#fff;border:1.5px solid var(--border);transition:all .3s}
.partner-step:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:var(--shadow)}
.partner-step .step-num{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;margin:0 auto .75rem}
.partner-step h4{font-size:.9rem;font-weight:700;margin-bottom:.25rem}
.partner-step p{font-size:.8rem;color:var(--text-light)}

/* ACCORDION (mobile footer + FAQ) */
.accordion-item{border-bottom:1px solid rgba(255,255,255,.08)}
.accordion-header{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;cursor:pointer;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);transition:color .2s}
.accordion-header:hover{color:rgba(255,255,255,.7)}
.accordion-header i{transition:transform .3s;font-size:.7rem}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.accordion-body.open{max-height:300px}
.accordion-body a{display:block;font-size:.88rem;color:rgba(255,255,255,.65);padding:.3rem 0;transition:all .2s}
.accordion-body a:hover{color:#fff;padding-left:.3rem}

/* RESPONSIVE for new components */
@media(max-width:768px){
  .footer-main{grid-template-columns:1fr;gap:0;padding:2rem 1.5rem 1rem}
  .footer-brand{margin-bottom:1rem}
  .footer-col{display:none}
  .footer-accordion{display:block !important}
  .footer-bottom{flex-direction:column;text-align:center;padding:1rem 1.5rem}
  .legal-layout{grid-template-columns:1fr;padding:2rem 1rem}
  .legal-sidebar{position:static;display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
  .legal-sidebar a{border-left:none;border-bottom:2px solid transparent}
  .support-grid{grid-template-columns:1fr}
  .content-page{padding:2rem 1rem}
  .content-page .page-hero h1{font-size:1.7rem}
  .team-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .notif-panel{width:100vw;right:-1rem;border-radius:0 0 var(--radius) var(--radius)}
  .wallet-card .balance{font-size:2rem}
  .wishlist-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .wishlist-grid{grid-template-columns:1fr}
  .counter-grid{grid-template-columns:1fr 1fr}
  .partner-steps{grid-template-columns:1fr}
}

/* RESPONSIVE */
@media(max-width:1024px){
  .hero h1{font-size:3rem}
  .section{padding:3rem 1.5rem}
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
  .dashboard{grid-template-columns:220px 1fr}
  .stats-bar{gap:2.5rem;padding:2rem 1.5rem}
  .cat-card{flex:0 0 calc((100% - 4 * 1.25rem) / 5);min-width:180px}
}
@media(max-width:768px){
  .hero{height:85vh;min-height:550px;border-radius:0 0 20px 20px}
  .hero h1{font-size:2rem;letter-spacing:-.5px}
  .hero .hero-tagline{font-size:1rem;margin-bottom:1.5rem}
  .hero-search{max-width:90%;padding:.3rem .3rem .3rem 1rem}
  .hero-search input{font-size:.9rem}
  .hero-search-btn{padding:.6rem 1rem;font-size:.8rem}
  .hero-tags{gap:.4rem}
  .hero-tag{font-size:.75rem;padding:.3rem .75rem}
  .hero-content{padding:1.5rem}
  .btn-glass{padding:.65rem 1.3rem;font-size:.85rem}
  .hero-caption{display:none}
  .hero-playpause{bottom:1.5rem;right:1.5rem;width:32px;height:32px;font-size:.7rem}
  .hero-dots{bottom:1.5rem}
  .cards-grid{grid-template-columns:1fr}
  .dashboard{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-admin-nav{display:flex !important;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
  .mobile-admin-nav a{padding:.5rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;background:#F1F5F9;color:var(--text);text-decoration:none;white-space:nowrap}
  .mobile-admin-nav a.active{background:var(--primary);color:#fff}

<!-- APP CONTAINER -->
<main id="app"></main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── GLOBAL ERROR HANDLING & LOGGING ────────────────────────────
window.addEventListener('error', function(e) {
  console.error('[VIBES_ERROR]', e.message, e.filename, e.lineno, e.colno);
  // Prevent error from breaking the app - show a toast if UI is available
  if (typeof toast === 'function' && e.message && !e.message.includes('Script error')) {
    // Only show user-facing toast for actionable errors
  }
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('[VIBES_UNHANDLED_PROMISE]', e.reason);
  // Prevent unhandled rejections from breaking navigation
  e.preventDefault();
});

// ─── STATE ──────────────────────────────────────────────────────
// SECURITY: Store user info in sessionStorage (not localStorage) — token is in httpOnly cookie
let currentUser = JSON.parse(sessionStorage.getItem('vibes_user') || 'null');
let authToken = sessionStorage.getItem('vibes_token') || null;
let outings = [];
let currentPage = 'home';
let selectedVibe = null;
let bookingWalletBalance = 0;
let _navigating = false; // Guard against concurrent navigate() calls
const SITE_NAME = 'VIBES@Outing';
const SITE_ORIGIN = window.location.origin;
const DEFAULT_SEO = {
  title: 'VIBES@Outing - GenZ Group Outings | Discover, Join & Explore',
  description: 'VIBES@Outing - Book premium group outings & weekend trips from Bangalore. Earn ₹100 Vibes Wallet credit on every booking — travel rewards, trip cashback & budget travel deals.',
};

// ─── ANALYTICS: lightweight event tracking (Google Analytics + dataLayer) ──
function trackEvent(name, params = {}) {
  try {
    if (typeof gtag === 'function') gtag('event', name, params);
    else if (window.dataLayer) window.dataLayer.push({ event: name, ...params });
  } catch (e) { /* analytics must never break the app */ }
}

// ─── VIBES NEW-USER OFFER: sticky announcement bar ─────────────
function initOfferBar() {
  const bar = document.getElementById('offerBar');
  if (!bar) return;
  if (sessionStorage.getItem('vibes_offer_dismissed') === '1') { bar.style.display = 'none'; return; }
  // Logged-in users see "Book Now"; guests see the sign-up claim CTA
  const cta = document.getElementById('offerBarCta');
  if (cta) cta.textContent = currentUser ? 'Book Now' : 'Sign Up & Claim ₹100';
  bar.style.display = 'flex';
  trackEvent('offer_banner_view', { placement: 'announcement_bar', logged_in: !!currentUser });
}

function offerBarCTA() {
  trackEvent('offer_banner_click', { placement: 'announcement_bar', logged_in: !!currentUser });
  if (currentUser) navigate('outings');
  else { sessionStorage.setItem('vibes_offer_intent', '1'); showSignup(); }
}

function dismissOfferBar() {
  sessionStorage.setItem('vibes_offer_dismissed', '1');
  const bar = document.getElementById('offerBar');
  if (bar) bar.style.display = 'none';
}

function claimWelcomeBonus() {
  trackEvent('offer_banner_click', { placement: 'welcome_bonus_section', logged_in: !!currentUser });
  if (currentUser) navigate('outings');
  else { sessionStorage.setItem('vibes_offer_intent', '1'); showSignup(); }
}


// ─── SECURITY: Client-side HTML escaping (defense-in-depth) ─────
function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeImageUrl(url) {
  if (!url || typeof url !== 'string') return '';
  // Allow relative paths (e.g. /outing_pic/...) — server handles WebP negotiation
  if (url.startsWith('/')) return url;
  // Only allow http/https URLs
  try { const u = new URL(url); if (u.protocol === 'http:' || u.protocol === 'https:') return url; } catch(e) {}
  return '';
}

function normalizeSlug(value) {
  return String(value || '')
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9-]/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function buildOutingPath(slug) {
  return '/outings/' + encodeURIComponent(normalizeSlug(slug));
}

function upsertMetaTag(selector, attr, key, value) {
  if (!value) return;
  let el = document.head.querySelector(selector);
  if (!el) {
    el = document.createElement('meta');
    el.setAttribute(attr, key);
    document.head.appendChild(el);
  }
  el.setAttribute('content', value);
}

function upsertCanonical(url) {
  let canonical = document.head.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement('link');
    canonical.setAttribute('rel', 'canonical');
    document.head.appendChild(canonical);
  }
  canonical.setAttribute('href', url);
}

function setSeoMeta({ title, description, url, image }) {
  const metaTitle = title || DEFAULT_SEO.title;
  const metaDescription = description || DEFAULT_SEO.description;
  const metaUrl = url || (SITE_ORIGIN + window.location.pathname);
  const metaImage = image || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80';

  document.title = metaTitle;
  upsertMetaTag('meta[name="description"]', 'name', 'description', metaDescription);
  upsertMetaTag('meta[property="og:title"]', 'property', 'og:title', metaTitle);
  upsertMetaTag('meta[property="og:description"]', 'property', 'og:description', metaDescription);
  upsertMetaTag('meta[property="og:url"]', 'property', 'og:url', metaUrl);
  upsertMetaTag('meta[property="og:image"]', 'property', 'og:image', metaImage);
  upsertMetaTag('meta[name="twitter:title"]', 'name', 'twitter:title', metaTitle);
  upsertMetaTag('meta[name="twitter:description"]', 'name', 'twitter:description', metaDescription);
  upsertMetaTag('meta[name="twitter:image"]', 'name', 'twitter:image', metaImage);
  upsertCanonical(metaUrl);
}

function clearOutingStructuredData() {
  const old = document.getElementById('outing-jsonld');
  if (old) old.remove();
}

function setOutingStructuredData(outing) {
  clearOutingStructuredData();
  const slug = outing.slug || normalizeSlug(outing.title);
  const url = SITE_ORIGIN + buildOutingPath(slug);
  let images = [];
  try { images = typeof outing.images === 'string' ? JSON.parse(outing.images) : (outing.images || []); } catch (e) { images = []; }
  const safeImages = images.filter(Boolean).map(u => u.startsWith('http') ? u : (SITE_ORIGIN + u));
  const primaryImage = outing.image_url ? (outing.image_url.startsWith('http') ? outing.image_url : (SITE_ORIGIN + outing.image_url)) : '';
  if (primaryImage && !safeImages.includes(primaryImage)) safeImages.unshift(primaryImage);

  const payload = {
    '@context': 'https://schema.org',
    '@type': 'TouristTrip',
    name: outing.title,
    description: outing.description || DEFAULT_SEO.description,
    image: safeImages,
    touristType: 'Group Travelers',
    itinerary: outing.location,
    provider: {
      '@type': 'Organization',
      name: SITE_NAME,
      url: SITE_ORIGIN,
    },
    offers: {
      '@type': 'Offer',
      url,
      priceCurrency: 'INR',
      price: String(Math.ceil((outing.cost || 0) * 0.20)),
      availability: (outing.max_participants - outing.current_participants) > 0 ? 'https://schema.org/InStock' : 'https://schema.org/SoldOut',
    },
  };

  const script = document.createElement('script');
  script.id = 'outing-jsonld';
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify(payload);
  document.head.appendChild(script);
}

function setOutingSeo(outing) {
  const slug = outing.slug || normalizeSlug(outing.title);
  const path = buildOutingPath(slug);
  const url = SITE_ORIGIN + path;
  const image = outing.image_url ? (outing.image_url.startsWith('http') ? outing.image_url : SITE_ORIGIN + outing.image_url) : undefined;
  setSeoMeta({
    title: `${outing.title} | ${SITE_NAME}`,
    description: (outing.description || DEFAULT_SEO.description).slice(0, 160),
    url,
    image,
  });
  setOutingStructuredData(outing);
}

function setDefaultSeo(pathname) {
  clearOutingStructuredData();
  setSeoMeta({ url: SITE_ORIGIN + pathname });
}

function resolvePageFromUrl() {
  const cleanPath = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
  if (cleanPath === '/') {
    const hashPage = (window.location.hash || '').replace(/^#/, '');
    return hashPage || 'home';
  }
  if (cleanPath === '/outings') return 'outings';
  if (cleanPath.startsWith('/outings/')) {
    const slug = normalizeSlug(decodeURIComponent(cleanPath.replace('/outings/', '')));
    if (slug) return 'outing-slug:' + slug;
    return 'outings';
  }
  return 'home';
}

async function migrateLegacyOutingHashRoute() {
  const hash = (window.location.hash || '').replace(/^#/, '');
  if (!/^outing-\d+$/.test(hash)) return null;
  const legacyId = parseInt(hash.split('-')[1], 10);
  if (!legacyId) return null;
  const legacyOuting = await api('/outings/' + legacyId, { showToast: false });
  if (!legacyOuting || !legacyOuting.slug) return null;
  const nextPage = 'outing-slug:' + legacyOuting.slug;
  history.replaceState({ page: nextPage }, '', buildOutingPath(legacyOuting.slug));
  return nextPage;
}

async function navigateToOuting(outingRef, skipHistory) {
  if (typeof outingRef === 'string' && !/^\d+$/.test(outingRef)) {
    const slug = normalizeSlug(outingRef);
    if (!slug) return;
    return navigate('outing-slug:' + slug, !!skipHistory);
  }

  const outingId = parseInt(outingRef, 10);
  if (!outingId) return;
  const outing = await api('/outings/' + outingId, { showToast: false });
  if (!outing || !outing.slug) {
    toast('Outing not found', 'error');
    return navigate('outings', !!skipHistory);
  }
  return navigate('outing-slug:' + outing.slug, !!skipHistory);
}
// Blur placeholders cache
let _blurPlaceholders = null;
async function loadBlurPlaceholders() {
  if (_blurPlaceholders) return _blurPlaceholders;
  try {
    const res = await fetch('/blur-placeholders.json');
    _blurPlaceholders = await res.json();
  } catch(e) { _blurPlaceholders = {}; }
  return _blurPlaceholders;
}
function getBlurDataUrl(imgUrl) {
  if (!_blurPlaceholders) return '';
  // Try exact match first, then try .webp variant for local images
  if (_blurPlaceholders[imgUrl]) return _blurPlaceholders[imgUrl];
  const webpUrl = imgUrl.replace(/\.(png|jpe?g)$/i, '.webp');
  return _blurPlaceholders[webpUrl] || '';
}
// Initialize blur placeholders on load
loadBlurPlaceholders();

// ─── CARD IMAGE CAROUSEL ────────────────────────────────────────
function slideCarousel(carouselId, target) {
  const el = document.getElementById(carouselId);
  if (!el) return;
  const inner = el.querySelector('.card-carousel-inner');
  const dots = el.querySelectorAll('.carousel-dot');
  const total = inner.children.length;
  let idx = parseInt(el.dataset.idx) || 0;
  if (target === 'prev') idx = (idx - 1 + total) % total;
  else if (target === 'next') idx = (idx + 1) % total;
  else idx = parseInt(target);
  el.dataset.idx = idx;
  inner.style.transform = `translateX(-${idx * 100}%)`;
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
}

// ─── BROWSER HISTORY ────────────────────────────────────────────
window.addEventListener('popstate', (e) => {
  const page = (e.state && e.state.page) ? e.state.page : resolvePageFromUrl();
  currentPage = page;
  navigate(page, true);
});

// ─── API ────────────────────────────────────────────────────────
// Use same-origin proxy via Vercel rewrite in production, direct in dev
const API_BASE = window.VIBES_API_BASE || (window.location.hostname === 'localhost' ? '' : '');
const RAILWAY_DIRECT = 'https://vibesouting-production.up.railway.app';

// Fetch public config (Google Client ID etc.)
window.GOOGLE_CLIENT_ID = '';
window._googleConfigReady = fetch((API_BASE || '') + '/api/config').then(r => r.json()).then(cfg => {
  window.GOOGLE_CLIENT_ID = cfg.googleClientId || '';
}).catch(() => {
  // Fallback: try Railway direct
  return fetch('https://vibesouting-production.up.railway.app/api/config').then(r => r.json()).then(cfg => {
    window.GOOGLE_CLIENT_ID = cfg.googleClientId || '';
  }).catch(() => {});
});

const api = async (url, opts = {}, _retryCount = 0) => {
  const MAX_RETRIES = 2;
  const TIMEOUT_MS = 15000;
  const showToast = opts.showToast !== false;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    const base = API_BASE || '';
    const res = await fetch(base + '/api' + url, {
      method: opts.method || 'GET',
      headers,
      credentials: 'include',
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: controller.signal,
    });
    clearTimeout(timeoutId);

    if (res.status === 401) {
      // Background/non-critical calls (e.g. notification polling) must never tear
      // down the session or trigger any navigation.
      if (opts.background) return { success: false, sessionExpired: true };
      // For primary calls: clear auth state + refresh the nav, but DO NOT force a
      // redirect. The user stays on their current route. This fixes the bug where
      // clicking a page (Wallet/Dashboard/etc.) bounced back to Home after 1–2s
      // because a single 401 ran logout() → navigate('home').
      if (currentUser || authToken) {
        clearSession();
        toast('Session expired. Please login again.', 'error');
      }
      return { success: false, sessionExpired: true };
    }

    if (res.status === 429) {
      const msg = 'Too many requests. Please wait a moment and try again.';
      if (showToast) toast(msg, 'error');
      return { success: false, message: msg };
    }

    const contentType = res.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      console.error('API Error: Expected JSON but got', contentType, 'from', base + '/api' + url);
      // Try to parse as JSON anyway (some proxies strip content-type)
      try {
        const text = await res.text();
        const parsed = JSON.parse(text);
        return parsed;
      } catch (_) {}
      // Retry with direct Railway URL if proxy returned non-JSON (HTML 404 etc.)
      if (!API_BASE && _retryCount === 0 && RAILWAY_DIRECT) {
        console.warn('Retrying with direct Railway URL...');
        try {
          const directRes = await fetch(RAILWAY_DIRECT + '/api' + url, {
            method: opts.method || 'GET',
            headers,
            credentials: 'include',
            body: opts.body ? JSON.stringify(opts.body) : undefined,
          });
          if (directRes.ok) return await directRes.json();
        } catch (_) {}
      }
      const msg = res.status >= 500 ? 'Server temporarily unavailable. Please try again.' : 'Failed to load data. Please try again.';
      if (showToast) toast(msg, 'error');
      return { success: false, message: msg };
    }

    const data = await res.json();
    if (!res.ok && data.message && showToast) {
      toast(data.message, 'error');
    }
    return data;
  } catch (err) {
    clearTimeout(timeoutId);
    const isTimeout = err.name === 'AbortError';
    const isNetwork = err.message?.includes('Failed to fetch') || err.message?.includes('NetworkError') || err.message?.includes('Network request failed');

    console.error(`API Error [${opts.method || 'GET'} /api${url}]:`, err.name, err.message);

    // Retry once on transient failures (cold starts, timeouts)
    if (_retryCount < MAX_RETRIES && (isTimeout || isNetwork)) {
      console.warn(`Retrying API call (attempt ${_retryCount + 2}/${MAX_RETRIES + 1})...`);
      await new Promise(r => setTimeout(r, 1000 * (_retryCount + 1)));
      return api(url, opts, _retryCount + 1);
    }

    let msg;
    if (isTimeout) {
      msg = 'Request timed out. The server may be starting up — please try again in a moment.';
    } else if (isNetwork) {
      msg = 'Unable to reach the server. Please check your internet connection and try again.';
    } else {
      msg = 'Something went wrong. Please try again.';
    }
    if (showToast) toast(msg, 'error');
    return { success: false, message: msg };
  }
};

}

// ─── GOOGLE SIGN-IN ─────────────────────────────────────────────
let _googleSignInInitialized = false;
async function handleGoogleSignIn() {
  if (typeof google === 'undefined' || !google.accounts) {
    toast('Google Sign-In is loading. Please try again in a moment.', 'error');
    return;
  }
  // Ensure config is loaded before initializing
  if (!window.GOOGLE_CLIENT_ID) {
    try { await window._googleConfigReady; } catch(e) {}
  }
  if (!window.GOOGLE_CLIENT_ID) {
    toast('Google Sign-In is not configured. Please try again later.', 'error');
    return;
  }
  if (!_googleSignInInitialized) {
    google.accounts.id.initialize({
      client_id: window.GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
      auto_select: false,
      cancel_on_tap_outside: true,
    });
    _googleSignInInitialized = true;
  }
  // Use One Tap / popup prompt
  google.accounts.id.prompt((notification) => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      // Fallback: use popup with google.accounts.oauth2
      // If prompt is blocked, use the renderButton approach
      const tempDiv = document.createElement('div');
      tempDiv.id = 'g_id_onload_temp';
      tempDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10001;background:white;padding:2rem;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.2)';
      tempDiv.innerHTML = '<p style="text-align:center;margin-bottom:1rem;font-weight:600">Select your Google account</p><div id="google-btn-container"></div><p style="text-align:center;margin-top:1rem"><a href="#" onclick="this.parentElement.parentElement.remove()" style="color:var(--primary);font-size:.85rem">Cancel</a></p>';
      document.body.appendChild(tempDiv);
      google.accounts.id.renderButton(document.getElementById('google-btn-container'), {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        width: 300,
        text: 'continue_with',
        shape: 'rectangular',
      });
    }
  });
}

async function handleGoogleCredential(response) {
  // Remove any temp popup
  const tempDiv = document.getElementById('g_id_onload_temp');
  if (tempDiv) tempDiv.remove();

  // Show loading state
  const modalContent = document.getElementById('modalContent');
  const prevHtml = modalContent ? modalContent.innerHTML : '';
  if (modalContent) {
    modalContent.innerHTML = '<div style="text-align:center;padding:3rem"><div class="loading-spinner"></div><p style="margin-top:1rem;color:var(--text-light)">Signing in with Google...</p></div>';
  }

  try {
    const data = await api('/auth/google', { method: 'POST', body: { credential: response.credential } });
    if (data.success) {
      currentUser = data.user;
      authToken = data.token;
      sessionStorage.setItem('vibes_user', JSON.stringify(data.user));
      sessionStorage.setItem('vibes_token', data.token);
      closeModal();
      renderNav();
      navigate('home');
      if (data.bonusGranted) { trackEvent('welcome_bonus_credited', { method: 'google', amount: data.bonusAmount }); toast('🎉 Welcome to Vibes Outing! ₹' + (data.bonusAmount || 100) + ' has been added to your wallet.', 'success'); }
      else toast('Successfully signed in with Google!', 'success');
    } else {
      if (modalContent) modalContent.innerHTML = prevHtml;
      toast(data.message || 'Google sign-in failed', 'error');
    }
  } catch (err) {
    console.error('Google sign-in error:', err);
    if (modalContent) modalContent.innerHTML = prevHtml;
    toast('Google sign-in failed. Please try again.', 'error');
  }
}
