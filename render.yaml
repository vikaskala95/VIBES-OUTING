services:
  - type: web
    name: vibesouting
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: vibes-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.vibesouting.in,https://vibesouting.in,https://api.vibesouting.in
      - key: PASSWORD_RESET_URL
        value: https://vibesouting.in
      - key: API_ONLY
        value: "true"

databases:
  - name: vibes-db
    plan: starter
      sizeGB: 1
