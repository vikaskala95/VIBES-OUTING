services:
  - type: web
    name: vibesouting
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DB_PATH
        value: /var/data/vibes.db
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.vibesouting.in,https://vibesouting.in,https://api.vibesouting.in
      - key: PASSWORD_RESET_URL
        value: https://www.vibesouting.in
      - key: API_ONLY
        value: "true"
    disk:
      name: vibes-data
      mountPath: /var/data
      sizeGB: 1
